<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码生成器 - Xin Utilities</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --bg-card: #141414;
      --fg: #ffffff;
      --fg-muted: #86868b;
      --accent: #ff9f0a;
      --accent-hover: #ff8c00;
      --border: rgba(255,255,255,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #6e6e73; border-radius: 4px; }

    .nav-blur {
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      background: rgba(0,0,0,0.72);
    }

    .btn {
      padding: 0.625rem 1.25rem;
      border-radius: 980px;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: var(--fg);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255,255,255,0.15);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .input-field {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: var(--fg);
      font-size: 0.875rem;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,255,255,0.08);
    }

    .input-field::placeholder {
      color: var(--fg-muted);
    }

    .qr-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      padding: 2rem;
      background: repeating-conic-gradient(#1a1a1a 0% 25%, #0a0a0a 0% 50%) 50% / 20px 20px;
      border-radius: 12px;
    }

    .qr-placeholder {
      text-align: center;
      color: var(--fg-muted);
    }

    #qrcode {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--fg);
      margin-bottom: 0.5rem;
      display: block;
    }

    .hint-text {
      font-size: 0.75rem;
      color: var(--fg-muted);
      margin-top: 0.5rem;
    }

    .color-input-wrapper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .color-input {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    .color-input::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-input::-webkit-color-swatch {
      border: 2px solid var(--border);
      border-radius: 8px;
    }

    .color-hex {
      font-family: monospace;
      font-size: 0.875rem;
      color: var(--fg-muted);
    }

    .shape-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .shape-option {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--fg-muted);
      font-size: 0.8125rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .shape-option:hover {
      background: rgba(255,255,255,0.1);
    }

    .shape-option.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .logo-upload {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logo-upload:hover {
      border-color: var(--accent);
      background: rgba(255,159,10,0.05);
    }

    .logo-preview {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }

    .logo-preview img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 8px;
      background: white;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .slider-container {
      display: flex;
      align-items: center;
    }

    .slider {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.1);
      outline: none;
      -webkit-appearance: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <nav class="fixed top-0 left-0 right-0 z-50 nav-blur">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../../index.html" class="flex items-center gap-3 text-gray-400 hover:text-white transition-colors">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span class="font-medium">返回工具集</span>
      </a>
      <h1 class="text-lg font-semibold">二维码生成器</h1>
      <div class="w-24"></div>
    </div>
  </nav>

  <main class="pt-20 pb-12 px-4">
    <div class="max-w-4xl mx-auto space-y-6">

      <!-- Input Section -->
      <div class="card p-6 space-y-6">
        <div>
          <label class="label">输入链接或文本</label>
          <input
            type="text"
            id="inputText"
            class="input-field"
            placeholder="https://example.com 或任意文本"
            autocomplete="off"
          >
        </div>

        <!-- Size and Color Settings -->
        <div class="settings-grid">
          <div class="setting-item">
            <label class="label">大小: <span id="sizeValue">256</span>px</label>
            <div class="slider-container">
              <input type="range" id="sizeSlider" class="slider" min="128" max="512" step="32" value="256">
            </div>
          </div>
          <div class="setting-item">
            <label class="label">前景色（码点）</label>
            <div class="color-input-wrapper">
              <input type="color" id="fgColor" class="color-input" value="#000000">
              <span class="color-hex" id="fgColorHex">#000000</span>
            </div>
          </div>
          <div class="setting-item">
            <label class="label">背景色</label>
            <div class="color-input-wrapper">
              <input type="color" id="bgColor" class="color-input" value="#ffffff">
              <span class="color-hex" id="bgColorHex">#ffffff</span>
            </div>
          </div>
        </div>

        <!-- Dot Shape -->
        <div class="setting-item">
          <label class="label">码点形状</label>
          <div class="shape-options" id="dotShapeOptions">
            <button class="shape-option active" data-value="square">方形</button>
            <button class="shape-option" data-value="rounded">圆角</button>
            <button class="shape-option" data-value="dots">圆点</button>
            <button class="shape-option" data-value="extra-rounded">大圆角</button>
            <button class="shape-option" data-value="classy">经典</button>
            <button class="shape-option" data-value="classy-rounded">经典圆角</button>
          </div>
        </div>

        <!-- Corner Shape -->
        <div class="setting-item">
          <label class="label">定位角形状</label>
          <div class="shape-options" id="cornerShapeOptions">
            <button class="shape-option active" data-value="square">方形</button>
            <button class="shape-option" data-value="extra-rounded">圆角</button>
            <button class="shape-option" data-value="dot">圆形</button>
          </div>
        </div>

        <!-- Logo Upload -->
        <div class="setting-item">
          <label class="label">中心 Logo（可选）</label>
          <div id="logoUploadZone" class="logo-upload">
            <input type="file" id="logoInput" accept="image/*" class="hidden">
            <svg class="w-8 h-8 mx-auto mb-2 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
            <p class="text-sm text-gray-400">点击上传 Logo 图片</p>
            <p class="text-xs text-gray-600 mt-1">建议使用方形图片</p>
          </div>
          <div id="logoPreview" class="logo-preview hidden">
            <img id="logoPreviewImg" src="" alt="Logo">
            <div class="flex-1">
              <p class="text-sm" id="logoFileName">logo.png</p>
              <p class="text-xs text-gray-500">Logo 将显示在二维码中心</p>
            </div>
            <button class="btn btn-secondary text-sm" onclick="removeLogo()">移除</button>
          </div>
        </div>

        <button class="btn btn-primary w-full" onclick="generateQR()" id="generateBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          生成二维码
        </button>
      </div>

      <!-- QR Code Display -->
      <div class="card p-6">
        <h3 class="font-semibold mb-4">预览</h3>
        <div class="qr-container">
          <div class="qr-placeholder" id="placeholder">
            <svg class="w-16 h-16 mx-auto mb-2 opacity-30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
            <p>输入内容后点击生成</p>
          </div>
          <div id="qrcode" class="hidden"></div>
        </div>

        <div class="flex gap-2 justify-center mt-4" id="downloadSection" style="display: none;">
          <button class="btn btn-primary" onclick="downloadQR()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            下载 PNG
          </button>
        </div>
      </div>

    </div>
  </main>

  <script>
    // State
    let qrCode = null;
    let logoDataUrl = null;

    // Elements
    const inputText = document.getElementById('inputText');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const fgColor = document.getElementById('fgColor');
    const bgColor = document.getElementById('bgColor');
    const fgColorHex = document.getElementById('fgColorHex');
    const bgColorHex = document.getElementById('bgColorHex');
    const placeholder = document.getElementById('placeholder');
    const qrcodeDiv = document.getElementById('qrcode');
    const downloadSection = document.getElementById('downloadSection');
    const logoInput = document.getElementById('logoInput');
    const logoUploadZone = document.getElementById('logoUploadZone');
    const logoPreview = document.getElementById('logoPreview');
    const logoPreviewImg = document.getElementById('logoPreviewImg');
    const logoFileName = document.getElementById('logoFileName');

    // Shape selections
    let dotShape = 'square';
    let cornerShape = 'square';

    // Size slider handler
    sizeSlider.addEventListener('input', (e) => {
      sizeValue.textContent = e.target.value;
    });

    // Color input handlers
    fgColor.addEventListener('input', (e) => {
      fgColorHex.textContent = e.target.value.toUpperCase();
    });
    bgColor.addEventListener('input', (e) => {
      bgColorHex.textContent = e.target.value.toUpperCase();
    });

    // Shape option handlers
    document.getElementById('dotShapeOptions').addEventListener('click', (e) => {
      if (e.target.classList.contains('shape-option')) {
        document.querySelectorAll('#dotShapeOptions .shape-option').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        dotShape = e.target.dataset.value;
      }
    });

    document.getElementById('cornerShapeOptions').addEventListener('click', (e) => {
      if (e.target.classList.contains('shape-option')) {
        document.querySelectorAll('#cornerShapeOptions .shape-option').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        cornerShape = e.target.dataset.value;
      }
    });

    // Logo upload
    logoUploadZone.addEventListener('click', () => logoInput.click());
    logoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          logoDataUrl = ev.target.result;
          logoPreviewImg.src = logoDataUrl;
          logoFileName.textContent = file.name;
          logoUploadZone.classList.add('hidden');
          logoPreview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    function removeLogo() {
      logoDataUrl = null;
      logoInput.value = '';
      logoUploadZone.classList.remove('hidden');
      logoPreview.classList.add('hidden');
    }

    // Generate on Enter key
    inputText.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') generateQR();
    });

    function generateQR() {
      const text = inputText.value.trim();
      if (!text) {
        alert('请输入链接或文本');
        return;
      }

      // Clear previous
      qrcodeDiv.innerHTML = '';
      placeholder.classList.add('hidden');
      qrcodeDiv.classList.remove('hidden');
      downloadSection.style.display = 'flex';

      // Create QR code
      const size = parseInt(sizeSlider.value);

      const options = {
        width: size,
        height: size,
        type: 'svg',  // Use SVG to avoid canvas dots smear
        data: text,
        dotsOptions: {
          color: fgColor.value,
          type: dotShape,
          roundSize: false  // crispEdges for SVG
        },
        cornersSquareOptions: {
          color: fgColor.value,
          type: cornerShape
        },
        cornersDotOptions: {
          color: fgColor.value,
          type: cornerShape === 'dot' ? 'dot' : 'square'
        },
        backgroundOptions: {
          color: bgColor.value
        },
        qrOptions: {
          errorCorrectionLevel: 'H'
        }
      };

      // Add logo if exists
      if (logoDataUrl) {
        options.image = logoDataUrl;
        options.imageOptions = {
          crossOrigin: 'anonymous',
          margin: 8,
          imageSize: 0.4
        };
      }

      qrCode = new QRCodeStyling(options);
      qrCode.append(qrcodeDiv);
    }

    async function downloadQR() {
      if (!qrCode) {
        alert('请先生成二维码');
        return;
      }
      // Use getRawData for SVG -> PNG export
      const blob = await qrCode.getRawData('png');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'qrcode.png';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
