<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page-title="qrGenerator.title">二维码生成器 - Xin Utilities</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../shared/i18n/i18n.js"></script>
  <script src="../../shared/i18n/zh.js"></script>
  <script src="../../shared/i18n/en.js"></script>
  <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <script src="../../shared/api-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --bg-card: #141414;
      --fg: #ffffff;
      --fg-muted: #86868b;
      --accent: #ff9f0a;
      --accent-hover: #ff8c00;
      --border: rgba(255,255,255,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #6e6e73; border-radius: 4px; }

    .nav-blur {
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      background: rgba(0,0,0,0.72);
    }

    .btn {
      padding: 0.625rem 1.25rem;
      border-radius: 980px;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: var(--fg);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255,255,255,0.15);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .input-field {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: var(--fg);
      font-size: 0.875rem;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,255,255,0.08);
    }

    .input-field::placeholder {
      color: var(--fg-muted);
    }

    .qr-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      padding: 2rem;
      background: repeating-conic-gradient(#1a1a1a 0% 25%, #0a0a0a 0% 50%) 50% / 20px 20px;
      border-radius: 12px;
    }

    .qr-placeholder {
      text-align: center;
      color: var(--fg-muted);
    }

    #qrcode {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrCanvas {
      max-width: 100%;
      height: auto;
    }

    .label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--fg);
      margin-bottom: 0.5rem;
      display: block;
    }

    .hint-text {
      font-size: 0.75rem;
      color: var(--fg-muted);
      margin-top: 0.5rem;
    }

    .color-input-wrapper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .color-input {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    .color-input::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-input::-webkit-color-swatch {
      border: 2px solid var(--border);
      border-radius: 8px;
    }

    .color-hex {
      font-family: monospace;
      font-size: 0.875rem;
      color: var(--fg-muted);
    }

    .shape-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .shape-option {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--fg-muted);
      font-size: 0.8125rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .shape-option:hover {
      background: rgba(255,255,255,0.1);
    }

    .shape-option.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .logo-upload {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logo-upload:hover {
      border-color: var(--accent);
      background: rgba(255,159,10,0.05);
    }

    .logo-preview {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }

    .logo-preview img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 8px;
      background: white;
    }

    .logo-settings {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .logo-settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    .slider-with-value {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .slider-value {
      min-width: 48px;
      text-align: right;
      font-size: 0.8125rem;
      color: var(--fg-muted);
      font-family: monospace;
    }

    .qr-interactive {
      position: relative;
      cursor: default;
    }

    .qr-interactive.dragging {
      cursor: grabbing;
    }

    .logo-drag-hint {
      position: absolute;
      bottom: 0.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: var(--fg-muted);
      font-size: 0.6875rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .logo-drag-hint.visible {
      display: block;
    }

    .qr-interactive:hover .logo-drag-hint.visible {
      opacity: 1;
    }

    .reset-btn {
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: var(--fg-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: rgba(255,255,255,0.12);
      color: var(--fg);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .slider-container {
      display: flex;
      align-items: center;
    }

    .slider {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.1);
      outline: none;
      -webkit-appearance: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    .lang-toggle {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--fg);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lang-toggle:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .toggle-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .toggle-label .title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--fg);
    }

    .toggle-label .desc {
      font-size: 0.75rem;
      color: var(--fg-muted);
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 28px;
      background: rgba(255,255,255,0.1);
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .toggle-switch.active { background: var(--accent); }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .toggle-switch.active::after { transform: translateX(20px); }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.visible { opacity: 1; visibility: visible; }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--fg);
      cursor: pointer;
    }

    .modal-body { padding: 1.25rem; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--fg-muted);
      margin-top: 0.25rem;
    }

    .stats-section { margin-bottom: 1.25rem; }

    .stats-section h4 {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--fg-muted);
    }

    .device-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .device-bar .name { width: 80px; font-size: 0.8125rem; color: var(--fg-muted); }
    .device-bar .bar { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
    .device-bar .fill { height: 100%; background: var(--accent); border-radius: 4px; }
    .device-bar .count { width: 40px; text-align: right; font-size: 0.8125rem; }

    .tracking-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: rgba(255,159,10,0.1);
      border: 1px solid rgba(255,159,10,0.3);
      border-radius: 8px;
      margin-top: 1rem;
    }

    .tracking-info .text { font-size: 0.8125rem; color: var(--fg-muted); }
  </style>
</head>
<body>
  <nav class="fixed top-0 left-0 right-0 z-50 nav-blur">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../../index.html" class="flex items-center gap-3 text-gray-400 hover:text-white transition-colors">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span class="font-medium" data-i18n="common.back">返回工具集</span>
      </a>
      <h1 class="text-lg font-semibold" data-i18n="qrGenerator.title">二维码生成器</h1>
      <button id="langToggle" class="lang-toggle" onclick="I18n.toggle()" title="Switch Language">EN</button>
    </div>
  </nav>

  <main class="pt-20 pb-12 px-4">
    <div class="max-w-4xl mx-auto space-y-6">

      <!-- Input Section -->
      <div class="card p-6 space-y-6">
        <div>
          <label class="label" data-i18n="qrGenerator.inputLabel">输入链接或文本</label>
          <input
            type="text"
            id="inputText"
            class="input-field"
            placeholder="https://example.com 或任意文本"
            data-i18n-placeholder="qrGenerator.inputPlaceholder"
            autocomplete="off"
          >
        </div>

        <div class="toggle-wrapper" id="trackingToggleWrapper">
          <div class="toggle-label">
            <span class="title" data-i18n="qrGenerator.enableTracking">启用扫描统计</span>
            <span class="desc" data-i18n="qrGenerator.trackingDesc">追踪二维码被扫描的次数和设备信息</span>
          </div>
          <div class="toggle-switch" id="trackingToggle" onclick="toggleTracking()"></div>
        </div>

        <!-- Size and Color Settings -->
        <div class="settings-grid">
          <div class="setting-item">
            <label class="label"><span data-i18n="qrGenerator.size">大小</span>: <span id="sizeValue">256</span>px</label>
            <div class="slider-container">
              <input type="range" id="sizeSlider" class="slider" min="128" max="512" step="32" value="256">
            </div>
          </div>
          <div class="setting-item">
            <label class="label" data-i18n="qrGenerator.foregroundColor">前景色（码点）</label>
            <div class="color-input-wrapper">
              <input type="color" id="fgColor" class="color-input" value="#000000">
              <span class="color-hex" id="fgColorHex">#000000</span>
            </div>
          </div>
          <div class="setting-item">
            <label class="label" data-i18n="qrGenerator.backgroundColor">背景色</label>
            <div class="color-input-wrapper">
              <input type="color" id="bgColor" class="color-input" value="#ffffff">
              <span class="color-hex" id="bgColorHex">#ffffff</span>
            </div>
          </div>
        </div>

        <!-- Dot Shape -->
        <div class="setting-item">
          <label class="label" data-i18n="qrGenerator.dotShape">码点形状</label>
          <div class="shape-options" id="dotShapeOptions">
            <button class="shape-option active" data-value="square" data-i18n="qrGenerator.square">方形</button>
            <button class="shape-option" data-value="rounded" data-i18n="qrGenerator.rounded">圆角</button>
            <button class="shape-option" data-value="dots" data-i18n="qrGenerator.dots">圆点</button>
            <button class="shape-option" data-value="extra-rounded" data-i18n="qrGenerator.extraRounded">大圆角</button>
            <button class="shape-option" data-value="classy" data-i18n="qrGenerator.classy">经典</button>
            <button class="shape-option" data-value="classy-rounded" data-i18n="qrGenerator.classyRounded">经典圆角</button>
          </div>
        </div>

        <!-- Corner Shape -->
        <div class="setting-item">
          <label class="label" data-i18n="qrGenerator.cornerShape">定位角形状</label>
          <div class="shape-options" id="cornerShapeOptions">
            <button class="shape-option active" data-value="square" data-i18n="qrGenerator.square">方形</button>
            <button class="shape-option" data-value="extra-rounded" data-i18n="qrGenerator.rounded">圆角</button>
            <button class="shape-option" data-value="dot" data-i18n="qrGenerator.circular">圆形</button>
          </div>
        </div>

        <!-- Logo Upload -->
        <div class="setting-item">
          <label class="label" data-i18n="qrGenerator.centerLogo">中心 Logo（可选）</label>
          <div id="logoUploadZone" class="logo-upload">
            <input type="file" id="logoInput" accept="image/*" class="hidden">
            <svg class="w-8 h-8 mx-auto mb-2 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
            <p class="text-sm text-gray-400" data-i18n="qrGenerator.uploadLogo">点击上传 Logo 图片</p>
            <p class="text-xs text-gray-600 mt-1" data-i18n="qrGenerator.logoHint">建议使用方形图片</p>
          </div>
          <div id="logoPreview" class="logo-preview hidden">
            <img id="logoPreviewImg" src="" alt="Logo">
            <div class="flex-1">
              <p class="text-sm" id="logoFileName">logo.png</p>
              <p class="text-xs text-gray-500" data-i18n="qrGenerator.logoWillShow">Logo 将显示在二维码中心</p>
            </div>
            <button class="btn btn-secondary text-sm" onclick="removeLogo()" data-i18n="qrGenerator.removeLogo">移除</button>
          </div>

          <!-- Logo Settings (visible when logo uploaded) -->
          <div id="logoSettings" class="logo-settings hidden">
            <div class="logo-settings-grid">
              <div class="setting-item">
                <label class="label"><span data-i18n="qrGenerator.logoSize">Logo 大小</span>: <span id="logoSizeValue">40</span>%</label>
                <div class="slider-with-value">
                  <input type="range" id="logoSizeSlider" class="slider" min="10" max="70" step="1" value="40">
                </div>
              </div>
              <div class="setting-item">
                <label class="label" data-i18n="qrGenerator.safeZoneShape">安全区域形状</label>
                <div class="shape-options" id="safeZoneShapeOptions">
                  <button class="shape-option active" data-value="rect" data-i18n="qrGenerator.rectZone">矩形</button>
                  <button class="shape-option" data-value="circle" data-i18n="qrGenerator.circleZone">圆形</button>
                </div>
              </div>
              <div class="setting-item">
                <label class="label"><span data-i18n="qrGenerator.logoMargin">边距</span>: <span id="logoMarginValue">0</span>px</label>
                <div class="slider-with-value">
                  <input type="range" id="logoMarginSlider" class="slider" min="-30" max="50" step="1" value="0">
                </div>
                <p class="hint-text" id="marginHintText" data-i18n="qrGenerator.logoMarginHint">正值扩展留白，负值让码点露出</p>
              </div>
              <div class="setting-item">
                <label class="label"><span data-i18n="qrGenerator.logoRotation">旋转</span>: <span id="logoRotationValue">0</span>°</label>
                <div class="slider-with-value">
                  <input type="range" id="logoRotationSlider" class="slider" min="0" max="360" step="1" value="0">
                </div>
              </div>
              <div class="setting-item">
                <label class="label"><span data-i18n="qrGenerator.logoPosition">位置偏移</span></label>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-500">X: <span id="logoOffsetXValue">0</span></span>
                  <span class="text-xs text-gray-500">Y: <span id="logoOffsetYValue">0</span></span>
                  <button class="reset-btn" onclick="resetLogoPosition()" data-i18n="qrGenerator.resetPosition">重置位置</button>
                </div>
                <p class="hint-text" data-i18n="qrGenerator.dragToMove">在预览区拖动 Logo 调整位置</p>
              </div>
            </div>
          </div>
        </div>

        <button class="btn btn-primary w-full" onclick="generateQR()" id="generateBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span data-i18n="qrGenerator.generate">生成二维码</span>
        </button>
      </div>

      <!-- QR Code Display -->
      <div class="card p-6">
        <h3 class="font-semibold mb-4" data-i18n="common.preview">预览</h3>
        <div class="qr-container qr-interactive" id="qrContainer">
          <div class="qr-placeholder" id="placeholder">
            <svg class="w-16 h-16 mx-auto mb-2 opacity-30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
            <p data-i18n="qrGenerator.placeholderHint">输入内容后点击生成</p>
          </div>
          <canvas id="qrCanvas" class="hidden"></canvas>
          <span class="logo-drag-hint" id="dragHint" data-i18n="qrGenerator.dragToMove">拖动 Logo 调整位置</span>
        </div>

        <div class="flex gap-2 justify-center mt-4" id="downloadSection" style="display: none;">
          <button class="btn btn-primary" onclick="downloadQR()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span data-i18n="common.downloadPng">下载 PNG</span>
          </button>
          <button class="btn btn-secondary" id="statsBtn" onclick="showStats()" style="display: none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 20V10"/>
              <path d="M12 20V4"/>
              <path d="M6 20v-6"/>
            </svg>
            <span data-i18n="qrGenerator.viewStats">查看统计</span>
          </button>
        </div>

        <div class="tracking-info" id="trackingInfo" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--accent);">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
          <span class="text"><span data-i18n="qrGenerator.trackingEnabled">已启用追踪，短链接:</span> <strong id="shortLinkDisplay"></strong></span>
        </div>
      </div>

    </div>
  </main>

  <!-- Stats Modal -->
  <div class="modal-overlay" id="statsModal" onclick="closeStatsModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 data-i18n="qrGenerator.scanStats">扫描统计</h3>
        <button class="modal-close" onclick="closeStatsModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="statsContent">
        <p style="text-align: center; color: var(--fg-muted);">加载中...</p>
      </div>
    </div>
  </div>

  <script>
    // State
    let qrCodeBase = null;  // QR code without logo (for compositing)
    let qrCodeBaseScale = 1; // Scale factor for high-res rendering
    let logoImage = null;   // Loaded logo Image object
    let logoDataUrl = null;

    // Tracking state
    let trackingEnabled = false;
    let currentQrId = null;
    let currentShortLink = null;

    // Logo transform state
    let logoSize = 40;      // percentage of QR size
    let logoMargin = 0;     // pixels (positive = safe zone, negative = QR shows under)
    let logoRotation = 0;   // degrees
    let logoOffsetX = 0;    // pixels from center
    let logoOffsetY = 0;    // pixels from center
    let safeZoneShape = 'rect';  // 'rect' or 'circle'

    // Drag state
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartOffsetX = 0;
    let dragStartOffsetY = 0;

    // Elements
    const inputText = document.getElementById('inputText');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const fgColor = document.getElementById('fgColor');
    const bgColor = document.getElementById('bgColor');
    const fgColorHex = document.getElementById('fgColorHex');
    const bgColorHex = document.getElementById('bgColorHex');
    const placeholder = document.getElementById('placeholder');
    const qrCanvas = document.getElementById('qrCanvas');
    const qrContainer = document.getElementById('qrContainer');
    const downloadSection = document.getElementById('downloadSection');
    const logoInput = document.getElementById('logoInput');
    const logoUploadZone = document.getElementById('logoUploadZone');
    const logoPreview = document.getElementById('logoPreview');
    const logoPreviewImg = document.getElementById('logoPreviewImg');
    const logoFileName = document.getElementById('logoFileName');
    const logoSettings = document.getElementById('logoSettings');
    const dragHint = document.getElementById('dragHint');

    // Logo setting elements
    const logoSizeSlider = document.getElementById('logoSizeSlider');
    const logoSizeValue = document.getElementById('logoSizeValue');
    const logoMarginSlider = document.getElementById('logoMarginSlider');
    const logoMarginValue = document.getElementById('logoMarginValue');
    const logoRotationSlider = document.getElementById('logoRotationSlider');
    const logoRotationValue = document.getElementById('logoRotationValue');
    const logoOffsetXValue = document.getElementById('logoOffsetXValue');
    const logoOffsetYValue = document.getElementById('logoOffsetYValue');

    // Shape selections
    let dotShape = 'square';
    let cornerShape = 'square';

    // Size slider handler
    sizeSlider.addEventListener('input', (e) => {
      sizeValue.textContent = e.target.value;
    });

    // Color input handlers
    fgColor.addEventListener('input', (e) => {
      fgColorHex.textContent = e.target.value.toUpperCase();
    });
    bgColor.addEventListener('input', (e) => {
      bgColorHex.textContent = e.target.value.toUpperCase();
    });

    // Shape option handlers
    document.getElementById('dotShapeOptions').addEventListener('click', (e) => {
      if (e.target.classList.contains('shape-option')) {
        document.querySelectorAll('#dotShapeOptions .shape-option').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        dotShape = e.target.dataset.value;
      }
    });

    document.getElementById('cornerShapeOptions').addEventListener('click', (e) => {
      if (e.target.classList.contains('shape-option')) {
        document.querySelectorAll('#cornerShapeOptions .shape-option').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        cornerShape = e.target.dataset.value;
      }
    });

    // Update margin slider range based on logo size and shape
    function updateMarginRange() {
      if (!qrCodeBase) return;
      // Get display size (unscaled)
      const displaySize = (qrCodeBase.naturalWidth || qrCodeBase.width) / qrCodeBaseScale;
      const logoDrawSize = displaySize * (logoSize / 100);

      let minMargin;
      if (safeZoneShape === 'circle') {
        // For circle: radius = max(drawW, drawH)/2 + margin
        // Min margin when radius = 0: margin = -max(drawW, drawH)/2
        const imgW = logoImage ? (logoImage.naturalWidth || logoImage.width) : 1;
        const imgH = logoImage ? (logoImage.naturalHeight || logoImage.height) : 1;
        const logoAspect = imgW / imgH;
        let drawW, drawH;
        if (logoAspect > 1) {
          drawW = logoDrawSize;
          drawH = logoDrawSize / logoAspect;
        } else {
          drawH = logoDrawSize;
          drawW = logoDrawSize * logoAspect;
        }
        const maxDim = Math.max(drawW, drawH);
        minMargin = Math.floor(-maxDim / 2);
      } else {
        // For rect: when safe zone = 0, margin = -logoDrawSize/2
        minMargin = Math.floor(-logoDrawSize / 2);
      }

      logoMarginSlider.min = minMargin;
      // Clamp current value if needed
      if (logoMargin < minMargin) {
        logoMargin = minMargin;
        logoMarginSlider.value = minMargin;
        logoMarginValue.textContent = minMargin;
      }
    }

    // Logo settings handlers
    logoSizeSlider.addEventListener('input', (e) => {
      logoSize = parseInt(e.target.value);
      logoSizeValue.textContent = logoSize;
      updateMarginRange();
      if (qrCodeBase) renderQRWithLogo();
    });

    logoMarginSlider.addEventListener('input', (e) => {
      logoMargin = parseInt(e.target.value);
      logoMarginValue.textContent = logoMargin;
      if (qrCodeBase) renderQRWithLogo();
    });

    // Safe zone shape handler
    document.getElementById('safeZoneShapeOptions').addEventListener('click', (e) => {
      if (e.target.classList.contains('shape-option')) {
        document.querySelectorAll('#safeZoneShapeOptions .shape-option').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        safeZoneShape = e.target.dataset.value;
        updateMarginRange();
        if (qrCodeBase) renderQRWithLogo();
      }
    });

    logoRotationSlider.addEventListener('input', (e) => {
      logoRotation = parseInt(e.target.value);
      logoRotationValue.textContent = logoRotation;
      if (qrCodeBase) renderQRWithLogo();
    });

    function resetLogoPosition() {
      logoOffsetX = 0;
      logoOffsetY = 0;
      logoOffsetXValue.textContent = '0';
      logoOffsetYValue.textContent = '0';
      if (qrCodeBase) renderQRWithLogo();
    }

    // Crop transparent areas from image
    function cropTransparent(img) {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      const w = canvas.width;
      const h = canvas.height;

      let minX = w, maxX = 0, minY = h, maxY = 0;
      let hasContent = false;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const alpha = data[(y * w + x) * 4 + 3];
          if (alpha > 10) {
            hasContent = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (!hasContent) return img.src;

      const cropW = maxX - minX + 1;
      const cropH = maxY - minY + 1;
      const croppedCanvas = document.createElement('canvas');
      croppedCanvas.width = cropW;
      croppedCanvas.height = cropH;
      const croppedCtx = croppedCanvas.getContext('2d');
      croppedCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

      return croppedCanvas.toDataURL('image/png');
    }

    // Logo upload
    logoUploadZone.addEventListener('click', () => logoInput.click());
    logoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            logoDataUrl = cropTransparent(img);
            // Store the cropped logo as Image object
            const croppedImg = new Image();
            croppedImg.onload = () => {
              logoImage = croppedImg;
              logoPreviewImg.src = logoDataUrl;
              logoFileName.textContent = file.name;
              logoUploadZone.classList.add('hidden');
              logoPreview.classList.remove('hidden');
              logoSettings.classList.remove('hidden');
              dragHint.classList.add('visible');
              // Re-render if QR already generated
              if (qrCodeBase) renderQRWithLogo();
            };
            croppedImg.src = logoDataUrl;
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function removeLogo() {
      logoDataUrl = null;
      logoImage = null;
      logoInput.value = '';
      logoUploadZone.classList.remove('hidden');
      logoPreview.classList.add('hidden');
      logoSettings.classList.add('hidden');
      dragHint.classList.remove('visible');
      // Reset logo settings
      logoSize = 40;
      logoMargin = 0;
      logoRotation = 0;
      logoOffsetX = 0;
      logoOffsetY = 0;
      safeZoneShape = 'rect';
      logoSizeSlider.value = 40;
      logoSizeValue.textContent = '40';
      logoMarginSlider.value = 0;
      logoMarginValue.textContent = '0';
      logoRotationSlider.value = 0;
      logoRotationValue.textContent = '0';
      logoOffsetXValue.textContent = '0';
      logoOffsetYValue.textContent = '0';
      // Reset shape buttons
      document.querySelectorAll('#safeZoneShapeOptions .shape-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.value === 'rect');
      });
      // Re-render QR without logo
      if (qrCodeBase) renderQRWithLogo();
    }

    // Drag handlers for logo positioning
    qrContainer.addEventListener('mousedown', (e) => {
      if (!logoImage || !qrCodeBase) return;
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragStartOffsetX = logoOffsetX;
      dragStartOffsetY = logoOffsetY;
      qrContainer.classList.add('dragging');
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      // Scale movement based on canvas display size vs actual size
      const canvasRect = qrCanvas.getBoundingClientRect();
      const scaleX = qrCanvas.width / canvasRect.width;
      const scaleY = qrCanvas.height / canvasRect.height;
      logoOffsetX = Math.round(dragStartOffsetX + dx * scaleX);
      logoOffsetY = Math.round(dragStartOffsetY + dy * scaleY);
      logoOffsetXValue.textContent = logoOffsetX;
      logoOffsetYValue.textContent = logoOffsetY;
      renderQRWithLogo();
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        qrContainer.classList.remove('dragging');
      }
    });

    // Touch support for mobile
    qrContainer.addEventListener('touchstart', (e) => {
      if (!logoImage || !qrCodeBase) return;
      isDragging = true;
      const touch = e.touches[0];
      dragStartX = touch.clientX;
      dragStartY = touch.clientY;
      dragStartOffsetX = logoOffsetX;
      dragStartOffsetY = logoOffsetY;
      qrContainer.classList.add('dragging');
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const touch = e.touches[0];
      const dx = touch.clientX - dragStartX;
      const dy = touch.clientY - dragStartY;
      const canvasRect = qrCanvas.getBoundingClientRect();
      const scaleX = qrCanvas.width / canvasRect.width;
      const scaleY = qrCanvas.height / canvasRect.height;
      logoOffsetX = Math.round(dragStartOffsetX + dx * scaleX);
      logoOffsetY = Math.round(dragStartOffsetY + dy * scaleY);
      logoOffsetXValue.textContent = logoOffsetX;
      logoOffsetYValue.textContent = logoOffsetY;
      renderQRWithLogo();
    }, { passive: true });

    document.addEventListener('touchend', () => {
      if (isDragging) {
        isDragging = false;
        qrContainer.classList.remove('dragging');
      }
    });

    // Generate on Enter key
    inputText.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') generateQR();
    });

    async function generateQR() {
      let text = inputText.value.trim();
      if (!text) {
        alert(I18n.t('qrGenerator.enterContent'));
        return;
      }

      const statsBtn = document.getElementById('statsBtn');
      const trackingInfo = document.getElementById('trackingInfo');
      const shortLinkDisplay = document.getElementById('shortLinkDisplay');

      // Reset tracking UI
      statsBtn.style.display = 'none';
      trackingInfo.style.display = 'none';
      currentQrId = null;
      currentShortLink = null;

      // If tracking enabled, create short link first
      if (trackingEnabled) {
        const result = await createTrackingLink(text);
        if (result) {
          currentQrId = result.id;
          currentShortLink = API_CONFIG.getBaseUrl() + result.redirect_path;
          text = currentShortLink; // Use short link for QR code
          statsBtn.style.display = 'inline-flex';
          trackingInfo.style.display = 'flex';
          shortLinkDisplay.textContent = currentShortLink;
        } else {
          alert(I18n.t('qrGenerator.trackingServiceError'));
        }
      }

      placeholder.classList.add('hidden');
      qrCanvas.classList.remove('hidden');
      downloadSection.style.display = 'flex';
      if (logoImage) {
        dragHint.classList.add('visible');
      }

      const size = parseInt(sizeSlider.value);

      // Generate QR code as SVG (avoids canvas dots smearing)
      const options = {
        width: size,
        height: size,
        type: 'svg',
        data: text,
        dotsOptions: {
          color: fgColor.value,
          type: dotShape,
          roundSize: false
        },
        cornersSquareOptions: {
          color: fgColor.value,
          type: cornerShape
        },
        cornersDotOptions: {
          color: fgColor.value,
          type: cornerShape === 'dot' ? 'dot' : 'square'
        },
        backgroundOptions: {
          color: bgColor.value
        },
        qrOptions: {
          errorCorrectionLevel: 'H'
        }
      };

      // Create temp container and append SVG
      const tempDiv = document.createElement('div');
      const qrCodeInstance = new QRCodeStyling(options);
      qrCodeInstance.append(tempDiv);

      // Wait for SVG to render
      await new Promise(resolve => setTimeout(resolve, 50));

      // Get SVG element and convert to image manually (better quality control)
      const svgElement = tempDiv.querySelector('svg');
      if (!svgElement) return;

      // Serialize SVG to string
      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svgElement);
      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        // Draw SVG to high-res canvas with no smoothing
        const scale = 2; // 2x resolution for quality
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = size * scale;
        tempCanvas.height = size * scale;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.imageSmoothingEnabled = true;
        tempCtx.imageSmoothingQuality = 'high';
        tempCtx.drawImage(img, 0, 0, size * scale, size * scale);

        // Store as our base
        qrCodeBase = tempCanvas;
        qrCodeBaseScale = scale;
        updateMarginRange();
        renderQRWithLogo();
      };
      img.src = url;
    }

    // Helper: draw rounded rectangle
    function roundRect(ctx, x, y, w, h, r) {
      if (r > w / 2) r = w / 2;
      if (r > h / 2) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function renderQRWithLogo() {
      if (!qrCodeBase) return;

      // qrCodeBase is high-res canvas, get actual display size
      const scale = qrCodeBaseScale;
      const size = qrCodeBase.width;  // This is already scaled
      const displaySize = size / scale;
      qrCanvas.width = size;
      qrCanvas.height = size;
      qrCanvas.style.width = displaySize + 'px';
      qrCanvas.style.height = displaySize + 'px';
      const ctx = qrCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // Draw base QR code
      ctx.drawImage(qrCodeBase, 0, 0);

      // Draw logo if exists
      if (logoImage) {
        // Scale all measurements by the scale factor
        const logoDrawSize = size * (logoSize / 100);
        const imgW = logoImage.naturalWidth || logoImage.width;
        const imgH = logoImage.naturalHeight || logoImage.height;
        const logoAspect = imgW / imgH;
        let drawW, drawH;
        if (logoAspect > 1) {
          drawW = logoDrawSize;
          drawH = logoDrawSize / logoAspect;
        } else {
          drawH = logoDrawSize;
          drawW = logoDrawSize * logoAspect;
        }

        // Scale margin and offset
        const scaledMargin = logoMargin * scale;
        const scaledOffsetX = logoOffsetX * scale;
        const scaledOffsetY = logoOffsetY * scale;

        // Center position with offset
        const centerX = size / 2 + scaledOffsetX;
        const centerY = size / 2 + scaledOffsetY;

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(logoRotation * Math.PI / 180);

        // Draw margin background (safe zone)
        ctx.fillStyle = bgColor.value;

        if (safeZoneShape === 'circle') {
          // Circle safe zone: radius based on max dimension + margin
          const maxDim = Math.max(drawW, drawH);
          const radius = maxDim / 2 + scaledMargin;
          if (radius > 0) {
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          // Rectangle safe zone with rounded corners
          const safeW = drawW + scaledMargin * 2;
          const safeH = drawH + scaledMargin * 2;
          if (safeW > 0 && safeH > 0) {
            const cornerRadius = Math.min(12 * scale, safeW / 4, safeH / 4);
            roundRect(ctx, -safeW / 2, -safeH / 2, safeW, safeH, cornerRadius);
            ctx.fill();
          }
        }

        // Draw logo
        ctx.drawImage(logoImage, -drawW / 2, -drawH / 2, drawW, drawH);

        ctx.restore();
      }
    }

    async function downloadQR() {
      if (!qrCodeBase) {
        alert(I18n.t('qrGenerator.generateFirst'));
        return;
      }
      // Use the rendered canvas
      const blob = await new Promise(resolve => qrCanvas.toBlob(resolve, 'image/png'));
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'qrcode.png';
      a.click();
      URL.revokeObjectURL(url);
    }

    // Tracking functions
    function toggleTracking() {
      trackingEnabled = !trackingEnabled;
      document.getElementById('trackingToggle').classList.toggle('active', trackingEnabled);
    }

    async function createTrackingLink(targetUrl) {
      try {
        const response = await fetch(API_CONFIG.getUrl(ENDPOINTS.QR_CREATE), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: targetUrl })
        });
        if (!response.ok) throw new Error('API error');
        return await response.json();
      } catch (e) {
        console.error('Failed to create tracking link:', e);
        return null;
      }
    }

    function showStats() {
      if (!currentQrId) return;
      document.getElementById('statsModal').classList.add('visible');
      loadStats();
    }

    function closeStatsModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('statsModal').classList.remove('visible');
    }

    async function loadStats() {
      const content = document.getElementById('statsContent');
      content.innerHTML = `<p style="text-align: center; color: var(--fg-muted);">${I18n.t('qrGenerator.loading')}</p>`;

      try {
        const response = await fetch(API_CONFIG.getUrl(`${ENDPOINTS.QR_STATS}/${currentQrId}/stats`));
        if (!response.ok) throw new Error('API error');
        const data = await response.json();

        const maxDeviceCount = Math.max(...data.by_device.map(d => d.count), 1);

        content.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">${data.total_scans}</div>
              <div class="stat-label">${I18n.t('qrGenerator.totalScans')}</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${data.unique_visitors}</div>
              <div class="stat-label">${I18n.t('qrGenerator.uniqueVisitors')}</div>
            </div>
          </div>

          <div class="stats-section">
            <h4>${I18n.t('qrGenerator.deviceDistribution')}</h4>
            ${data.by_device.length ? data.by_device.map(d => `
              <div class="device-bar">
                <span class="name">${d.type}</span>
                <div class="bar"><div class="fill" style="width: ${(d.count / maxDeviceCount) * 100}%"></div></div>
                <span class="count">${d.count}</span>
              </div>
            `).join('') : `<p style="color: var(--fg-muted); font-size: 0.8125rem;">${I18n.t('qrGenerator.noData')}</p>`}
          </div>

          <div class="stats-section">
            <h4>${I18n.t('qrGenerator.targetUrl')}</h4>
            <p style="font-size: 0.8125rem; color: var(--fg); word-break: break-all;">${data.target_url}</p>
          </div>

          <div class="stats-section">
            <h4>${I18n.t('qrGenerator.createdAt')}</h4>
            <p style="font-size: 0.8125rem; color: var(--fg-muted);">${new Date(data.created_at).toLocaleString()}</p>
          </div>
        `;
      } catch (e) {
        content.innerHTML = `<p style="text-align: center; color: #ff453a;">${I18n.t('qrGenerator.loadFailed')}</p>`;
      }
    }
  </script>
</body>
