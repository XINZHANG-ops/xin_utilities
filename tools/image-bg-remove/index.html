<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背景移除 - Xin Utilities</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../shared/api-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --bg-card: #141414;
      --fg: #ffffff;
      --fg-muted: #86868b;
      --accent: #2997ff;
      --accent-hover: #0077ed;
      --border: rgba(255,255,255,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #6e6e73; border-radius: 4px; }

    .nav-blur {
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      background: rgba(0,0,0,0.72);
    }

    .btn {
      padding: 0.625rem 1.25rem;
      border-radius: 980px;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: var(--fg);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255,255,255,0.15);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 3rem;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(41,151,255,0.05);
    }

    .image-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50vh;
      min-height: 300px;
      background: repeating-conic-gradient(#1a1a1a 0% 25%, #0a0a0a 0% 50%) 50% / 20px 20px;
      border-radius: 12px;
      overflow: hidden;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .compare-slider {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      height: 50vh;
      min-height: 300px;
      background: repeating-conic-gradient(#1a1a1a 0% 25%, #0a0a0a 0% 50%) 50% / 20px 20px;
      user-select: none;
    }

    .compare-slider .compare-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .compare-slider .original-img {
      clip-path: inset(0 0 0 50%);
    }

    .compare-slider .slider-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: white;
      cursor: ew-resize;
      transform: translateX(-50%);
    }

    .compare-slider .slider-handle::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .compare-slider .slider-handle::after {
      content: '\2194';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #333;
    }

    .info-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      font-size: 0.75rem;
      color: var(--fg-muted);
    }

    .error-message {
      background: rgba(255,59,48,0.1);
      border: 1px solid rgba(255,59,48,0.3);
      color: #ff6b6b;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .upload-zone { padding: 2rem; }
    }
  </style>
</head>
<body>
  <nav class="fixed top-0 left-0 right-0 z-50 nav-blur">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../../index.html" class="flex items-center gap-3 text-gray-400 hover:text-white transition-colors">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span class="font-medium">返回工具集</span>
      </a>
      <h1 class="text-lg font-semibold">背景移除</h1>
      <div class="w-24"></div>
    </div>
  </nav>

  <main class="pt-20 pb-12 px-4">
    <div class="max-w-4xl mx-auto space-y-6">

      <!-- Upload Zone -->
      <div id="uploadZone" class="upload-zone">
        <input type="file" id="fileInput" accept="image/*" class="hidden">
        <svg class="w-16 h-16 mx-auto mb-4 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        <p class="text-lg font-medium mb-2">拖拽图片到这里</p>
        <p class="text-sm text-gray-500 mb-4">或者点击选择文件</p>
        <p class="text-xs text-gray-600">支持 JPG, PNG, WebP 格式</p>
      </div>

      <!-- Editor -->
      <div id="editor" class="hidden space-y-6">

        <!-- Original Image -->
        <div class="card p-4">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-semibold">原图</h3>
            <button class="btn btn-secondary text-sm" onclick="clearImage()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
              清除
            </button>
          </div>
          <div class="image-container">
            <img id="originalImage" src="" alt="Original">
          </div>
          <div class="flex gap-2 mt-4">
            <span class="info-badge" id="imageSize">0 × 0</span>
            <span class="info-badge" id="fileSize">0 KB</span>
          </div>
        </div>

        <!-- Process Button -->
        <div class="card p-4">
          <button class="btn btn-primary w-full" onclick="removeBackground()" id="processBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
            移除背景
          </button>
          <div id="loadingIndicator" class="hidden mt-4 text-center text-gray-400">
            <div class="spinner mx-auto mb-2"></div>
            <p>正在处理，请稍候...</p>
          </div>
          <div id="errorMessage" class="hidden mt-4 error-message"></div>
        </div>

        <!-- Result -->
        <div id="resultContainer" class="card p-4 hidden">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-semibold">处理结果</h3>
            <div class="flex gap-2">
              <button class="btn btn-secondary text-sm" onclick="toggleCompare()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <line x1="12" y1="3" x2="12" y2="21"/>
                </svg>
                <span id="compareText">对比</span>
              </button>
            </div>
          </div>

          <!-- Single Result View -->
          <div id="singleView" class="image-container">
            <img id="resultImage" src="" alt="Result">
          </div>

          <!-- Compare View -->
          <div id="compareView" class="compare-slider hidden">
            <img id="compareResult" class="compare-img" src="" alt="Result">
            <img id="compareOriginal" class="compare-img original-img" src="" alt="Original">
            <div class="slider-handle" id="sliderHandle"></div>
          </div>

          <div class="flex gap-2 justify-center mt-4">
            <button class="btn btn-primary" onclick="downloadResult()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              下载 PNG
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    // Tool-specific endpoint
    const ENDPOINT = '/remove-background';

    let originalFile = null;
    let resultBlob = null;

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const editor = document.getElementById('editor');
    const originalImage = document.getElementById('originalImage');
    const resultImage = document.getElementById('resultImage');
    const processBtn = document.getElementById('processBtn');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorMessage = document.getElementById('errorMessage');
    const resultContainer = document.getElementById('resultContainer');

    // Upload handlers
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        loadImage(file);
      }
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) loadImage(e.target.files[0]);
    });

    function loadImage(file) {
      originalFile = file;
      const url = URL.createObjectURL(file);

      originalImage.onload = () => {
        document.getElementById('imageSize').textContent = `${originalImage.naturalWidth} × ${originalImage.naturalHeight}`;
        document.getElementById('fileSize').textContent = `${(file.size / 1024).toFixed(1)} KB`;

        uploadZone.classList.add('hidden');
        editor.classList.remove('hidden');
        resultContainer.classList.add('hidden');
        errorMessage.classList.add('hidden');
      };

      originalImage.src = url;
    }

    function clearImage() {
      originalFile = null;
      resultBlob = null;
      fileInput.value = '';
      editor.classList.add('hidden');
      uploadZone.classList.remove('hidden');
      resultContainer.classList.add('hidden');
    }

    async function removeBackground() {
      if (!originalFile) return;

      processBtn.disabled = true;
      loadingIndicator.classList.remove('hidden');
      errorMessage.classList.add('hidden');
      resultContainer.classList.add('hidden');

      try {
        const formData = new FormData();
        formData.append('image', originalFile);

        const apiUrl = API_CONFIG.getUrl(ENDPOINT);

        const response = await fetch(apiUrl, {
          method: 'POST',
          body: formData,
          headers: {
            'ngrok-skip-browser-warning': 'true'
          }
        });

        if (!response.ok) {
          throw new Error(`服务器错误: ${response.status}`);
        }

        resultBlob = await response.blob();
        const resultUrl = URL.createObjectURL(resultBlob);

        resultImage.src = resultUrl;
        document.getElementById('compareOriginal').src = originalImage.src;
        document.getElementById('compareResult').src = resultUrl;

        resultContainer.classList.remove('hidden');

      } catch (error) {
        console.error('Error:', error);
        errorMessage.textContent = `处理失败: ${error.message}`;
        errorMessage.classList.remove('hidden');
      } finally {
        processBtn.disabled = false;
        loadingIndicator.classList.add('hidden');
      }
    }

    // Compare slider
    let isCompareMode = false;
    const singleView = document.getElementById('singleView');
    const compareView = document.getElementById('compareView');
    const sliderHandle = document.getElementById('sliderHandle');

    function toggleCompare() {
      isCompareMode = !isCompareMode;
      singleView.classList.toggle('hidden', isCompareMode);
      compareView.classList.toggle('hidden', !isCompareMode);
      document.getElementById('compareText').textContent = isCompareMode ? '单图' : '对比';
    }

    let isDragging = false;
    sliderHandle.addEventListener('mousedown', () => isDragging = true);
    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const rect = compareView.getBoundingClientRect();
      let percent = (e.clientX - rect.left) / rect.width;
      percent = Math.max(0.05, Math.min(0.95, percent));

      sliderHandle.style.left = `${percent * 100}%`;
      document.getElementById('compareOriginal').style.clipPath = `inset(0 0 0 ${percent * 100}%)`;
    });

    function downloadResult() {
      if (!resultBlob) return;

      const link = document.createElement('a');
      link.href = URL.createObjectURL(resultBlob);
      link.download = 'background-removed.png';
      link.click();
    }
  </script>
</body>
</html>
