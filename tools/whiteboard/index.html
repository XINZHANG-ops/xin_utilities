    // Canvas events - use document for move/up to continue drag even when mouse leaves canvas
    canvas.addEventListener('mousedown', handleMouseDown);
    document.addEventListener('mousemove', handleMouseMove);
    document.addEventListener('mouseup', handleMouseUp);
    canvas.addEventListener('dblclick', handleDoubleClick);

    function handleDoubleClick(e) {
      const pos = getMousePos(e);
      const hit = hitTestObjects(pos.x, pos.y);

      if (hit && (hit.obj.type === 'sticky' || hit.obj.type === 'textbox')) {
        selectedObjects = [hit.obj];
        startEditing(hit.obj);
      }
    }

    function startEditing(obj) {
      if (editingObject) {
        stopEditing();
      }

      editingObject = obj;

      const rect = canvas.getBoundingClientRect();
      const scale = canvasZoom / 100;
      const textarea = document.createElement('textarea');
      textarea.className = 'text-edit-overlay' + (obj.type === 'sticky' ? ' sticky' : '');
      textarea.id = 'textEditOverlay';

      if (obj.type === 'sticky') {
        textarea.style.left = (rect.left + obj.x * scale) + 'px';
        textarea.style.top = (rect.top + obj.y * scale) + 'px';
        textarea.style.width = (obj.width * scale) + 'px';
        textarea.style.height = (obj.height * scale) + 'px';
        textarea.style.background = obj.color;
        textarea.style.color = obj.textColor || '#1d1d1f';
        textarea.style.fontSize = ((obj.fontSize || 16) * scale) + 'px';
        textarea.style.fontWeight = obj.bold ? 'bold' : 'normal';
      } else {
        textarea.style.left = (rect.left + (obj.x - 4) * scale) + 'px';
        textarea.style.top = (rect.top + (obj.y - 4) * scale) + 'px';
        textarea.style.width = ((obj.width + 8) * scale) + 'px';
        textarea.style.height = ((obj.height + 8) * scale) + 'px';
        textarea.style.background = 'rgba(255,255,255,0.95)';
        textarea.style.color = obj.textColor || obj.color || '#1d1d1f';
        textarea.style.fontSize = ((obj.fontSize || 18) * scale) + 'px';
        textarea.style.fontWeight = obj.bold ? 'bold' : 'normal';
        textarea.style.textAlign = obj.textAlign || 'left';
      }

      textarea.value = obj.text || '';
      textarea.placeholder = obj.type === 'sticky' ? I18n.t('whiteboard.placeholder.sticky') : I18n.t('whiteboard.placeholder.text');

      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      textarea.addEventListener('blur', stopEditing);
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          stopEditing();
        } else if (e.key === 'Enter' && !e.shiftKey) {
          // Enter to confirm, Shift+Enter for newline
          e.preventDefault();
          stopEditing();
        }
      });

      // Auto-resize for textbox
      if (obj.type === 'textbox') {
        textarea.addEventListener('input', () => {
          textarea.style.height = 'auto';
          textarea.style.height = textarea.scrollHeight + 'px';
        });
      }
    }

    function stopEditing() {
      const textarea = document.getElementById('textEditOverlay');
      if (textarea && editingObject) {
        editingObject.text = textarea.value;

        // Adjust textbox height based on content
        if (editingObject.type === 'textbox') {
          const fontWeight = editingObject.bold ? 'bold' : 'normal';
          ctx.font = `${fontWeight} ${editingObject.fontSize || 18}px 'Plus Jakarta Sans', sans-serif`;
          const lines = wrapText(editingObject.text, editingObject.width);
          editingObject.height = Math.max(40, lines.length * (editingObject.fontSize || 18) * 1.4);
        }

        textarea.remove();
        saveState();
        emitObjectChange('update', editingObject);
        redraw();
      }
      editingObject = null;
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      const zoomScale = canvasZoom / 100;
      return {
        x: (e.clientX - rect.left) / zoomScale,
        y: (e.clientY - rect.top) / zoomScale
      };
    }

    function handleMouseDown(e) {
      // Clear thumbnail focus when clicking on canvas
      pageThumbnailFocused = false;

      const pos = getMousePos(e);
      startX = pos.x;
      startY = pos.y;

      // Check if clicking on existing object
      const hit = hitTestObjects(pos.x, pos.y);

      if (hit && currentTool !== 'eraser') {
        // Exit follow mode when dragging/editing objects
        if (isFollowingUser && hit.handle !== 'move') {
          // Resizing - exit follow mode
          stopFollowingUser();
        }
        // Check if object is already selected (for multi-select drag)
        if (selectedObjects.includes(hit.obj)) {
          // Dragging already selected objects
          dragHandle = hit.handle;
          dragStartX = pos.x;
          dragStartY = pos.y;
          isDrawing = false;
        } else {
          // Select new object (Shift for multi-select)
          if (e.shiftKey) {
            selectedObjects.push(hit.obj);
          } else {
            selectedObjects = [hit.obj];
          }
          dragHandle = hit.handle;
          dragStartX = pos.x;
          dragStartY = pos.y;
          isDrawing = false;
        }
        updateSelectedControls();
        redraw();
        // Show object menu for single selection
        if (selectedObjects.length === 1) {
          showObjectMenu(selectedObjects[0]);
        } else {
          hideObjectMenu();
        }
        return;
      }

      // Select tool - start selection box
      if (currentTool === 'select') {
        if (!e.shiftKey) {
          selectedObjects = [];
          hideObjectMenu();
        }
        isSelectingBox = true;
        selectBoxStart = pos;
        selectBoxEnd = pos;
        updateSelectedControls();
        redraw();
        return;
      }

      // Exit follow mode when starting to draw or create objects
      if (isFollowingUser) {
        stopFollowingUser();
      }

      selectedObjects = [];
      hideObjectMenu();
      updateSelectedControls();

      // Sticky tool now opens modal immediately from toolbar click

      if (currentTool === 'text') {
        const newText = {
          id: generateObjectId(),
          type: 'textbox',
          x: pos.x,
          y: pos.y,
          width: 200,
          height: 40,
          color: textColor,
          textColor: textColor,
          text: '',
          fontSize: textFontSize,
          textAlign: textAlign,
          bold: false
        };
        objects.push(newText);
        selectedObjects = [newText];
        saveState();
        emitObjectChange('add', newText);
        switchToSelectTool();
        updateSelectedControls();
        redraw();
        startEditing(newText);
        return;
      }

      isDrawing = true;
      currentDrawingId = generateObjectId();

      if (currentTool === 'brush' || currentTool === 'eraser') {
        objects.push({
          id: currentDrawingId,
          type: currentTool,
          color: currentTool === 'eraser' ? '#ffffff' : currentColor,
          size: currentTool === 'eraser' ? eraserSize : strokeSize,
          opacity: currentTool === 'eraser' ? 1 : opacity,
          points: [{ x: startX, y: startY }]
        });
      }
      redraw();
    }

    function handleMouseMove(e) {
      // Only process if mouse is over canvas or we're actively dragging
      const isOverCanvas = e.target === canvas || e.target.closest('#canvasWrapper');
      const isDragging = isDrawing || dragHandle || isSelectingBox;

      if (!isOverCanvas && !isDragging) return;

      const pos = getMousePos(e);

      // Emit cursor position for collaboration (only when over canvas)
      if (isOverCanvas) emitCursor(pos.x, pos.y);

      // Selection box dragging
      if (isSelectingBox) {
        selectBoxEnd = pos;
        redraw();
        drawSelectionBox();
        return;
      }

      // Dragging selected objects
      if (dragHandle && selectedObjects.length > 0) {
        const dx = pos.x - dragStartX;
        const dy = pos.y - dragStartY;
        let skipDragStartUpdate = false;

        if (dragHandle === 'move') {
          // Move all selected objects
          selectedObjects.forEach(obj => {
            if (obj.type === 'image' || obj.type === 'sticky' || obj.type === 'textbox' || obj.type === 'arrow') {
              obj.x += dx;
              obj.y += dy;
            } else {
              obj.x1 += dx;
              obj.y1 += dy;
              obj.x2 += dx;
              obj.y2 += dy;
            }
          });
        } else if (selectedObjects.length === 1) {
          // Resize/rotate only for single selection
          const obj = selectedObjects[0];
          if (dragHandle === 'rotate') {
            // Calculate rotation angle - works for both rect objects and shapes
            let cx, cy;
            if (obj.type === 'image' || obj.type === 'sticky' || obj.type === 'textbox' || obj.type === 'arrow') {
              cx = obj.x + obj.width / 2;
              cy = obj.y + obj.height / 2;
            } else {
              cx = (obj.x1 + obj.x2) / 2;
              cy = (obj.y1 + obj.y2) / 2;
            }
            const angleNow = Math.atan2(pos.y - cy, pos.x - cx);
            const angleStart = Math.atan2(dragStartY - cy, dragStartX - cx);
            obj.rotation = (obj.rotation || 0) + (angleNow - angleStart);
          } else if (obj.type === 'image' || obj.type === 'sticky' || obj.type === 'textbox' || obj.type === 'arrow') {
            // Save old values to track actual movement
            const oldX = obj.x, oldY = obj.y, oldW = obj.width, oldH = obj.height;

            if (dragHandle.includes('e')) obj.width += dx;
            if (dragHandle.includes('w')) { obj.x += dx; obj.width -= dx; }
            if (dragHandle.includes('s')) obj.height += dy;
            if (dragHandle.includes('n')) { obj.y += dy; obj.height -= dy; }

            // Minimum sizes
            let minWidth = 60, minHeight = 40;
            if (obj.type === 'sticky') { minWidth = 40; minHeight = 30; }
            else if (obj.type === 'arrow') { minWidth = 50; minHeight = 40; }

            // Clamp and fix position for w/n handles
            if (obj.width < minWidth) {
              if (dragHandle.includes('w')) obj.x = oldX + oldW - minWidth;
              obj.width = minWidth;
            }
            if (obj.height < minHeight) {
              if (dragHandle.includes('n')) obj.y = oldY + oldH - minHeight;
              obj.height = minHeight;
            }

            // Update drag start only by actual handle movement (keeps mouse synced)
            if (dragHandle.includes('e')) dragStartX += (obj.x + obj.width) - (oldX + oldW);
            if (dragHandle.includes('w')) dragStartX += obj.x - oldX;
            if (dragHandle.includes('s')) dragStartY += (obj.y + obj.height) - (oldY + oldH);
            if (dragHandle.includes('n')) dragStartY += obj.y - oldY;
            skipDragStartUpdate = true;
          } else {
            // rect/circle use x1,y1,x2,y2 format with ne, sw, se handles
            const minX = Math.min(obj.x1, obj.x2);
            const minY = Math.min(obj.y1, obj.y2);
            const maxX = Math.max(obj.x1, obj.x2);
            const maxY = Math.max(obj.y1, obj.y2);

            let newMinX = minX, newMinY = minY, newMaxX = maxX, newMaxY = maxY;

            if (dragHandle === 'ne') {
              newMaxX += dx;
              newMinY += dy;
            } else if (dragHandle === 'sw') {
              newMinX += dx;
              newMaxY += dy;
            } else if (dragHandle === 'se') {
              newMaxX += dx;
              newMaxY += dy;
            }

            // Minimum size
            const minSize = 20;
            if (newMaxX - newMinX < minSize) {
              if (dragHandle.includes('e')) newMaxX = newMinX + minSize;
              if (dragHandle.includes('w')) newMinX = newMaxX - minSize;
            }
            if (newMaxY - newMinY < minSize) {
              if (dragHandle.includes('s')) newMaxY = newMinY + minSize;
              if (dragHandle.includes('n')) newMinY = newMaxY - minSize;
            }

            // Update coordinates
            obj.x1 = newMinX;
            obj.y1 = newMinY;
            obj.x2 = newMaxX;
            obj.y2 = newMaxY;
          }
        }

        if (!skipDragStartUpdate) {
          dragStartX = pos.x;
          dragStartY = pos.y;
        }

        // Update object menu position during drag
        if (selectedObjects.length === 1) {
          showObjectMenu(selectedObjects[0]);
        }
        redraw();
        return;
      }

      if (!isDrawing) {
        const hit = hitTestObjects(pos.x, pos.y);
        if (hit && currentTool !== 'eraser') {
          if (hit.handle === 'move') {
            canvas.style.cursor = 'move';
          } else if (hit.handle === 'rotate') {
            canvas.style.cursor = 'grab';
          } else {
            canvas.style.cursor = 'nwse-resize';
          }
        } else if (currentTool === 'select') {
          canvas.style.cursor = 'crosshair';
        } else if (currentTool === 'sticky' || currentTool === 'text') {
          canvas.style.cursor = 'cell';
        } else {
          canvas.style.cursor = 'crosshair';
        }
        return;
      }

      if (currentTool === 'brush' || currentTool === 'eraser') {
        // Find the object by currentDrawingId (not last in array - remote objects may have been added)
        const obj = objects.find(o => o.id === currentDrawingId);
        if (!obj) return;
        const newPoint = { x: pos.x, y: pos.y };
        obj.points.push(newPoint);
        drawBrushStroke(obj);
        // Emit real-time drawing for collaboration (include brush properties)
        emitDrawing(obj.id, [newPoint], {
          color: obj.color,
          size: obj.size,
          opacity: obj.opacity,
          type: obj.type
        });
      } else {
        // Store shape preview state for drawing after redraw
        shapePreview = { type: currentTool, x1: startX, y1: startY, x2: pos.x, y2: pos.y };
        redraw();
      }
    }

    function handleMouseUp(e) {
      // Finish selection box
      if (isSelectingBox) {
        isSelectingBox = false;
        const pos = getMousePos(e);
        selectBoxEnd = pos;

        // Find objects within selection box
        const minX = Math.min(selectBoxStart.x, selectBoxEnd.x);
        const maxX = Math.max(selectBoxStart.x, selectBoxEnd.x);
        const minY = Math.min(selectBoxStart.y, selectBoxEnd.y);
        const maxY = Math.max(selectBoxStart.y, selectBoxEnd.y);

        // Only select if box is big enough (not just a click)
        if (maxX - minX > 5 || maxY - minY > 5) {
          const newSelected = objects.filter(obj => {
            if (obj.type === 'brush' || obj.type === 'eraser') return false;
            const bounds = getObjectBounds(obj);
            return bounds.x1 < maxX && bounds.x2 > minX &&
                   bounds.y1 < maxY && bounds.y2 > minY;
          });
          selectedObjects = [...new Set([...selectedObjects, ...newSelected])];
        }

        selectBoxStart = null;
        selectBoxEnd = null;
        updateSelectedControls();
        redraw();
        return;
      }

      if (dragHandle) {
        saveState();
        // Emit move for all selected objects
        selectedObjects.forEach(obj => emitObjectChange('move', obj));
        dragHandle = null;
        updateSelectedControls();
        return;
      }

      if (!isDrawing) return;
      isDrawing = false;
      shapePreview = null; // Clear shape preview

      const pos = getMousePos(e);

      if (currentTool !== 'brush' && currentTool !== 'eraser') {
        let newShape;
        if (currentTool === 'arrow') {
          // Arrow uses x,y,width,height like rect - simple bounding box
          const x = Math.min(startX, pos.x);
          const y = Math.min(startY, pos.y);
          const w = Math.abs(pos.x - startX);
          const h = Math.abs(pos.y - startY);
          newShape = {
            id: generateObjectId(),
            type: 'arrow',
            x: x,
            y: y,
            width: Math.max(50, w),
            height: Math.max(40, h),
            color: shapeStrokeColor,
            fillColor: shapeFillColor || '#ff9500',
            size: strokeSize,
            opacity: opacity,
            rotation: 0
          };
        } else {
          // rect and circle use x1,y1,x2,y2
          newShape = {
            id: generateObjectId(),
            type: currentTool,
            x1: startX,
            y1: startY,
            x2: pos.x,
            y2: pos.y,
            color: shapeStrokeColor,
            fillColor: shapeFillColor,
            size: strokeSize,
            opacity: opacity,
            rotation: 0
          };
        }
        objects.push(newShape);
        emitObjectChange('add', newShape);
      } else {
        // Emit the completed brush/eraser stroke
        const brushObj = objects[objects.length - 1];
        if (brushObj) {
          emitObjectChange('add', brushObj);
        }
      }

      saveState();
      redraw();
    }

    function drawBrushStroke(obj) {
      ctx.save();
      ctx.globalAlpha = obj.opacity;
      ctx.strokeStyle = obj.color;
      ctx.lineWidth = obj.size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (obj.points.length > 1) {
        ctx.beginPath();
        ctx.moveTo(obj.points[obj.points.length - 2].x, obj.points[obj.points.length - 2].y);
        ctx.lineTo(obj.points[obj.points.length - 1].x, obj.points[obj.points.length - 1].y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawShapePreview(type, x1, y1, x2, y2) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.strokeStyle = shapeStrokeColor;
      ctx.lineWidth = strokeSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const hasFill = shapeFillColor && shapeFillColor !== 'transparent';

      if (type === 'rect') {
        if (hasFill) {
          ctx.fillStyle = shapeFillColor;
          ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
        }
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
      } else if (type === 'circle') {
        const rx = Math.abs(x2 - x1) / 2;
        const ry = Math.abs(y2 - y1) / 2;
        const cx = (x1 + x2) / 2;
        const cy = (y1 + y2) / 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        if (hasFill) {
          ctx.fillStyle = shapeFillColor;
          ctx.fill();
        }
        ctx.stroke();
      } else if (type === 'arrow') {
        // Draw filled block arrow shape (preview) - simple bounding box like rect
        const x = Math.min(x1, x2);
        const y = Math.min(y1, y2);
        const w = Math.max(50, Math.abs(x2 - x1));
        const h = Math.max(40, Math.abs(y2 - y1));

        const bodyWidth = h * 0.5;
        const headLen = Math.min(w * 0.35, h * 0.8);
        const bodyEnd = w - headLen;

        ctx.beginPath();
        ctx.moveTo(x, y + h/2 - bodyWidth/2);
        ctx.lineTo(x + bodyEnd, y + h/2 - bodyWidth/2);
        ctx.lineTo(x + bodyEnd, y);
        ctx.lineTo(x + w, y + h/2);
        ctx.lineTo(x + bodyEnd, y + h);
        ctx.lineTo(x + bodyEnd, y + h/2 + bodyWidth/2);
        ctx.lineTo(x, y + h/2 + bodyWidth/2);
        ctx.closePath();

        if (hasFill) {
          ctx.fillStyle = shapeFillColor;
          ctx.fill();
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawShape(obj, selected = false) {
      ctx.save();
      ctx.globalAlpha = obj.opacity;
      ctx.strokeStyle = obj.color;
      ctx.lineWidth = obj.size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const { type } = obj;
      const hasFill = obj.fillColor && obj.fillColor !== 'transparent';

      if (type === 'arrow') {
        // Arrow uses x,y,width,height format
        const { x, y, width, height } = obj;
        const rotation = obj.rotation || 0;
        const cx = x + width / 2;
        const cy = y + height / 2;

        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        ctx.translate(-cx, -cy);

        // Draw arrow shape within bounding box (pointing right)
        const w = width;
        const h = height;
        const bodyWidth = h * 0.5;
        const headWidth = h;
        const headLen = Math.min(w * 0.35, h * 0.8);
        const bodyEnd = w - headLen;

        ctx.beginPath();
        ctx.moveTo(x, y + h/2 - bodyWidth/2);                    // top-left of tail
        ctx.lineTo(x + bodyEnd, y + h/2 - bodyWidth/2);          // top before head
        ctx.lineTo(x + bodyEnd, y);                               // top of head base
        ctx.lineTo(x + w, y + h/2);                               // arrow tip
        ctx.lineTo(x + bodyEnd, y + h);                           // bottom of head base
        ctx.lineTo(x + bodyEnd, y + h/2 + bodyWidth/2);          // bottom before head
        ctx.lineTo(x, y + h/2 + bodyWidth/2);                    // bottom-left of tail
        ctx.closePath();

        if (hasFill) {
          ctx.fillStyle = obj.fillColor;
          ctx.fill();
        }
        ctx.stroke();
        ctx.restore();

        if (selected) {
          drawRectHandles(obj);
        }
        return;
      }

      // rect and circle use x1,y1,x2,y2 format
      const { x1, y1, x2, y2 } = obj;
      const rotation = obj.rotation || 0;
      const cx = (x1 + x2) / 2;
      const cy = (y1 + y2) / 2;

      // Apply rotation around center
      if (rotation !== 0) {
        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        ctx.translate(-cx, -cy);
      }

      if (type === 'rect') {
        if (hasFill) {
          ctx.fillStyle = obj.fillColor;
          ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
        }
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
      } else if (type === 'circle') {
        const rx = Math.abs(x2 - x1) / 2;
        const ry = Math.abs(y2 - y1) / 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        if (hasFill) {
          ctx.fillStyle = obj.fillColor;
          ctx.fill();
        }
        ctx.stroke();
      }
      ctx.restore();

      if (selected) {
        drawShapeHandles(obj);
      }
    }

    function drawShapeHandles(obj) {
      const { x1, y1, x2, y2 } = obj;
      const rotation = obj.rotation || 0;
      const cx = (x1 + x2) / 2;
      const cy = (y1 + y2) / 2;

      ctx.save();

      // Apply same rotation for handles
      if (rotation !== 0) {
        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        ctx.translate(-cx, -cy);
      }

      // Draw 3 corner handles (not top-left - that's the rotation handle)
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#30d158';
      ctx.lineWidth = 2;

      const minX = Math.min(x1, x2);
      const minY = Math.min(y1, y2);
      const maxX = Math.max(x1, x2);
      const maxY = Math.max(y1, y2);

      // NE, SW, SE corners (like drawRectHandles)
      const corners = [
        { x: maxX, y: minY },  // top-right (NE)
        { x: minX, y: maxY },  // bottom-left (SW)
        { x: maxX, y: maxY }   // bottom-right (SE)
      ];

      corners.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      // Draw rotation handle at top-left corner
      const handleX = minX;
      const handleY = minY;
      const handleRadius = 8;

      // White circle background with rotation icon
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#007aff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(handleX, handleY, handleRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Draw rotation icon - opening toward bottom-right (toward the object)
      ctx.strokeStyle = '#007aff';
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const r = 4;
      // Arc: start at right (0°), go counterclockwise (through top, left) to bottom (π/2)
      // This draws 270° arc, leaving 90° gap at bottom-right (toward the object)
      const startAngle = -Math.PI * 0.05;  // slightly above right
      const endAngle = Math.PI * 0.55;     // slightly past bottom
      ctx.beginPath();
      ctx.arc(handleX, handleY, r, startAngle, endAngle, true);  // counterclockwise = long way
      ctx.stroke();
      // Arrow head at end (bottom), pointing clockwise (toward the gap/object)
      const ax = handleX + r * Math.cos(endAngle);
      const ay = handleY + r * Math.sin(endAngle);
      // Tangent direction at endAngle going clockwise (increasing angle in canvas)
      const tangentAngle = endAngle + Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(ax - 2.5 * Math.cos(tangentAngle - 0.5), ay - 2.5 * Math.sin(tangentAngle - 0.5));
      ctx.lineTo(ax, ay);
      ctx.lineTo(ax - 2.5 * Math.cos(tangentAngle + 0.5), ay - 2.5 * Math.sin(tangentAngle + 0.5));
      ctx.stroke();

      ctx.restore();
    }

    function drawHandles(x1, y1, x2, y2) {
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#30d158';
      ctx.lineWidth = 2;

      [{ x: x1, y: y1 }, { x: x2, y: y2 }].forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });
    }

    function drawImage(obj, selected = false) {
      ctx.save();
      ctx.globalAlpha = obj.opacity || 1;

      const rotation = obj.rotation || 0;
      const cx = obj.x + obj.width / 2;
      const cy = obj.y + obj.height / 2;

      // Apply rotation around center
      if (rotation !== 0) {
        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        ctx.translate(-cx, -cy);
      }

      if (obj.img) {
        ctx.drawImage(obj.img, obj.x, obj.y, obj.width, obj.height);
      } else {
        // Draw placeholder for loading/failed image
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
        // Draw loading icon
        ctx.fillStyle = '#999';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Loading...', cx, cy);
      }

      if (selected) {
        ctx.strokeStyle = '#30d158';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
        ctx.setLineDash([]);
      }

      ctx.restore();

      if (selected) {
        drawRectHandles(obj);
      }
    }

    function getObjectBounds(obj) {
      if (obj.type === 'image' || obj.type === 'sticky' || obj.type === 'textbox') {
        return { x1: obj.x, y1: obj.y, x2: obj.x + obj.width, y2: obj.y + obj.height };
      } else {
        return {
          x1: Math.min(obj.x1, obj.x2),
          y1: Math.min(obj.y1, obj.y2),
          x2: Math.max(obj.x1, obj.x2),
          y2: Math.max(obj.y1, obj.y2)
        };
      }
    }

    function hitTestObjects(x, y) {
      for (let i = objects.length - 1; i >= 0; i--) {
        const obj = objects[i];

        if (obj.type === 'brush' || obj.type === 'eraser') continue;

        // Objects with x,y,width,height format
        if (obj.type === 'image' || obj.type === 'sticky' || obj.type === 'textbox' || obj.type === 'arrow') {
          const handleRadius = 10;
          const rotation = obj.rotation || 0;
          const cx = obj.x + obj.width / 2;
          const cy = obj.y + obj.height / 2;

          // Transform click point to object's local coordinate system
          let localX = x, localY = y;
          if (rotation !== 0) {
            const cos = Math.cos(-rotation);
            const sin = Math.sin(-rotation);
            const dx = x - cx;
            const dy = y - cy;
            localX = cx + dx * cos - dy * sin;
            localY = cy + dx * sin + dy * cos;
          }

          // Check rotation handle at top-left corner (only if object is selected)
          if (selectedObjects.includes(obj)) {
            const handleX = obj.x;
            const handleY = obj.y;
            const handleRadius = 8;

            // Transform handle position to screen space if rotated
            let screenHandleX = handleX, screenHandleY = handleY;
            if (rotation !== 0) {
              const cos = Math.cos(rotation);
              const sin = Math.sin(rotation);
              const dx = handleX - cx;
              const dy = handleY - cy;
              screenHandleX = cx + dx * cos - dy * sin;
              screenHandleY = cy + dx * sin + dy * cos;
            }

            // Check if click is within the rotation handle circle
            const distFromHandle = Math.hypot(x - screenHandleX, y - screenHandleY);
            if (distFromHandle <= handleRadius + 4) {
              return { obj, handle: 'rotate' };
            }
          }

          // Other 3 corners for resize (not nw - that's the rotation handle)
          const corners = [
            { x: obj.x + obj.width, y: obj.y, h: 'ne' },
            { x: obj.x, y: obj.y + obj.height, h: 'sw' },
            { x: obj.x + obj.width, y: obj.y + obj.height, h: 'se' }
          ];

          // Check corner handles in local space
          for (const c of corners) {
            if (Math.hypot(localX - c.x, localY - c.y) < handleRadius) {
              return { obj, handle: c.h };
            }
          }

          // Check if inside object bounds (in local space)
          if (localX >= obj.x && localX <= obj.x + obj.width && localY >= obj.y && localY <= obj.y + obj.height) {
            return { obj, handle: 'move' };
          }
        } else {
          const handleRadius = 10;
          const cx = (obj.x1 + obj.x2) / 2;
          const cy = (obj.y1 + obj.y2) / 2;
          const rotation = obj.rotation || 0;

          // Transform click point to object's local coordinate system
          let localX = x, localY = y;
          if (rotation !== 0) {
            const cos = Math.cos(-rotation);
            const sin = Math.sin(-rotation);
            const dx = x - cx;
            const dy = y - cy;
            localX = cx + dx * cos - dy * sin;
            localY = cy + dx * sin + dy * cos;
          }

          // Check rotation handle at top-left corner (only if object is selected)
          if (selectedObjects.includes(obj)) {
            const minX = Math.min(obj.x1, obj.x2);
            const minY = Math.min(obj.y1, obj.y2);
            const handleX = minX;
            const handleY = minY;
            const handleRadius = 8;

            // Transform handle position to screen space if rotated
            let screenHandleX = handleX, screenHandleY = handleY;
            if (rotation !== 0) {
              const cos = Math.cos(rotation);
              const sin = Math.sin(rotation);
              const dx = handleX - cx;
              const dy = handleY - cy;
              screenHandleX = cx + dx * cos - dy * sin;
              screenHandleY = cy + dx * sin + dy * cos;
            }

            // Check if click is within the rotation handle circle
            const distFromHandle = Math.hypot(x - screenHandleX, y - screenHandleY);
            if (distFromHandle <= handleRadius + 4) {
              return { obj, handle: 'rotate' };
            }
          }

          // Check corner handles (in local space) - same as arrow: NE, SW, SE
          const minX = Math.min(obj.x1, obj.x2);
          const minY = Math.min(obj.y1, obj.y2);
          const maxX = Math.max(obj.x1, obj.x2);
          const maxY = Math.max(obj.y1, obj.y2);

          const corners = [
            { x: maxX, y: minY, h: 'ne' },  // top-right
            { x: minX, y: maxY, h: 'sw' },  // bottom-left
            { x: maxX, y: maxY, h: 'se' }   // bottom-right
          ];

          for (const c of corners) {
            if (Math.hypot(localX - c.x, localY - c.y) < handleRadius) {
              return { obj, handle: c.h };
            }
          }

          const halfW = Math.abs(obj.x2 - obj.x1) / 2 + 10;
          const halfH = Math.abs(obj.y2 - obj.y1) / 2 + 10;

          if (localX >= cx - halfW && localX <= cx + halfW && localY >= cy - halfH && localY <= cy + halfH) {
            return { obj, handle: 'move' };
          }
        }
      }
      return null;
    }

    function drawSticky(obj, selected = false) {
      ctx.save();

      const radius = 12;
      const padding = 8;
      // Nunito font with bolder weight for sticky notes
      const fontWeight = obj.bold ? '700' : '600';
      const fontFamily = "'Nunito', sans-serif";
      // Ensure positive values for text area (minimum 1px)
      const maxWidth = Math.max(1, obj.width - padding * 2);
      const maxHeight = Math.max(1, obj.height - padding * 2);

      // Use cached font calculation if dimensions haven't changed much
      const cacheKey = `${Math.round(maxWidth)}_${Math.round(maxHeight)}_${obj.text}_${fontWeight}`;
      let fontSize, lines;

      if (obj._fontCache && obj._fontCacheKey === cacheKey) {
        fontSize = obj._fontCache.fontSize;
        lines = obj._fontCache.lines;
      } else if (obj.text && maxWidth > 0 && maxHeight > 0) {
        // Binary search for optimal font size (fast)
        const minFontSize = 10;
        const maxFontSizeCalc = Math.max(minFontSize, Math.min(120, maxHeight * 0.9));
        fontSize = minFontSize;
        lines = [];

        let lo = minFontSize, hi = maxFontSizeCalc;
        while (hi - lo > 3) {
          const mid = Math.floor((lo + hi) / 2);
          ctx.font = `${fontWeight} ${mid}px ${fontFamily}`;
          const testLines = wrapText(obj.text, maxWidth);
          if (testLines.length * mid * 1.35 <= maxHeight) {
            lo = mid;
          } else {
            hi = mid - 1;
          }
        }
        // Final check at lo
        ctx.font = `${fontWeight} ${lo}px ${fontFamily}`;
        lines = wrapText(obj.text, maxWidth);
        fontSize = lo;

        // Cache result
        obj._fontCache = { fontSize, lines };
        obj._fontCacheKey = cacheKey;
      } else {
        fontSize = 10;
        lines = [];
      }
      ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;

      const rotation = obj.rotation || 0;
      const cx = obj.x + obj.width / 2;
      const cy = obj.y + obj.height / 2;

      // Apply rotation around center
      if (rotation !== 0) {
        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        ctx.translate(-cx, -cy);
      }

      // Draw shadow
      ctx.shadowColor = 'rgba(0,0,0,0.2)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;

      // Draw sticky note background with rounded corners
      ctx.fillStyle = obj.color;
      ctx.beginPath();
      ctx.roundRect(obj.x, obj.y, obj.width, obj.height, radius);
      ctx.fill();

      ctx.shadowColor = 'transparent';

      // Draw subtle border
      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(obj.x, obj.y, obj.width, obj.height, radius);
      ctx.stroke();

      // Draw text with clipping to prevent overflow
      if (obj.text && lines.length > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(obj.x, obj.y, obj.width, obj.height);
        ctx.clip();

        ctx.fillStyle = obj.textColor || '#1d1d1f';
        ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
        ctx.textBaseline = 'top';

        const lineHeight = fontSize * 1.35;
        const totalTextHeight = lines.length * lineHeight;
        // Vertically center text block within sticky note
        const startY = obj.y + Math.max(padding, (obj.height - totalTextHeight) / 2);

        // Draw all text lines
        lines.forEach((line, i) => {
          ctx.fillText(line, obj.x + padding, startY + i * lineHeight);
        });
        ctx.restore();
      }

      ctx.restore();

      if (selected) {
        drawRectHandles(obj);
      }
    }

    function drawTextBox(obj, selected = false) {
      ctx.save();

      const rotation = obj.rotation || 0;
      const cx = obj.x + obj.width / 2;
      const cy = obj.y + obj.height / 2;

      // Apply rotation around center
      if (rotation !== 0) {
        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        ctx.translate(-cx, -cy);
      }

      // Draw text
      if (obj.text) {
        ctx.fillStyle = obj.textColor || obj.color || '#1d1d1f';
        const fontWeight = obj.bold ? 'bold' : 'normal';
        ctx.font = `${fontWeight} ${obj.fontSize || 18}px 'Plus Jakarta Sans', sans-serif`;
        ctx.textBaseline = 'top';

        const lineHeight = (obj.fontSize || 18) * 1.4;
        const lines = wrapText(obj.text, obj.width);
        const align = obj.textAlign || 'left';

        lines.forEach((line, i) => {
          let drawX = obj.x;
          if (align === 'center') {
            const lineWidth = ctx.measureText(line).width;
            drawX = obj.x + (obj.width - lineWidth) / 2;
          } else if (align === 'right') {
            const lineWidth = ctx.measureText(line).width;
            drawX = obj.x + obj.width - lineWidth;
          }
          ctx.fillText(line, drawX, obj.y + i * lineHeight);
        });
      }

      if (selected) {
        // Draw selection border (inside rotation transform)
        ctx.strokeStyle = '#30d158';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(obj.x - 4, obj.y - 4, obj.width + 8, obj.height + 8);
        ctx.setLineDash([]);
      }

      ctx.restore();

      if (selected) {
        drawRectHandles(obj);
      }
    }

    function drawRectHandles(obj) {
      const rotation = obj.rotation || 0;
      const cx = obj.x + obj.width / 2;
      const cy = obj.y + obj.height / 2;

      ctx.save();

      // Apply rotation around center
      if (rotation !== 0) {
        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        ctx.translate(-cx, -cy);
      }

      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#30d158';
      ctx.lineWidth = 2;

      // Draw 3 corner handles (not nw - that's the rotation handle)
      const corners = [
        { x: obj.x + obj.width, y: obj.y },
        { x: obj.x, y: obj.y + obj.height },
        { x: obj.x + obj.width, y: obj.y + obj.height }
      ];

      corners.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      // Draw rotation handle at top-left corner (replaces nw resize handle)
      const handleX = obj.x;
      const handleY = obj.y;
      const handleRadius = 8;

      // White circle background with rotation icon
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#007aff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(handleX, handleY, handleRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Draw rotation icon - opening toward bottom-right (toward the object)
      ctx.strokeStyle = '#007aff';
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const r = 4;
      // Arc: start at right (0°), go counterclockwise (through top, left) to bottom (π/2)
      // This draws 270° arc, leaving 90° gap at bottom-right (toward the object)
      const startAngle = -Math.PI * 0.05;  // slightly above right
      const endAngle = Math.PI * 0.55;     // slightly past bottom
      ctx.beginPath();
      ctx.arc(handleX, handleY, r, startAngle, endAngle, true);  // counterclockwise = long way
      ctx.stroke();
      // Arrow head at end (bottom), pointing clockwise (toward the gap/object)
      const ax = handleX + r * Math.cos(endAngle);
      const ay = handleY + r * Math.sin(endAngle);
      // Tangent direction at endAngle going clockwise (increasing angle in canvas)
      const tangentAngle = endAngle + Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(ax - 2.5 * Math.cos(tangentAngle - 0.5), ay - 2.5 * Math.sin(tangentAngle - 0.5));
      ctx.lineTo(ax, ay);
      ctx.lineTo(ax - 2.5 * Math.cos(tangentAngle + 0.5), ay - 2.5 * Math.sin(tangentAngle + 0.5));
      ctx.stroke();

      ctx.restore();
    }

    function wrapText(text, maxWidth) {
      const lines = [];
      const paragraphs = text.split('\n');

      paragraphs.forEach(paragraph => {
        if (!paragraph) {
          lines.push('');
          return;
        }

        const words = paragraph.split('');
        let currentLine = '';

        for (const char of words) {
          const testLine = currentLine + char;
          const metrics = ctx.measureText(testLine);

          if (metrics.width > maxWidth && currentLine) {
            lines.push(currentLine);
            currentLine = char;
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) {
          lines.push(currentLine);
        }
      });

      return lines;
    }

    function drawSelectionBox() {
      if (!selectBoxStart || !selectBoxEnd) return;
      ctx.save();
      ctx.strokeStyle = '#30d158';
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 5]);
      ctx.fillStyle = 'rgba(48, 209, 88, 0.1)';

      const x = Math.min(selectBoxStart.x, selectBoxEnd.x);
      const y = Math.min(selectBoxStart.y, selectBoxEnd.y);
      const w = Math.abs(selectBoxEnd.x - selectBoxStart.x);
      const h = Math.abs(selectBoxEnd.y - selectBoxStart.y);

      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);
      ctx.setLineDash([]);
      ctx.restore();
    }

    let redrawScheduled = false;
    let shapePreview = null; // Store shape preview to draw after redraw

    function redraw() {
      if (redrawScheduled) return;
      redrawScheduled = true;
      requestAnimationFrame(() => {
        redrawScheduled = false;
        redrawNow();
        // Draw shape preview after canvas is redrawn
        if (shapePreview) {
          drawShapePreview(shapePreview.type, shapePreview.x1, shapePreview.y1, shapePreview.x2, shapePreview.y2);
        }
      });
    }

    function redrawNow() {
      const zoomScale = canvasZoom / 100;
      // Reset transform and clear entire canvas to handle browser zoom
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Restore DPI and zoom scaling
      ctx.setTransform(dpr * zoomScale, 0, 0, dpr * zoomScale, 0, 0);

      // Layer 1: Brush strokes and eraser (can be erased)
      for (const obj of objects) {
        if (obj.type === 'brush' || obj.type === 'eraser') {
          ctx.save();
          ctx.globalAlpha = obj.opacity;
          ctx.strokeStyle = obj.color;
          ctx.lineWidth = obj.size;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          if (obj.points.length > 0) {
            ctx.moveTo(obj.points[0].x, obj.points[0].y);
            for (let i = 1; i < obj.points.length; i++) {
              ctx.lineTo(obj.points[i].x, obj.points[i].y);
            }
          }
          ctx.stroke();
          ctx.restore();
        }
      }

      // Layer 2: Shapes and images
      for (const obj of objects) {
        if (obj.type === 'image') {
          drawImage(obj, selectedObjects.includes(obj));
        } else if (obj.type === 'rect' || obj.type === 'circle' || obj.type === 'arrow') {
          drawShape(obj, selectedObjects.includes(obj));
        }
      }

      // Layer 3: Sticky notes and text boxes (always on top, not erasable)
      for (const obj of objects) {
        if (obj.type === 'sticky') {
          drawSticky(obj, selectedObjects.includes(obj));
        } else if (obj.type === 'textbox') {
          drawTextBox(obj, selectedObjects.includes(obj));
        }
      }
    }

    // History management
    function saveState() {
      const state = objects.map(obj => {
        if (obj.type === 'image') {
          return { ...obj, imgSrc: obj.imgSrc };
        }
        return { ...obj };
      });

      history = history.slice(0, historyIndex + 1);
      history.push(JSON.stringify(state));
      historyIndex = history.length - 1;

      if (history.length > 50) {
        history.shift();
        historyIndex--;
      }

      // Update page state
      saveCurrentPageState();
      updatePageUI();
      saveToLocalStorage();
    }

    function loadState(stateStr) {
      const state = JSON.parse(stateStr);
      const loadPromises = state.map(obj => {
        if (obj.type === 'image') {
          return new Promise(resolve => {
            const img = new Image();
            img.onload = () => {
              obj.img = img;
              resolve(obj);
            };
            img.onerror = () => resolve(obj);
            img.src = obj.imgSrc;
          });
        }
        return Promise.resolve(obj);
      });

      return Promise.all(loadPromises);
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        loadState(history[historyIndex]).then(state => {
          objects = state;
          selectedObjects = [];
          updateSelectedControls();
          saveCurrentPageState();
          redraw();
          updatePageUI();
          refreshPageGridIfOpen();
          saveToLocalStorage();
          emitUndoRedo('undo', history[historyIndex]);
        });
      } else if (historyIndex === 0) {
        objects = [];
        selectedObjects = [];
        historyIndex = -1;
        updateSelectedControls();
        saveCurrentPageState();
        redraw();
        updatePageUI();
        refreshPageGridIfOpen();
        saveToLocalStorage();
        emitUndoRedo('undo', '[]');
      } else if (pageUndoStack.length > 0) {
        // Try to undo page operations
        undoPageOperation();
      }
    }

    function redo() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        loadState(history[historyIndex]).then(state => {
          objects = state;
          selectedObjects = [];
          updateSelectedControls();
          saveCurrentPageState();
          redraw();
          updatePageUI();
          refreshPageGridIfOpen();
          saveToLocalStorage();
          emitUndoRedo('redo', history[historyIndex]);
        });
      }
    }

    document.addEventListener('keydown', e => {
      // ESC to exit follow mode
      if (e.key === 'Escape' && isFollowingUser) {
        e.preventDefault();
        stopFollowingUser();
        return;
      }

      // Don't handle shortcuts while typing in input/textarea
      const activeEl = document.activeElement;
      const isTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
      if (editingObject || isTyping) return;

      if (e.ctrlKey && !e.shiftKey && e.key === 'z') {
        e.preventDefault();
        // First check if there's a page operation to undo
        if (pageUndoStack.length > 0 && historyIndex <= 0) {
          undoPageOperation();
        } else {
          undo();
        }
      } else if (e.ctrlKey && e.key === 'y') {
        e.preventDefault();
        redo();
      } else if (e.ctrlKey && e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        redo();
      } else if (e.ctrlKey && e.key === 'c') {
        e.preventDefault();
        copyToClipboard();
      } else if (e.ctrlKey && e.key === 'v') {
        e.preventDefault();
        pasteFromClipboard();
      } else if (e.ctrlKey && e.key === 'a') {
        // Select all objects on current page
        e.preventDefault();
        if (objects.length > 0) {
          selectedObjects = [...objects];
          updateSelectedControls();
          redraw();
        }
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        if (selectedObjects.length > 0) {
          // Delete selected objects
          selectedObjects.forEach(obj => {
            emitObjectChange('delete', obj);
            const idx = objects.indexOf(obj);
            if (idx > -1) objects.splice(idx, 1);
          });
          selectedObjects = [];
          hideObjectMenu();
          updateSelectedControls();
          saveState();
          redraw();
        } else if (pageThumbnailFocused && pages.length > 1) {
          // Thumbnail focused - delete current page
          deletePage(currentPageIndex);
          pageThumbnailFocused = false;
        }
      }
    });

    function undoPageOperation() {
      if (pageUndoStack.length === 0) return;

      const op = pageUndoStack.pop();
      if (op.type === 'deletePage') {
        // Restore the deleted page
        loadState(JSON.stringify(op.page.objects)).then(loadedObjects => {
          const restoredPage = {
            objects: loadedObjects,
            history: op.page.history || [],
            historyIndex: op.page.historyIndex !== undefined ? op.page.historyIndex : -1
          };

          // Insert at original position
          pages.splice(op.index, 0, restoredPage);

          // Switch to restored page
          currentPageIndex = op.index;
          loadPageState(currentPageIndex);

          selectedObjects = [];
          updateSelectedControls();
          redraw();
          updatePageUI();
          refreshPageGridIfOpen();
          saveToLocalStorage();

          // Sync to other users
          emitPageOperation('restore', op.index);
        });
      }
    }

    function copyToClipboard() {
      if (selectedObjects.length > 0) {
        // Copy selected objects
        const copies = selectedObjects.map(obj => {
          const copy = JSON.parse(JSON.stringify(obj));
          if (copy.type === 'image') {
            copy.imgSrc = obj.imgSrc;
            copy.img = undefined;
          }
          return copy;
        });
        clipboard = copies;
        clipboardType = 'objects';
      } else {
        // Copy entire page
        const pageCopy = objects.map(obj => {
          const copy = JSON.parse(JSON.stringify(obj));
          if (copy.type === 'image') {
            copy.imgSrc = obj.imgSrc;
            copy.img = undefined;
          }
          return copy;
        });
        clipboard = pageCopy;
        clipboardType = 'page';
      }
    }

    async function pasteFromClipboard() {
      if (!clipboard) return;

      if (clipboardType === 'objects') {
        // Paste selected objects with offset and NEW IDs
        const pastedObjects = [];
        for (const clipObj of clipboard) {
          const obj = JSON.parse(JSON.stringify(clipObj));
          // Generate new unique ID for pasted object
          obj.id = generateObjectId();
          obj.x = (obj.x || 0) + 20;
          obj.y = (obj.y || 0) + 20;
          if (obj.x1 !== undefined) { obj.x1 += 20; obj.x2 += 20; }
          if (obj.y1 !== undefined) { obj.y1 += 20; obj.y2 += 20; }

          if (obj.type === 'image' && obj.imgSrc) {
            const img = new Image();
            img.src = obj.imgSrc;
            await new Promise(resolve => {
              img.onload = () => { obj.img = img; resolve(); };
              img.onerror = resolve;
            });
          }
          objects.push(obj);
          pastedObjects.push(obj);
          emitObjectChange('add', obj);
        }
        selectedObjects = pastedObjects;
        updateSelectedControls();
        saveState();
        redraw();

        // Update clipboard for next paste offset
        clipboard = clipboard.map(obj => {
          const updated = { ...obj };
          updated.x = (updated.x || 0) + 20;
          updated.y = (updated.y || 0) + 20;
          if (updated.x1 !== undefined) { updated.x1 += 20; updated.x2 += 20; }
          if (updated.y1 !== undefined) { updated.y1 += 20; updated.y2 += 20; }
          return updated;
        });
      } else if (clipboardType === 'page') {
        // Paste entire page content
        if (pages.length >= MAX_PAGES) {
          // If at max pages, paste into current page
          for (const objData of clipboard) {
            const obj = JSON.parse(JSON.stringify(objData));
            obj.id = generateObjectId(); // New ID
            if (obj.type === 'image' && obj.imgSrc) {
              const img = new Image();
              img.src = obj.imgSrc;
              await new Promise(resolve => {
                img.onload = () => {
                  obj.img = img;
                  resolve();
                };
                img.onerror = resolve;
              });
            }
            objects.push(obj);
            emitObjectChange('add', obj);
          }
          saveState();
          redraw();
        } else {
          // Create new page with clipboard content
          saveCurrentPageState();

          const newObjects = [];
          for (const objData of clipboard) {
            const obj = JSON.parse(JSON.stringify(objData));
            obj.id = generateObjectId(); // New ID
            if (obj.type === 'image' && obj.imgSrc) {
              const img = new Image();
              img.src = obj.imgSrc;
              await new Promise(resolve => {
                img.onload = () => {
                  obj.img = img;
                  resolve();
                };
                img.onerror = resolve;
              });
            }
            newObjects.push(obj);
          }

          const newPage = { objects: newObjects, history: [], historyIndex: -1 };
          pages.push(newPage);
          currentPageIndex = pages.length - 1;
          loadPageState(currentPageIndex);

          selectedObjects = [];
          updateSelectedControls();
          saveState();
          redraw();
          updatePageUI();
        }
      }
    }

    // Clear (supports undo)
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (objects.length === 0) return;
      // Save current state before clearing (for undo)
      saveState();
      objects = [];
      selectedObjects = [];
      updateSelectedControls();
      // Save to page state without adding to history
      saveCurrentPageState();
      redraw();
      updatePageUI();
      refreshPageGridIfOpen();
      saveToLocalStorage();
      emitClear();
    });

    // Download as PDF (all pages)
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const { jsPDF } = window.jspdf;

      // Save current state
      const originalPageIndex = currentPageIndex;
      const originalSelected = [...selectedObjects];
      selectedObjects = [];

      // Create PDF with canvas dimensions
      const pdfWidth = canvas.width;
      const pdfHeight = canvas.height;
      const pdf = new jsPDF({
        orientation: pdfWidth > pdfHeight ? 'landscape' : 'portrait',
        unit: 'px',
        format: [pdfWidth, pdfHeight]
      });

      // Render each page
      for (let i = 0; i < pages.length; i++) {
        if (i > 0) {
          pdf.addPage([pdfWidth, pdfHeight], pdfWidth > pdfHeight ? 'landscape' : 'portrait');
        }

        // Switch to page and render synchronously
        await switchToPageForExport(i);
        redrawNow();

        // Add canvas as image
        const imgData = canvas.toDataURL('image/png');
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
      }

      // Restore original state
      await switchToPageForExport(originalPageIndex);
      selectedObjects = originalSelected;
      redrawNow();

      // Download PDF
      const boardName = currentBoard ? currentBoard.name : 'whiteboard';
      pdf.save(`${boardName}.pdf`);
    });

    // Helper to switch page for export (no emit, no UI update)
    async function switchToPageForExport(index) {
      if (index < 0 || index >= pages.length) return;
      saveCurrentPageState();
      currentPageIndex = index;
      const page = pages[currentPageIndex];
      objects = page.objects;
      history = page.history;
      historyIndex = page.historyIndex;

      // Restore image objects
      const imagePromises = objects
        .filter(obj => obj.type === 'image' && obj.imgSrc && !obj.img)
        .map(obj => new Promise(resolve => {
          const img = new Image();
          img.onload = () => {
            obj.img = img;
            resolve();
          };
          img.onerror = () => resolve();
          img.src = obj.imgSrc;
        }));
      await Promise.all(imagePromises);
    }

    // Image drag and drop
    canvasWrapper.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    canvasWrapper.addEventListener('drop', e => {
      e.preventDefault();
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));

      const rect = canvas.getBoundingClientRect();
      let dropX = e.clientX - rect.left;
      let dropY = e.clientY - rect.top;

      files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            const maxSize = 300;

            if (width > maxSize || height > maxSize) {
              const scale = maxSize / Math.max(width, height);
              width *= scale;
              height *= scale;
            }

            const imgObj = {
              id: generateObjectId(),
              type: 'image',
              img: img,
              imgSrc: ev.target.result,
              x: dropX + index * 20,
              y: dropY + index * 20,
              width: width,
              height: height,
              opacity: 1
            };
            objects.push(imgObj);

            saveState();
            emitObjectChange('add', imgObj);
            redraw();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    });

    // Local storage (STORAGE_KEY declared earlier)

    function saveToLocalStorage() {
      saveIndicator.textContent = I18n.t('whiteboard.status.saving');
      saveIndicator.classList.add('saving');

      // Save current page state first
      saveCurrentPageState();

      // Serialize all pages
      const pagesData = pages.map(page => ({
        objects: page.objects.map(obj => {
          if (obj.type === 'image') {
            return { ...obj, imgSrc: obj.imgSrc, img: undefined };
          }
          return { ...obj };
        }),
        history: page.history,
        historyIndex: page.historyIndex
      }));

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          pages: pagesData,
          currentPageIndex: currentPageIndex,
          canvasWidth: canvasLogicalWidth,
          canvasHeight: canvasLogicalHeight
        }));
        setTimeout(() => {
          saveIndicator.textContent = I18n.t('whiteboard.status.saved');
          saveIndicator.classList.remove('saving');
        }, 300);
      } catch (e) {
        saveIndicator.textContent = I18n.t('whiteboard.status.storageFull');
        console.error('localStorage save failed:', e);
      }
    }

    async function loadFromLocalStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const data = JSON.parse(saved);

          // Check if it's multi-page format or old single-page format
          if (data.pages) {
            // Multi-page format
            pages = [];
            for (const pageData of data.pages) {
              const loadedObjects = await loadState(JSON.stringify(pageData.objects));
              pages.push({
                objects: loadedObjects,
                history: pageData.history || [],
                historyIndex: pageData.historyIndex !== undefined ? pageData.historyIndex : -1
              });
            }
            currentPageIndex = data.currentPageIndex || 0;
            if (currentPageIndex >= pages.length) currentPageIndex = 0;
          } else if (data.objects) {
            // Old single-page format - migrate
            const loadedObjects = await loadState(JSON.stringify(data.objects));
            pages = [{
              objects: loadedObjects,
              history: [JSON.stringify(data.objects)],
              historyIndex: 0
            }];
            currentPageIndex = 0;
          }

          loadPageState(currentPageIndex);
          redraw();
          updatePageUI();
        }
      } catch (e) {
        console.error('localStorage load failed:', e);
      }
    }

    // Language toggle - use our I18n system
    const langToggle = document.getElementById('langToggle');
    if (langToggle) {
      langToggle.addEventListener('click', () => {
        I18n.toggle();
      });
    }

    // Initialize - show board modal, don't auto-load
    // Board modal is shown by default, user must choose mode
    wsStatus.style.display = 'none';
    usersOnlineEl.innerHTML = '';

    // Check URL params for board ID
    const urlParams = new URLSearchParams(window.location.search);
    const urlBoardId = urlParams.get('board');
    if (urlBoardId) {
      joinBoardNameInput.value = urlBoardId;
      document.querySelector('[data-tab="join"]').click();
    }

    // Auto-connect if board in localStorage
    const lastBoard = localStorage.getItem('wb-last-board');
    if (lastBoard && !urlBoardId) {
      newBoardNameInput.value = lastBoard;
    }

    // Handle window resize - update canvas centering
    window.addEventListener('resize', () => {
      setupCanvas();
      redraw();
    });
  </script>
</body>
</html>
