    function loadPageState(pageIndex) {
      objects = pages[pageIndex].objects;
      history = pages[pageIndex].history;
      historyIndex = pages[pageIndex].historyIndex;

      // Load images that don't have img object yet
      objects.forEach(obj => {
        if (obj.type === 'image' && obj.imgSrc && !obj.img) {
          const img = new Image();
          img.onload = () => {
            obj.img = img;
            redraw();
          };
          img.onerror = () => {
            console.error('[WB] Failed to load image on page switch');
            redraw(); // Show placeholder
          };
          img.src = obj.imgSrc;
        }
      });
    }

    function switchToPage(pageIndex, isAutoFollow = false) {
      if (pageIndex < 0 || pageIndex >= pages.length) return;

      // Exit follow mode if manual page switch (not auto-follow)
      if (!isAutoFollow && isFollowingUser) {
        stopFollowingUser();
      }

      // Save current page
      saveCurrentPageState();

      // Switch to new page
      currentPageIndex = pageIndex;
      loadPageState(pageIndex);

      selectedObjects = [];
      updateSelectedControls();
      redraw();
      updatePageUI();
      saveToLocalStorage();
      emitPageChange();
    }

    function addNewPage() {
      if (pages.length >= MAX_PAGES) return;

      // Save current page first
      saveCurrentPageState();

      // Create new page
      const newPage = { objects: [], history: [], historyIndex: -1 };
      pages.push(newPage);

      // Switch to new page
      currentPageIndex = pages.length - 1;
      loadPageState(currentPageIndex);

      selectedObjects = [];
      updateSelectedControls();
      redraw();
      updatePageUI();
      refreshPageGridIfOpen();
      saveToLocalStorage();
      emitPageOperation('add', currentPageIndex);
    }

    function deletePage(pageIndex) {
      if (pages.length <= 1) return;

      // Save to undo stack
      const deletedPage = JSON.parse(JSON.stringify(pages[pageIndex]));
      deletedPage.objects = pages[pageIndex].objects.map(obj => {
        if (obj.type === 'image') {
          return { ...obj, imgSrc: obj.imgSrc, img: undefined };
        }
        return { ...obj };
      });
      pageUndoStack.push({
        type: 'deletePage',
        page: deletedPage,
        index: pageIndex
      });

      pages.splice(pageIndex, 1);

      // Adjust current page index if needed
      if (currentPageIndex >= pages.length) {
        currentPageIndex = pages.length - 1;
      }

      loadPageState(currentPageIndex);
      selectedObjects = [];
      updateSelectedControls();
      redraw();
      updatePageUI();
      refreshPageGridIfOpen();
      saveToLocalStorage();
      emitPageOperation('delete', pageIndex);
    }

    function generateThumbnail(pageIndex) {
      // Create a temporary canvas for thumbnail
      const thumbCanvas = document.createElement('canvas');
      const thumbCtx = thumbCanvas.getContext('2d');
      const thumbWidth = 160;
      const thumbHeight = 100;

      thumbCanvas.width = thumbWidth;
      thumbCanvas.height = thumbHeight;

      // Scale to fit
      const scale = Math.min(thumbWidth / canvasLogicalWidth, thumbHeight / canvasLogicalHeight);

      thumbCtx.fillStyle = '#ffffff';
      thumbCtx.fillRect(0, 0, thumbWidth, thumbHeight);
      thumbCtx.save();
      thumbCtx.scale(scale, scale);

      // Draw page objects
      const pageObjects = pageIndex === currentPageIndex ? objects : pages[pageIndex].objects;

      for (const obj of pageObjects) {
        if (obj.type === 'brush' || obj.type === 'eraser') {
          thumbCtx.strokeStyle = obj.color;
          thumbCtx.lineWidth = obj.size;
          thumbCtx.lineCap = 'round';
          thumbCtx.lineJoin = 'round';
          thumbCtx.globalAlpha = obj.opacity;
          thumbCtx.beginPath();
          if (obj.points && obj.points.length > 0) {
            thumbCtx.moveTo(obj.points[0].x, obj.points[0].y);
            for (let i = 1; i < obj.points.length; i++) {
              thumbCtx.lineTo(obj.points[i].x, obj.points[i].y);
            }
          }
          thumbCtx.stroke();
          thumbCtx.globalAlpha = 1;
        } else if (obj.type === 'sticky') {
          thumbCtx.fillStyle = obj.color;
          thumbCtx.fillRect(obj.x, obj.y, obj.width, obj.height);
        } else if (obj.type === 'textbox' && obj.text) {
          thumbCtx.fillStyle = obj.color;
          thumbCtx.font = `${obj.bold ? 'bold ' : ''}${obj.fontSize || 18}px sans-serif`;
          thumbCtx.fillText(obj.text.substring(0, 20), obj.x, obj.y + (obj.fontSize || 18));
        } else if (obj.type === 'rect') {
          if (obj.fillColor && obj.fillColor !== 'transparent') {
            thumbCtx.fillStyle = obj.fillColor;
            thumbCtx.fillRect(obj.x1, obj.y1, obj.x2 - obj.x1, obj.y2 - obj.y1);
          }
          thumbCtx.strokeStyle = obj.color;
          thumbCtx.lineWidth = obj.size;
          thumbCtx.strokeRect(obj.x1, obj.y1, obj.x2 - obj.x1, obj.y2 - obj.y1);
        } else if (obj.type === 'circle') {
          const rx = Math.abs(obj.x2 - obj.x1) / 2;
          const ry = Math.abs(obj.y2 - obj.y1) / 2;
          const cx = (obj.x1 + obj.x2) / 2;
          const cy = (obj.y1 + obj.y2) / 2;
          thumbCtx.beginPath();
          thumbCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          if (obj.fillColor && obj.fillColor !== 'transparent') {
            thumbCtx.fillStyle = obj.fillColor;
            thumbCtx.fill();
          }
          thumbCtx.strokeStyle = obj.color;
          thumbCtx.lineWidth = obj.size;
          thumbCtx.stroke();
        } else if (obj.type === 'arrow') {
          // Arrow with x,y,width,height format for thumbnail
          const { x, y, width, height, rotation } = obj;
          const cx = x + width / 2;
          const cy = y + height / 2;

          thumbCtx.save();
          thumbCtx.translate(cx, cy);
          thumbCtx.rotate(rotation || 0);
          thumbCtx.translate(-cx, -cy);

          const w = width, h = height;
          const bodyWidth = h * 0.5;
          const headLen = Math.min(w * 0.35, h * 0.8);
          const bodyEnd = w - headLen;

          thumbCtx.beginPath();
          thumbCtx.moveTo(x, y + h/2 - bodyWidth/2);
          thumbCtx.lineTo(x + bodyEnd, y + h/2 - bodyWidth/2);
          thumbCtx.lineTo(x + bodyEnd, y);
          thumbCtx.lineTo(x + w, y + h/2);
          thumbCtx.lineTo(x + bodyEnd, y + h);
          thumbCtx.lineTo(x + bodyEnd, y + h/2 + bodyWidth/2);
          thumbCtx.lineTo(x, y + h/2 + bodyWidth/2);
          thumbCtx.closePath();

          if (obj.fillColor && obj.fillColor !== 'transparent') {
            thumbCtx.fillStyle = obj.fillColor;
            thumbCtx.fill();
          }
          thumbCtx.strokeStyle = obj.color;
          thumbCtx.lineWidth = obj.size;
          thumbCtx.stroke();
          thumbCtx.restore();
        } else if (obj.type === 'image' && obj.img) {
          thumbCtx.drawImage(obj.img, obj.x, obj.y, obj.width, obj.height);
        }
      }

      thumbCtx.restore();
      return thumbCanvas.toDataURL('image/png');
    }

    function updatePageUI() {
      // Update page info (Jamboard style: "1/5")
      pageInfo.textContent = `${currentPageIndex + 1}/${pages.length}`;

      // Update navigation buttons
      prevPageBtn.disabled = currentPageIndex === 0;
      nextPageBtn.disabled = false;

    nextPageBtn.addEventListener('click', () => {
      if (currentPageIndex < pages.length - 1) {

        switchToPage(currentPageIndex + 1);
      } else if (pages.length < MAX_PAGES) {
        // At last page and can add more - create new page
        addNewPage();
      }

    function closeAllPanels() {
      Object.values(toolPanels).forEach(panel => {

    function showToolPanel(toolName, btnEl) {
      closeAllPanels();

      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));

      currentTool = toolName;
      isDrawing = false;

      // Clear selection when switching to drawing tools
      if (currentTool !== 'select') {
        selectedObjects = [];
      }

      // Update cursor
      if (currentTool === 'select') {
        canvas.style.cursor = 'default';
      } else if (currentTool === 'sticky' || currentTool === 'text' || currentTool === 'image') {
        canvas.style.cursor = 'cell';
      } else {
        canvas.style.cursor = 'crosshair';
      }

      // Update secondary toolbar
      updateSecondaryToolbar(toolName);

      updateSelectedControls();
      redraw();

    // Update secondary toolbar based on selected tool

      document.querySelectorAll('.secondary-toolbar-section').forEach(s => s.classList.remove('active'));

      if (['rect', 'circle', 'arrow'].includes(toolName)) {
        document.getElementById('shapeToolbarSection').classList.add('active');
      } else if (toolName === 'text') {
        document.getElementById('textToolbarSection').classList.add('active');

    // Tool button click handlers
    document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {

        e.stopPropagation();
        const tool = btn.dataset.tool;

        // Handle image tool specially
        if (tool === 'image') {
          document.getElementById('imageUploadInput').click();
          return;
        }

        // Handle sticky tool - open modal immediately
        if (tool === 'sticky') {
          closeAllPanels();
          // Calculate center of visible canvas area
          const wrapper = document.getElementById('canvasWrapper');
          const rect = canvas.getBoundingClientRect();
          const centerX = (wrapper.scrollLeft + wrapper.clientWidth / 2) - rect.left + wrapper.getBoundingClientRect().left;
          const centerY = (wrapper.scrollTop + wrapper.clientHeight / 2) - rect.top + wrapper.getBoundingClientRect().top;
          openStickyModal(centerX - 100, centerY - 75); // Offset by half sticky size
          return;
        }

        // If tool has panel, toggle panel
        if (btn.classList.contains('has-panel')) {
          if (btn.classList.contains('active') && activePanel) {
            closeAllPanels();
          } else {
            selectTool(tool, btn);
            showToolPanel(tool, btn);
          }
        } else {
          closeAllPanels();
          selectTool(tool, btn);
        }
      });
    });

    // Shape panel buttons
    document.querySelectorAll('#shapePanel [data-shape]').forEach(btn => {

        btn.classList.add('active');
      });

        eraserSize = parseInt(btn.dataset.size);
        document.querySelectorAll('#eraserPanel [data-size]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });

    // Color buttons in panels
    document.querySelectorAll('.tool-panel .color-btn[data-color]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        setColor(btn.dataset.color, true);

        panel.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));

      });

    // Close panels when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.tool-panel') && !e.target.closest('.tool-btn')) {

      }
    });

    // ===== Zoom Control =====
    const zoomBtn = document.getElementById('zoomBtn');
    const zoomDropdown = document.getElementById('zoomDropdown');

    zoomBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      zoomDropdown.classList.toggle('open');
    });

    document.querySelectorAll('.zoom-option').forEach(opt => {
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        canvasZoom = parseInt(opt.dataset.zoom);
        applyZoom();
        document.querySelectorAll('.zoom-option').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        zoomDropdown.classList.remove('open');
      });
    });

    function applyZoom() {
      const zoomScale = canvasZoom / 100;
      const canvasDisplayW = canvasLogicalWidth * zoomScale;
      const canvasDisplayH = canvasLogicalHeight * zoomScale;

      // Update canvas display size (CSS)
      canvas.style.width = canvasDisplayW + 'px';
      canvas.style.height = canvasDisplayH + 'px';

      // Update canvas actual size (memory) - scaled for both DPR and zoom
      canvas.width = canvasLogicalWidth * dpr * zoomScale;
      canvas.height = canvasLogicalHeight * dpr * zoomScale;

      // Update container size to match
      canvasContainer.style.width = canvasDisplayW + 'px';
      canvasContainer.style.height = canvasDisplayH + 'px';
      canvasContainer.style.transform = 'none'; // Remove CSS scaling

      // Update centering margin based on wrapper size
      const wrapperRect = canvasWrapper.getBoundingClientRect();
      const padX = Math.max(0, (wrapperRect.width - canvasDisplayW) / 2);
      const padY = Math.max(0, (wrapperRect.height - canvasDisplayH) / 2);
      canvasContainer.style.margin = `${padY}px ${padX}px`;

      // Scale context to match DPR and zoom
      ctx.setTransform(dpr * zoomScale, 0, 0, dpr * zoomScale, 0, 0);

      // Redraw with new scale
      redraw();
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.zoom-selector')) {
        zoomDropdown.classList.remove('open');
      }
    });

    // ===== Page Dropdown =====
    const pageIndicator = document.getElementById('pageIndicator');
    const pageDropdown = document.getElementById('pageDropdown');
    const pageGrid = document.getElementById('pageGrid');

    pageIndicator.addEventListener('click', (e) => {
      e.stopPropagation();
      pageDropdown.classList.toggle('open');
      if (pageDropdown.classList.contains('open')) {
        renderPageGrid();
      }
    });

    let draggedPageIndex = null;

    function renderPageGrid() {
      pageGrid.innerHTML = '';
      pages.forEach((page, index) => {
        const thumb = document.createElement('div');
        thumb.className = 'page-thumb' + (index === currentPageIndex ? ' active' : '');
        thumb.draggable = true;
        thumb.dataset.pageIndex = index;
        const showDelete = pages.length > 1;
        thumb.innerHTML = `
          <img src="${generateThumbnail(index)}" alt="Page ${index + 1}" draggable="false">
          <span class="page-thumb-label">${index + 1}</span>
          ${showDelete ? '<button class="page-thumb-delete">×</button>' : ''}
        `;

        // Click to select page
        thumb.addEventListener('click', (e) => {
          if (e.target.classList.contains('page-thumb-delete')) return;
          e.stopPropagation();
          switchToPage(index);
          pageThumbnailFocused = true;
          renderPageGrid();
        });

        // Delete button
        if (showDelete) {
          thumb.querySelector('.page-thumb-delete').addEventListener('click', (e) => {
            e.stopPropagation();
            deletePage(index);
            renderPageGrid();
          });
        }

        // Drag start
        thumb.addEventListener('dragstart', (e) => {
          draggedPageIndex = index;
          thumb.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        // Drag end
        thumb.addEventListener('dragend', () => {
          thumb.classList.remove('dragging');
          draggedPageIndex = null;
          document.querySelectorAll('.page-thumb').forEach(t => t.classList.remove('drag-over'));
        });

        // Drag over
        thumb.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (draggedPageIndex !== null && draggedPageIndex !== index) {
            thumb.classList.add('drag-over');
          }
        });

        // Drag leave
        thumb.addEventListener('dragleave', () => {
          thumb.classList.remove('drag-over');
        });

        // Drop - reorder pages
        thumb.addEventListener('drop', (e) => {
          e.preventDefault();
          thumb.classList.remove('drag-over');
          if (draggedPageIndex !== null && draggedPageIndex !== index) {
            const fromIndex = draggedPageIndex;
            const toIndex = index;

            // Reorder pages array
            const [movedPage] = pages.splice(fromIndex, 1);
            pages.splice(toIndex, 0, movedPage);

            // Adjust currentPageIndex
            if (currentPageIndex === fromIndex) {
              currentPageIndex = toIndex;
            } else if (fromIndex < currentPageIndex && toIndex >= currentPageIndex) {
              currentPageIndex--;
            } else if (fromIndex > currentPageIndex && toIndex <= currentPageIndex) {
              currentPageIndex++;
            }

            updatePageUI();
            renderPageGrid();
            saveToLocalStorage();
            emitPageReorder(fromIndex, toIndex);
          }
          draggedPageIndex = null;
        });

        pageGrid.appendChild(thumb);
      });

      // Add new page button if under limit
      if (pages.length < MAX_PAGES) {
        const addBtn = document.createElement('button');
        addBtn.className = 'page-add-btn';
        addBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
        addBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          addNewPage();
          renderPageGrid();
        });
        pageGrid.appendChild(addBtn);
      }
    }

    // Refresh thumbnail grid if dropdown is open
    function refreshPageGridIfOpen() {
      if (pageDropdown.classList.contains('open')) {
        renderPageGrid();
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.page-indicator')) {
        pageDropdown.classList.remove('open');
        pageThumbnailFocused = false;
      }
    });

    // ===== Undo/Redo Buttons =====
    document.getElementById('undoBtn').addEventListener('click', () => undo());
    document.getElementById('redoBtn').addEventListener('click', () => redo());

    // ===== Image Upload Tool =====
    document.getElementById('imageUploadInput').addEventListener('change', (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
      const centerX = canvasLogicalWidth / 2;
      const centerY = canvasLogicalHeight / 2;

      files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            const maxSize = 300;

            if (width > maxSize || height > maxSize) {
              const scale = maxSize / Math.max(width, height);
              width *= scale;
              height *= scale;
            }

            const imgObj = {
              id: generateObjectId(),
              type: 'image',
              img: img,
              imgSrc: ev.target.result,
              x: centerX - width / 2 + index * 20,
              y: centerY - height / 2 + index * 20,
              width: width,
              height: height,
              opacity: 1
            };
            objects.push(imgObj);

            saveState();
            emitObjectChange('add', imgObj);
            redraw();
            switchToSelectTool();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      e.target.value = ''; // Reset input
    });

    // ===== Board Title Click to Copy =====
    const boardTitle = document.getElementById('boardTitle');
    boardTitle.addEventListener('click', async () => {
      if (!currentBoard) return;
      try {
        await navigator.clipboard.writeText(currentBoard.name);
        const original = boardTitle.textContent;
        boardTitle.textContent = I18n.t('whiteboard.collab.copied');
        setTimeout(() => {
          boardTitle.textContent = original;
        }, 1500);
      } catch (e) {
        console.error('Failed to copy:', e);
      }
    });

    // ===== Sticky Note Modal =====
    const stickyModal = document.getElementById('stickyModal');
    const stickyTextarea = document.getElementById('stickyTextarea');
    const stickyCancelBtn = document.getElementById('stickyCancelBtn');
    const stickySaveBtn = document.getElementById('stickySaveBtn');
    let stickyColor = '#ffd60a';
    let pendingStickyPosition = null;

    // Sticky color selection
    document.querySelectorAll('.sticky-color-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        stickyColor = btn.dataset.color;
        document.querySelectorAll('.sticky-color-opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        stickyTextarea.style.background = stickyColor;

    function openStickyModal(x, y) {
      pendingStickyPosition = { x, y };
      stickyTextarea.value = '';
      stickyTextarea.style.background = stickyColor;
      stickyModal.classList.add('open');
      setTimeout(() => stickyTextarea.focus(), 100);

    function closeStickyModal() {
      stickyModal.classList.remove('open');

    }

    stickyCancelBtn.addEventListener('click', closeStickyModal);
    stickySaveBtn.addEventListener('click', () => {
      if (pendingStickyPosition) {
        const text = stickyTextarea.value;
        const sticky = {
          id: generateObjectId(),
          type: 'sticky',
          x: pendingStickyPosition.x,
          y: pendingStickyPosition.y,
          width: 200,
          height: 150,
          color: stickyColor,
          textColor: '#1d1d1f',
          text: text,
          fontSize: 16,
          bold: false
        };
        objects.push(sticky);

        emitObjectChange('add', sticky);
        redraw();
        switchToSelectTool();
      }
      closeStickyModal();
    });

    stickyModal.addEventListener('click', (e) => {
      if (e.target === stickyModal) closeStickyModal();
    });

    // Enter to save, Shift+Enter for newline
    stickyTextarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        stickySaveBtn.click();
      }
    });

    // ===== Object Context Menu =====
    const objectMenuBtn = document.getElementById('objectMenuBtn');
    const objectMenuDropdown = document.getElementById('objectMenuDropdown');

    function showObjectMenu(obj) {
      if (!obj) return;

      const rect = canvas.getBoundingClientRect();
      const scale = canvasZoom / 100;
      const rotation = obj.rotation || 0;
      let cornerX, cornerY, cx, cy;

      if (obj.type === 'sticky' || obj.type === 'textbox' || obj.type === 'image' || obj.type === 'arrow') {
        cx = obj.x + obj.width / 2;
        cy = obj.y + obj.height / 2;
        // Top-right corner before rotation
        cornerX = obj.x + obj.width;
        cornerY = obj.y;
      } else if (obj.x1 !== undefined) {
        cx = (obj.x1 + obj.x2) / 2;
        cy = (obj.y1 + obj.y2) / 2;
        cornerX = Math.max(obj.x1, obj.x2);
        cornerY = Math.min(obj.y1, obj.y2);
      } else {
        return;
      }

      // Apply rotation to corner position
      let rotatedX = cornerX, rotatedY = cornerY;
      if (rotation !== 0) {
        const cos = Math.cos(rotation);
        const sin = Math.sin(rotation);
        const dx = cornerX - cx;
        const dy = cornerY - cy;
        rotatedX = cx + dx * cos - dy * sin;
        rotatedY = cy + dx * sin + dy * cos;
      }

      const menuX = rect.left + rotatedX * scale - 14;
      const menuY = rect.top + rotatedY * scale - 14;

      objectMenuBtn.style.left = menuX + 'px';
      objectMenuBtn.style.top = menuY + 'px';
      objectMenuBtn.style.display = 'flex';

      // Hide edit option for images
      const editItem = objectMenuDropdown.querySelector('[data-action="edit"]');
      if (editItem) {
        editItem.style.display = obj.type === 'image' ? 'none' : 'flex';
      }
    }

    function hideObjectMenu() {
      objectMenuBtn.style.display = 'none';
      objectMenuDropdown.classList.remove('open');

    objectMenuBtn.addEventListener('click', (e) => {

    document.querySelectorAll('.object-menu-item').forEach(item => {

        const action = item.dataset.action;
        if (selectedObjects.length === 1) {
          const obj = selectedObjects[0];
          if (action === 'edit') {
            startEditing(obj);
          } else if (action === 'duplicate') {
            const copy = JSON.parse(JSON.stringify(obj));
            copy.id = generateObjectId();
            copy.x = (copy.x || 0) + 20;
            copy.y = (copy.y || 0) + 20;
            if (copy.x1 !== undefined) { copy.x1 += 20; copy.x2 += 20; }
            if (copy.y1 !== undefined) { copy.y1 += 20; copy.y2 += 20; }
            // Restore image reference for image objects
            if (obj.type === 'image' && obj.img) {
              copy.img = obj.img;
            }
            objects.push(copy);
            saveState();
            emitObjectChange('add', copy);
            redraw();
          } else if (action === 'bringToFront') {
            const idx = objects.indexOf(obj);
            if (idx >= 0 && idx < objects.length - 1) {
              objects.splice(idx, 1);
              objects.push(obj);
              saveState();
              emitObjectChange('move', obj);
              redraw();
            }
          } else if (action === 'sendToBack') {
            const idx = objects.indexOf(obj);
            if (idx > 0) {
              objects.splice(idx, 1);
              objects.unshift(obj);
              saveState();
              emitObjectChange('move', obj);
              redraw();
            }
          } else if (action === 'delete') {
            const idx = objects.indexOf(obj);
            if (idx >= 0) {
              objects.splice(idx, 1);
              saveState();
              emitObjectChange('delete', obj);
              selectedObjects = [];
              redraw();
            }
          }
        }
        hideObjectMenu();
      });

    function updateSelectedControls() {

      document.querySelectorAll('.secondary-toolbar-section').forEach(s => s.classList.remove('active'));

      if (selectedObjects.length > 0) {

            strokeIndicator.style.backgroundSize = '4px 4px';

          if (fillColor === 'transparent') {
            fillIndicator.style.background = 'linear-gradient(45deg, #ccc 25%, transparent 25%),linear-gradient(-45deg, #ccc 25%, transparent 25%),linear-gradient(45deg, transparent 75%, #ccc 75%),linear-gradient(-45deg, transparent 75%, #ccc 75%)';
            fillIndicator.style.backgroundSize = '4px 4px';

        } else if (obj.type === 'sticky') {
          document.getElementById('stickyToolbarSection').classList.add('active');
          // Update sticky toolbar to reflect current object color
          document.querySelectorAll('.sticky-toolbar-color').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.stickyColor === obj.color);
          });
        } else if (obj.type === 'textbox') {
          document.getElementById('textToolbarSection').classList.add('active');
          // Update text toolbar to reflect current object
          textColorIndicator.style.background = obj.textColor || obj.color || '#1d1d1f';
          // Update alignment buttons
          const align = obj.textAlign || 'left';
          document.querySelectorAll('.align-btn').forEach(b => b.classList.remove('active'));
          document.querySelector(`.align-btn[data-align="${align}"]`)?.classList.add('active');
        } else {
          document.getElementById('defaultToolbarSection').classList.add('active');
        }
      } else {
        document.getElementById('defaultToolbarSection').classList.add('active');
      }
    }

    // Color selection - applies to current tool or selected objects
    function setColor(color, fromUserAction = false) {
      currentColor = color;
      if (colorPicker) colorPicker.value = color;

      // Apply to selected objects only if user clicked (not just updating UI)
      if (fromUserAction && selectedObjects.length > 0) {
        const colorableTypes = ['textbox', 'rect', 'circle', 'arrow', 'sticky'];
        const colorable = selectedObjects.filter(o => colorableTypes.includes(o.type));
        if (colorable.length > 0) {
          colorable.forEach(obj => {
            if (obj.type === 'sticky') {
              updateObjectProps(obj, { textColor: color });
            } else {
              updateObjectProps(obj, { color });
            }
          });
          saveState();

      }

      btn.addEventListener('click', () => {
        // Skip toolbar dropdown color buttons - they have their own handlers
        if (btn.closest('.secondary-toolbar-section')) return;
        setColor(btn.dataset.color, true);
      });

    // Stroke size - applies to current tool or selected shapes
    strokeSizeSlider.addEventListener('input', e => {

      // Apply to selected shapes if any
      const shapes = selectedObjects.filter(o =>
