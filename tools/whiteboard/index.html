<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page-title="whiteboard.title">在线白板 - Xin Utilities</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../../shared/api-config.js"></script>
  <script src="../../shared/i18n/i18n.js"></script>
  <script src="../../shared/i18n/zh.js"></script>
  <script src="../../shared/i18n/en.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Board Selection Modal -->
  <div class="modal-overlay" id="boardModal">
    <div class="modal-content">
      <h2 class="modal-title" data-i18n="whiteboard.collab.selectBoard">选择白板</h2>
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="create" data-i18n="whiteboard.collab.createNew">创建新白板</button>
        <button class="modal-tab" data-tab="join" data-i18n="whiteboard.collab.joinExisting">加入已有白板</button>
      </div>
      <div id="createTab">
        <label style="display:block; font-size:0.875rem; margin-bottom:0.5rem; color:var(--fg-muted);" data-i18n="whiteboard.collab.yourName">你的名称</label>
        <input type="text" class="modal-input" id="userName" data-i18n-placeholder="whiteboard.collab.namePlaceholder" placeholder="输入你的名称...">
        <label style="display:block; font-size:0.875rem; margin-bottom:0.5rem; color:var(--fg-muted);" data-i18n="whiteboard.collab.boardName">白板名称</label>
        <input type="text" class="modal-input" id="newBoardName" data-i18n-placeholder="whiteboard.collab.boardNamePlaceholder" placeholder="输入白板名称...">
        <button class="modal-btn" id="createBoardBtn" data-i18n="whiteboard.collab.create">创建</button>
        <div class="modal-error" id="createError" style="display:none;"></div>
      </div>
      <div id="joinTab" style="display:none;">
        <label style="display:block; font-size:0.875rem; margin-bottom:0.5rem; color:var(--fg-muted);" data-i18n="whiteboard.collab.yourName">你的名称</label>
        <input type="text" class="modal-input" id="joinUserName" data-i18n-placeholder="whiteboard.collab.namePlaceholder" placeholder="输入你的名称...">
        <label style="display:block; font-size:0.875rem; margin-bottom:0.5rem; color:var(--fg-muted);" data-i18n="whiteboard.collab.boardName">白板名称</label>
        <input type="text" class="modal-input" id="joinBoardName" data-i18n-placeholder="whiteboard.collab.boardNamePlaceholder" placeholder="输入白板名称...">
        <button class="modal-btn" id="joinBoardBtn" data-i18n="whiteboard.collab.join">加入</button>
        <div class="modal-error" id="joinError" style="display:none;"></div>
      </div>
      <div class="modal-local-link">
        <a id="localModeLink" data-i18n="whiteboard.collab.localMode">本地模式</a>
      </div>
    </div>
  </div>

  <!-- Remote Cursors Container -->
  <div id="remoteCursors"></div>

  <!-- Sticky Note Modal -->
  <div class="sticky-modal" id="stickyModal">
    <div class="sticky-modal-content">
      <div class="sticky-modal-header">
        <span class="sticky-modal-title" data-i18n="whiteboard.tools.sticky">Sticky note</span>
        <div class="sticky-color-options">
          <button class="sticky-color-opt active" data-color="#ffd60a" style="background:#ffd60a;" title="Yellow"></button>
          <button class="sticky-color-opt" data-color="#34c759" style="background:#34c759;" title="Green"></button>
          <button class="sticky-color-opt" data-color="#5ac8fa" style="background:#5ac8fa;" title="Cyan"></button>
          <button class="sticky-color-opt" data-color="#ff9ff3" style="background:#ff9ff3;" title="Pink"></button>
          <button class="sticky-color-opt" data-color="#ff9500" style="background:#ff9500;" title="Orange"></button>
        </div>
      </div>
      <div class="sticky-modal-body">
        <textarea class="sticky-textarea" id="stickyTextarea" placeholder="Enter text..."></textarea>
      </div>
      <div class="sticky-modal-footer">
        <button class="sticky-modal-btn cancel" id="stickyCancelBtn" data-i18n="common.cancel">Cancel</button>
        <button class="sticky-modal-btn save" id="stickySaveBtn" data-i18n="common.save">Save</button>
      </div>
    </div>
  </div>


  <!-- ===== Top Bar (Jamboard style) ===== -->
  <div class="top-bar" id="topBar">
    <div class="top-bar-left">
      <a href="../../index.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
      <span class="board-title" id="boardTitle" data-i18n-title="whiteboard.collab.clickToCopy" title="点击复制">Whiteboard</span>
      <div class="ws-status connecting" id="wsStatus" style="display:none;">
        <span class="ws-dot"></span>
        <span id="wsStatusText" data-i18n="whiteboard.collab.connecting">连接中...</span>
      </div>
    </div>

    <div class="top-bar-center">
      <!-- Page Selector: < 1/5 > -->
      <div class="page-selector">
        <button class="page-nav-btn" id="prevPageBtn" data-i18n-title="whiteboard.page.previous" title="上一页">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>

        <div class="page-indicator" id="pageIndicator">
          <div class="page-cards-icon">
            <div class="page-card-back"></div>
            <div class="page-card-front"><span id="pageInfo">1/1</span></div>
          </div>
          <div class="page-dropdown" id="pageDropdown">
            <div class="page-grid" id="pageGrid"></div>
            <button class="page-dropdown-close" id="pageDropdownClose">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 15l-6-6-6 6"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="page-nav-btn" id="nextPageBtn" data-i18n-title="whiteboard.page.next" title="下一页">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="top-bar-right">
      <div class="users-online" id="usersOnline"></div>
      <button class="download-btn" id="downloadBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span data-i18n="whiteboard.actions.download">下载</span>
      </button>
    </div>
  </div>

  <!-- ===== Secondary Toolbar ===== -->
  <div class="secondary-bar" id="secondaryBar">
    <button class="btn-icon" id="undoBtn" data-i18n-title="whiteboard.actions.undo" title="撤销">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 14L4 9l5-5"/>
        <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
      </svg>
    </button>
    <button class="btn-icon" id="redoBtn" data-i18n-title="whiteboard.actions.redo" title="重做">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 14l5-5-5-5"/>
        <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/>
      </svg>
    </button>

    <div class="toolbar-divider"></div>

    <div class="zoom-selector" id="zoomSelector">
      <button class="zoom-btn" id="zoomBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="10" cy="10" r="6"/>
          <line x1="10" y1="7" x2="10" y2="13"/>
          <line x1="7" y1="10" x2="13" y2="10"/>
          <line x1="14.5" y1="14.5" x2="20" y2="20"/>
        </svg>
        <span class="zoom-arrow"></span>
      </button>
      <div class="zoom-dropdown" id="zoomDropdown">
        <div class="zoom-option" data-zoom="50">50%</div>
        <div class="zoom-option" data-zoom="75">75%</div>
        <div class="zoom-option active" data-zoom="100">100%</div>
        <div class="zoom-option" data-zoom="125">125%</div>
        <div class="zoom-option" data-zoom="150">150%</div>
        <div class="zoom-option" data-zoom="200">200%</div>
      </div>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Default: Background & Clear button -->
    <div class="secondary-toolbar-section active" id="defaultToolbarSection">
      <div style="position:relative;">
        <button class="bg-btn" id="bgBtn" data-i18n="whiteboard.background.title">Background</button>
        <div class="bg-dropdown" id="bgDropdown">
          <div class="bg-pattern-row">
            <button class="bg-pattern-option active" data-pattern="none" title="Plain">
              <svg width="20" height="20" viewBox="0 0 20 20"><rect width="20" height="20" fill="#fff" stroke="#ddd"/><polyline points="2,18 18,2" stroke="#30d158" stroke-width="2"/></svg>
            </button>
            <button class="bg-pattern-option" data-pattern="grid" title="Grid">
              <svg width="20" height="20" viewBox="0 0 20 20"><rect width="20" height="20" fill="#fff" stroke="#ddd"/><path d="M5,0 V20 M10,0 V20 M15,0 V20 M0,5 H20 M0,10 H20 M0,15 H20" stroke="#ccc" stroke-width="0.5"/></svg>
            </button>
            <button class="bg-pattern-option" data-pattern="dots" title="Dots">
              <svg width="20" height="20" viewBox="0 0 20 20"><rect width="20" height="20" fill="#fff" stroke="#ddd"/><circle cx="5" cy="5" r="1" fill="#ccc"/><circle cx="10" cy="5" r="1" fill="#ccc"/><circle cx="15" cy="5" r="1" fill="#ccc"/><circle cx="5" cy="10" r="1" fill="#ccc"/><circle cx="10" cy="10" r="1" fill="#ccc"/><circle cx="15" cy="10" r="1" fill="#ccc"/><circle cx="5" cy="15" r="1" fill="#ccc"/><circle cx="10" cy="15" r="1" fill="#ccc"/><circle cx="15" cy="15" r="1" fill="#ccc"/></svg>
            </button>
            <button class="bg-pattern-option" data-pattern="lines" title="Lines">
              <svg width="20" height="20" viewBox="0 0 20 20"><rect width="20" height="20" fill="#fff" stroke="#ddd"/><path d="M0,5 H20 M0,10 H20 M0,15 H20" stroke="#ccc" stroke-width="0.5"/></svg>
            </button>
          </div>
          <div class="bg-color-row">
            <button class="bg-color-option active" data-color="#ffffff" style="background:#ffffff;"></button>
            <button class="bg-color-option" data-color="#f5f5f7" style="background:#f5f5f7;"></button>
            <button class="bg-color-option" data-color="#e8f4fd" style="background:#e8f4fd;"></button>
            <button class="bg-color-option" data-color="#1d1d1f" style="background:#1d1d1f;"></button>
          </div>
        </div>
      </div>
      <div class="toolbar-divider"></div>
      <button class="clear-btn" id="clearBtn" data-i18n="whiteboard.actions.clearFrame">清空画布</button>
    </div>

    <!-- Shape tool: stroke & fill color -->
    <div class="secondary-toolbar-section" id="shapeToolbarSection">
      <div style="position:relative;">
        <button class="toolbar-icon-btn" id="shapeStrokeBtn" title="Stroke color">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13.5 5.5L6.45321 12.5468C6.22845 12.7716 6.11607 12.8839 6.04454 13.0229C5.97301 13.1619 5.94689 13.3187 5.89463 13.6322L5.11508 18.3095C5.06262 18.6243 5.03639 18.7817 5.12736 18.8726C5.21833 18.9636 5.37571 18.9374 5.69048 18.8849L10.3678 18.1054L10.3678 18.1054C10.6813 18.0531 10.8381 18.027 10.9771 17.9555C11.1161 17.8839 11.2284 17.7716 11.4532 17.5468L11.4532 17.5468L18.5 10.5C19.5171 9.48295 20.0256 8.97442 20.1384 8.36277C20.1826 8.12295 20.1826 7.87705 20.1384 7.63723C20.0256 7.02558 19.5171 6.51705 18.5 5.5C17.4829 4.48295 16.9744 3.97442 16.3628 3.8616C16.1229 3.81737 15.8771 3.81737 15.6372 3.8616C15.0256 3.97442 14.5171 4.48294 13.5 5.5Z" fill-opacity="0.3"/>
            <path d="M12.2929 6.70711L6.45321 12.5468C6.22845 12.7716 6.11607 12.8839 6.04454 13.0229C5.97301 13.1619 5.94689 13.3187 5.89463 13.6322L5.11508 18.3095C5.06262 18.6243 5.03639 18.7817 5.12736 18.8726C5.21833 18.9636 5.37571 18.9374 5.69048 18.8849L10.3678 18.1054L10.3678 18.1054C10.6813 18.0531 10.8381 18.027 10.9771 17.9555C11.1161 17.8839 11.2284 17.7716 11.4532 17.5468L11.4532 17.5468L17.2929 11.7071C17.6262 11.3738 17.7929 11.2071 17.7929 11C17.7929 10.7929 17.6262 10.6262 17.2929 10.2929L17.2929 10.2929L13.7071 6.70711C13.3738 6.37377 13.2071 6.20711 13 6.20711C12.7929 6.20711 12.6262 6.37377 12.2929 6.70711Z"/>
          </svg>
          <span class="toolbar-color-indicator" id="shapeStrokeIndicator" style="background:#1d1d1f;"></span>
        </button>
        <div class="toolbar-color-dropdown" id="shapeStrokeDropdown">
          <div class="toolbar-color-grid">
            <button class="toolbar-color-option active" data-color="#1d1d1f" style="background:#1d1d1f;"></button>
            <button class="toolbar-color-option" data-color="#007aff" style="background:#007aff;"></button>
            <button class="toolbar-color-option" data-color="#34c759" style="background:#34c759;"></button>
            <button class="toolbar-color-option" data-color="#ffd60a" style="background:#ffd60a;"></button>
            <button class="toolbar-color-option" data-color="#ff3b30" style="background:#ff3b30;"></button>
            <button class="toolbar-color-option transparent" data-color="transparent" title="No stroke"></button>
          </div>
        </div>
      </div>
      <div style="position:relative;">
        <button class="toolbar-icon-btn" id="shapeFillBtn" title="Fill color">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 14c-.092.064-2 2.083-2 3.5 0 1.494.949 2.448 2 2.5.906.044 2-.891 2-2.5 0-1.5-1.908-3.436-2-3.5zM9.586 20c.378.378.88.586 1.414.586s1.036-.208 1.414-.586l7-7-.707-.707L11 4.586 8.707 2.293 7.293 3.707 9.586 6 4 11.586c-.378.378-.586.88-.586 1.414s.208 1.036.586 1.414L9.586 20zM11 7.414 16.586 13H5.414L11 7.414z"/>
          </svg>
          <span class="toolbar-color-indicator" id="shapeFillIndicator"></span>
        </button>
        <div class="toolbar-color-dropdown" id="shapeFillDropdown">
          <div class="toolbar-color-grid">
            <button class="toolbar-color-option" data-color="#1d1d1f" style="background:#1d1d1f;"></button>
            <button class="toolbar-color-option" data-color="#5ac8fa" style="background:#5ac8fa;"></button>
            <button class="toolbar-color-option" data-color="#a8e6cf" style="background:#a8e6cf;"></button>
            <button class="toolbar-color-option" data-color="#ffeaa7" style="background:#ffeaa7;"></button>
            <button class="toolbar-color-option" data-color="#fab1a0" style="background:#fab1a0;"></button>
            <button class="toolbar-color-option transparent active" data-color="transparent" title="Transparent"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Text tool: style, color, align -->
    <div class="secondary-toolbar-section" id="textToolbarSection">
      <div class="text-style-dropdown" id="textStyleDropdown">
        <button class="text-style-btn" id="textStyleBtn">
          <span id="textStyleLabel">Normal</span>
        </button>
        <div class="text-style-menu" id="textStyleMenu">
          <div class="text-style-option display" data-style="display" data-size="72">Display</div>
          <div class="text-style-option title" data-style="title" data-size="48">Title</div>
          <div class="text-style-option subtitle" data-style="subtitle" data-size="32">Subtitle</div>
          <div class="text-style-option normal active" data-style="normal" data-size="18">Normal</div>
          <div class="text-style-option caption" data-style="caption" data-size="14">Caption</div>
        </div>
      </div>
      <div style="position:relative;">
        <button class="toolbar-color-btn" id="textColorBtn" style="background:#fff;border:1px solid var(--border);" title="Text color">
          <span style="display:flex;flex-direction:column;align-items:center;gap:1px;">
            <span style="font-weight:bold;font-size:14px;color:var(--fg);">A</span>
            <span id="textColorIndicator" style="width:16px;height:3px;background:#1d1d1f;border-radius:1px;"></span>
          </span>
        </button>
        <div class="toolbar-color-dropdown" id="textColorDropdown">
          <div class="toolbar-color-grid">
            <button class="toolbar-color-option active" data-color="#1d1d1f" style="background:#1d1d1f;"></button>
            <button class="toolbar-color-option" data-color="#007aff" style="background:#007aff;"></button>
            <button class="toolbar-color-option" data-color="#34c759" style="background:#34c759;"></button>
            <button class="toolbar-color-option" data-color="#ffd60a" style="background:#ffd60a;"></button>
            <button class="toolbar-color-option" data-color="#ff3b30" style="background:#ff3b30;"></button>
            <button class="toolbar-color-option" data-color="#86868b" style="background:#86868b;"></button>
          </div>
        </div>
      </div>
      <button class="align-btn active" id="alignLeftBtn" data-align="left" title="Align left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
      </button>
      <button class="align-btn" id="alignCenterBtn" data-align="center" title="Align center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="10" x2="6" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="18" y1="18" x2="6" y2="18"/></svg>
      </button>
      <button class="align-btn" id="alignRightBtn" data-align="right" title="Align right">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></svg>
      </button>
    </div>

    <!-- Sticky note: background color only -->
    <div class="secondary-toolbar-section" id="stickyToolbarSection">
      <span style="font-size:13px;color:var(--fg-muted);margin-right:4px;" data-i18n="common.color">颜色</span>
      <button class="sticky-toolbar-color" data-sticky-color="#ffd60a" style="background:#ffd60a;" title="Yellow"></button>
      <button class="sticky-toolbar-color" data-sticky-color="#34c759" style="background:#34c759;" title="Green"></button>
      <button class="sticky-toolbar-color" data-sticky-color="#5ac8fa" style="background:#5ac8fa;" title="Cyan"></button>
      <button class="sticky-toolbar-color" data-sticky-color="#ff9ff3" style="background:#ff9ff3;" title="Pink"></button>
      <button class="sticky-toolbar-color" data-sticky-color="#ff9500" style="background:#ff9500;" title="Orange"></button>
    </div>
  </div>

  <!-- ===== Left Sidebar Toolbar ===== -->
  <div class="left-toolbar" id="leftToolbar">
    <!-- Brush -->
    <button class="tool-btn has-panel" id="brushTool" data-tool="brush" data-i18n-title="whiteboard.tools.brush" title="画笔">
      <svg width="22" height="22" viewBox="0 0 12 12" fill="currentColor" id="brushToolIcon">
        <rect x="8" y="0.9" width="2.9" height="5.6" rx="0.5" fill="currentColor" stroke="currentColor" stroke-width="0.5" transform="rotate(41.8 9.5 2.3)"/>
        <polygon points="5.2,5 7.3,6.9 3.3,11.3 1.2,11.6 1.2,9.5" fill="currentColor" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round"/>
        <polygon points="7,1.3 7.7,2 7.3,2.2 7,1.9 4.1,5.2 3.8,4.9" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Eraser -->
    <button class="tool-btn has-panel" id="eraserTool" data-tool="eraser" data-i18n-title="whiteboard.tools.eraser" title="橡皮擦">
      <svg width="22" height="22" viewBox="0 0 12 12" fill="currentColor">
        <polygon points="6.8,1.5 9.9,3.8 5.4,10 2,10 1.3,8.8" fill="currentColor" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round"/>
        <line x1="7.3" y1="10" x2="9.6" y2="10" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Select -->
    <button class="tool-btn active" id="selectTool" data-tool="select" data-i18n-title="whiteboard.tools.select" title="选择">
      <svg width="22" height="22" viewBox="0 0 11 18" fill="currentColor" stroke="currentColor">
        <polygon points="0.7,0.3 10.5,7.8 5.8,8.1 3.5,9.3 0.7,13" stroke-linejoin="round"/>
        <line x1="4.5" y1="8.3" x2="8.4" y2="15.9" fill="none" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="tool-divider"></div>

    <!-- Sticky Note -->
    <button class="tool-btn" id="stickyTool" data-tool="sticky" data-i18n-title="whiteboard.tools.sticky" title="便利贴">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/>
        <path d="M6 12 L 15 12"/>
        <path d="M6 16 L 18 16"/>
        <path d="M15 3v6h6"/>
      </svg>
    </button>

    <!-- Image -->
    <button class="tool-btn" id="imageTool" data-tool="image" data-i18n-title="whiteboard.tools.image" title="图片">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor">
        <path d="M 5 4 L 19 4 A 1 1 0 0 1 20 5 L 20 19 A 1 1 0 0 1 19 20 L 5 20 A 1 1 0 0 1 4 19 L 4 5 A 1 1 0 0 1 5 4 Z M 5.3 18.3 L 18.8 18.2 L 15 11.3 L 11.8 15.9 L 9.1 13.1 Z" fill-rule="evenodd"/>
      </svg>
    </button>
    <input type="file" id="imageUploadInput" accept="image/*" multiple>

    <!-- Shapes -->
    <button class="tool-btn has-panel" id="shapeTool" data-tool="circle" data-i18n-title="whiteboard.tools.shapes" title="形状">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="shapeToolIcon">
        <circle cx="12" cy="12" r="9"/>
      </svg>
    </button>

    <!-- Text -->
    <button class="tool-btn" id="textTool" data-tool="text" data-i18n-title="whiteboard.tools.text" title="文本框">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path d="M 7 5 H 17 M 7 19 H 17 M 5 7 V 17 M 19 7 V 17" stroke="currentColor" stroke-width="2" fill="none" />
        <rect x="3" y="3" width="4" height="4" stroke="currentColor" stroke-width="2" fill="var(--bg-card)" />
        <rect x="17" y="3" width="4" height="4" stroke="currentColor" stroke-width="2" fill="var(--bg-card)" />
        <rect x="3" y="17" width="4" height="4" stroke="currentColor" stroke-width="2" fill="var(--bg-card)" />
        <rect x="17" y="17" width="4" height="4" stroke="currentColor" stroke-width="2" fill="var(--bg-card)" />
        <path d="M 8.5 8 H 15.5 V 10 H 13 V 16 H 11 V 10 H 8.5 Z" fill="currentColor" />
      </svg>
    </button>

    <!-- Laser Pointer -->
    <button class="tool-btn" id="laserTool" data-tool="laser" data-i18n-title="whiteboard.tools.laser" title="激光笔">
      <svg width="22" height="22" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
        <polygon points="6.3,8.4 5,8.2 3.5,8.8 7.2,6 5.5,5.8 4.1,5.7 3.5,5.3 3.5,4.8 4.1,4.2 5.1,3.6 7.7,2.2 10.6,0.8 10.9,0.8 10.8,1.1 5.9,4.8 7.3,4.8 8.6,4.9 9.4,5.3 9.7,6 9.6,6.6 9.2,7.6 7.7,11.4 7.4,9.4" fill="currentColor" stroke="currentColor" stroke-width="0.3" stroke-linejoin="round"/>
        <circle cx="5.2" cy="10.8" r="2.5" fill="none" stroke="currentColor" stroke-width="0.5"/>
      </svg>
    </button>
  </div>

  <!-- ===== Tool Property Panels ===== -->
  <!-- Brush Panel -->
  <div class="tool-panel" id="brushPanel">
    <div class="panel-row">
      <button class="brush-type-btn active" data-brush-type="pen" data-i18n-title="whiteboard.tools.pen" title="Pen">
        <svg width="24" height="24" viewBox="0 0 12 12" fill="currentColor">
          <rect x="8" y="0.9" width="2.9" height="5.6" rx="0.5" fill="currentColor" stroke="currentColor" stroke-width="0.5" transform="rotate(41.8 9.5 2.3)"/>
          <polygon points="5.2,5 7.3,6.9 3.3,11.3 1.2,11.6 1.2,9.5" fill="currentColor" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round"/>
          <polygon points="7,1.3 7.7,2 7.3,2.2 7,1.9 4.1,5.2 3.8,4.9" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="brush-type-btn" data-brush-type="marker" data-i18n-title="whiteboard.tools.marker" title="Marker">
        <svg width="24" height="24" viewBox="0 0 12 12" fill="currentColor">
          <polygon points="9,0.7 10.6,1.8 7.9,5.9 6.3,4.8" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" transform="rotate(9.1 8.5 3.3)"/>
          <polygon points="4.8,5.3 6.4,6.4 3.7,10.5 2.1,9.4" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" transform="rotate(9.1 4.3 7.9)"/>
          <ellipse cx="1.7" cy="10.6" rx="0.6" ry="0.5" fill="currentColor" stroke="currentColor" transform="rotate(-51.2 1.7 10.6)"/>
        </svg>
      </button>
      <button class="brush-type-btn" data-brush-type="highlighter" data-i18n-title="whiteboard.tools.highlighter" title="Highlighter">
        <svg width="24" height="24" viewBox="0 0 12 12" fill="currentColor">
          <polygon points="8.8,0.5 11.2,2.1 8.4,6.1 6.1,4.5" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" transform="rotate(9.6 8.7 3.3)"/>
          <polygon points="1.7,9 2.6,10.7 0.2,10.7" fill="currentColor" stroke="currentColor" stroke-width="0.1" stroke-linejoin="round" transform="rotate(-0.1 1.5 10.3)"/>
          <polygon points="4.3,5 6.7,6.6 3.9,10.6 1.6,9" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" transform="rotate(10.8 4.2 7.8)"/>
        </svg>
      </button>
    </div>
    <div class="panel-row">
      <button class="color-btn active" data-color="#1d1d1f" style="background:#1d1d1f;" title="黑色"></button>
      <button class="color-btn" data-color="#007aff" style="background:#007aff;" title="蓝色"></button>
      <button class="color-btn" data-color="#34c759" style="background:#34c759;" title="绿色"></button>
      <button class="color-btn" data-color="#ff3b30" style="background:#ff3b30;" title="红色"></button>
      <div class="color-picker-btn" title="自定义颜色">
        <input type="color" id="colorPicker" value="#1d1d1f">
      </div>
    </div>
  </div>

  <!-- Eraser Panel -->
  <div class="tool-panel" id="eraserPanel">
    <div class="panel-row">
      <button class="brush-size-btn" data-size="10" title="小"><svg width="16" height="16"><circle cx="8" cy="8" r="4" fill="currentColor"/></svg></button>
      <button class="brush-size-btn active" data-size="20" title="中"><svg width="16" height="16"><circle cx="8" cy="8" r="5" fill="currentColor"/></svg></button>
      <button class="brush-size-btn" data-size="40" title="大"><svg width="16" height="16"><circle cx="8" cy="8" r="7" fill="currentColor"/></svg></button>
    </div>
  </div>

  <!-- Shape Panel -->
  <div class="tool-panel" id="shapePanel">
    <div class="panel-row">
      <button class="brush-size-btn active" data-shape="circle" title="圆形">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
      </button>
      <button class="brush-size-btn" data-shape="rect" title="矩形">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      </button>
      <button class="brush-size-btn" data-shape="arrow" title="箭头">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M 2 4 H 9 V 2 L 16 9 L 9 16 V 14 H 2 Z"/>
        </svg>
      </button>
    </div>
    <div class="panel-row">
      <button class="color-btn active" data-color="#1d1d1f" style="background:#1d1d1f;"></button>
      <button class="color-btn" data-color="#007aff" style="background:#007aff;"></button>
      <button class="color-btn" data-color="#34c759" style="background:#34c759;"></button>
      <button class="color-btn" data-color="#ff3b30" style="background:#ff3b30;"></button>
    </div>
  </div>

  <!-- ===== Canvas Area ===== -->
  <div class="canvas-wrapper" id="canvasWrapper">
    <div class="canvas-container" id="canvasContainer">
      <canvas id="canvas"></canvas>
      <!-- Object Context Menu (inside container to scroll with canvas) -->
      <div class="object-menu-btn" id="objectMenuBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
        </svg>
        <div class="object-menu-dropdown" id="objectMenuDropdown">
          <div class="object-menu-item" data-action="duplicate">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span data-i18n="whiteboard.menu.duplicate">Duplicate</span>
          </div>
          <div class="object-menu-divider"></div>
          <div class="object-menu-item" data-action="bringToFront">
            <svg viewBox="0 0 24 24"><rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="14" width="8" height="8" rx="1" fill="currentColor"/><path d="M14 10V8a2 2 0 0 0-2-2h-2m-4 8h2a2 2 0 0 0 2-2v-2"/></svg>
            <span data-i18n="whiteboard.menu.bringToFront">Bring to Front</span>
          </div>
          <div class="object-menu-item" data-action="sendToBack">
            <svg viewBox="0 0 24 24"><rect x="14" y="14" width="8" height="8" rx="1"/><rect x="2" y="2" width="8" height="8" rx="1" fill="currentColor"/><path d="M10 14v2a2 2 0 0 0 2 2h2m4-8h-2a2 2 0 0 0-2 2v2"/></svg>
            <span data-i18n="whiteboard.menu.sendToBack">Send to Back</span>
          </div>
          <div class="object-menu-divider"></div>
          <div class="object-menu-item" data-action="delete">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span data-i18n="whiteboard.menu.delete">Delete</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="hint">Ctrl+Z 撤销 | Delete 删除 | 双击编辑文字</div>

  <!-- Hidden elements for compatibility -->
  <input type="range" id="strokeSize" min="1" max="30" value="3" style="display:none;">
  <input type="range" id="opacity" min="10" max="100" value="100" style="display:none;">
  <div id="textSizeControl" style="display:none;">
    <input type="range" id="textSizeSlider" min="12" max="48" value="18">
    <button id="textBoldBtn">B</button>
  </div>
  <span id="saveIndicator" style="display:none;"></span>

  <!-- Follow indicator -->
  <div class="follow-indicator" id="followIndicator">
    <span class="follow-indicator-text" id="followIndicatorText"></span>
    <button class="follow-exit-btn" id="followExitBtn" data-i18n="whiteboard.collab.follow.exit">退出跟随 (ESC)</button>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/drawing.js"></script>
  <script src="js/objects.js"></script>
  <script src="js/history.js"></script>
  <script src="js/text-edit.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/collaboration.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/events.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
