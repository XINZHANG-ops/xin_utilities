<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --bg-card: #1a1a1a;
      --bg-hover: #2a2a2a;
      --accent: #ff9f0a;
      --accent-hover: #ffb340;
      --text: #fff;
      --text-muted: #888;
      --border: #333;
      --todo-accent: #2997ff;
      --progress-accent: #ff9f0a;
      --done-accent: #30d158;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .btn-primary {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: var(--bg-hover); }
    .input-field {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      width: 100%;
      font-size: 14px;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--accent);
    }
    .column {
      background: var(--bg-card);
      border-radius: 12px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }
    .column-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .column-content {
      padding: 12px;
      flex: 1;
      overflow-y: auto;
    }
    .task-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: grab;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .task-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.15;
      background: var(--card-color, transparent);
      pointer-events: none;
    }
    .task-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .task-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .task-card.dragging {
      opacity: 0.5;
      cursor: grabbing;
    }
    .task-card.color-blue { --card-color: #2997ff; border-left: 3px solid #2997ff; }
    .task-card.color-purple { --card-color: #bf5af2; border-left: 3px solid #bf5af2; }
    .task-card.color-green { --card-color: #30d158; border-left: 3px solid #30d158; }
    .task-card.color-orange { --card-color: #ff9f0a; border-left: 3px solid #ff9f0a; }
    .task-card.color-red { --card-color: #ff453a; border-left: 3px solid #ff453a; }
    .task-card.color-pink { --card-color: #ff6482; border-left: 3px solid #ff6482; }
    .task-card-title {
      font-weight: 500;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .task-card-preview {
      color: var(--text-muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .task-card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .attachment-badge {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(255, 159, 10, 0.1);
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
    }
    .close-btn:hover { color: var(--text); }
    .attachment-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .attachment-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .attachment-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .attachment-item .file-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 8px;
      text-align: center;
    }
    .attachment-item .file-name {
      font-size: 10px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }
    .attachment-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(255, 59, 48, 0.9);
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .add-card-btn {
      width: 100%;
      padding: 12px;
      border: 2px dashed var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    .add-card-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .lang-switch {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
    }
    .lang-switch:hover { background: var(--bg-hover); }
    .board-code {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    .copy-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }
    .copy-btn:hover { color: var(--text); }
    .status-indicator {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--done-accent);
    }
    .status-dot.saving { background: var(--accent); }
    .status-dot.error { background: #ff3b30; }
    textarea.input-field {
      min-height: 120px;
      resize: vertical;
    }
    .hidden { display: none !important; }

    /* Color Picker */
    .color-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .color-option {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .color-option::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%);
    }
    .color-option:hover { transform: scale(1.1); }
    .color-option.selected { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.3); }
    .color-option.color-none { background: var(--bg); border: 2px dashed var(--border); }
    .color-option.color-blue { background: linear-gradient(135deg, #2997ff 0%, #0077ed 100%); }
    .color-option.color-purple { background: linear-gradient(135deg, #bf5af2 0%, #9945ff 100%); }
    .color-option.color-green { background: linear-gradient(135deg, #30d158 0%, #28a745 100%); }
    .color-option.color-orange { background: linear-gradient(135deg, #ff9f0a 0%, #ff6b00 100%); }
    .color-option.color-red { background: linear-gradient(135deg, #ff453a 0%, #d63030 100%); }
    .color-option.color-pink { background: linear-gradient(135deg, #ff6482 0%, #ff2d55 100%); }

    /* Attachment actions */
    .attachment-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
    }
    .attachment-actions {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 2px;
      background: rgba(0,0,0,0.7);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .attachment-item:hover .attachment-actions { opacity: 1; }
    .attachment-action-btn {
      flex: 1;
      padding: 4px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .attachment-action-btn:hover { background: rgba(255,255,255,0.1); }

    /* Image Preview Modal */
    .preview-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .preview-content {
      max-width: 90vw;
      max-height: 90vh;
      position: relative;
    }
    .preview-content img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
    }
    .preview-toolbar {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: var(--bg-card);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .preview-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      padding: 8px;
    }

    /* Refresh button animation */
    .refresh-spinning svg {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Entry View -->
  <div id="entryView" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <nav class="mb-8">
        <a href="../../index.html" class="text-gray-400 hover:text-white text-sm flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span data-i18n="back">Back</span>
        </a>
      </nav>

      <h1 class="text-3xl font-bold mb-2">Kanban Board</h1>
      <p class="text-gray-400 mb-8" data-i18n="entryDesc">Create or join a shared board</p>

      <div class="space-y-6">
        <!-- Create Board -->
        <div class="card p-6">
          <h2 class="font-semibold mb-4" data-i18n="createBoard">Create New Board</h2>
          <div class="space-y-3">
            <input type="text" id="newBoardId" class="input-field" data-i18n-placeholder="boardCodePlaceholder" placeholder="Enter board code (e.g. my-project)">
            <button id="createBtn" class="btn-primary w-full" data-i18n="create">Create</button>
          </div>
          <p id="createError" class="text-red-500 text-sm mt-2 hidden"></p>
        </div>

        <!-- Join Board -->
        <div class="card p-6">
          <h2 class="font-semibold mb-4" data-i18n="joinBoard">Join Existing Board</h2>
          <div class="space-y-3">
            <input type="text" id="joinBoardId" class="input-field" data-i18n-placeholder="enterCodePlaceholder" placeholder="Enter board code">
            <button id="joinBtn" class="btn-primary w-full" data-i18n="join">Join</button>
          </div>
          <p id="joinError" class="text-red-500 text-sm mt-2 hidden"></p>
        </div>
      </div>

      <div class="mt-6 flex justify-center">
        <button id="langSwitchEntry" class="lang-switch">中文 / EN</button>
      </div>
    </div>
  </div>

  <!-- Board View -->
  <div id="boardView" class="min-h-screen hidden">
    <!-- Header -->
    <header class="border-b border-gray-800 px-4 py-3">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-4">
          <button id="backToEntry" class="text-gray-400 hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <h1 class="font-semibold">Kanban Board</h1>
          <div class="board-code">
            <span id="currentBoardId"></span>
            <button id="copyCodeBtn" class="copy-btn" title="Copy code">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <div id="saveStatus" class="status-indicator">
            <span class="status-dot"></span>
            <span data-i18n="saved">Saved</span>
          </div>
          <button id="refreshBtn" class="btn-secondary" style="padding: 6px 12px; display: flex; align-items: center; gap: 6px;">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            <span data-i18n="refresh">Refresh</span>
          </button>
          <button id="langSwitchBoard" class="lang-switch">中文 / EN</button>
        </div>
      </div>
    </header>

    <!-- Board Content -->
    <main class="p-4">
      <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Todo Column -->
        <div class="column" id="todoColumn">
          <div class="column-header" style="border-left: 3px solid var(--todo-accent);">
            <span data-i18n="todo">Todo</span>
            <span id="todoCount" class="text-gray-500 text-sm">(0)</span>
          </div>
          <div class="column-content" id="todoList"></div>
          <div class="p-3 border-t border-gray-800">
            <button id="addCardBtn" class="add-card-btn" data-i18n="addCard">+ Add Card</button>
          </div>
        </div>

        <!-- In Progress Column -->
        <div class="column" id="progressColumn">
          <div class="column-header" style="border-left: 3px solid var(--progress-accent);">
            <span data-i18n="inProgress">In Progress</span>
            <span id="progressCount" class="text-gray-500 text-sm">(0)</span>
          </div>
          <div class="column-content" id="progressList"></div>
        </div>

        <!-- Done Column -->
        <div class="column" id="doneColumn">
          <div class="column-header" style="border-left: 3px solid var(--done-accent);">
            <span data-i18n="done">Done</span>
            <span id="doneCount" class="text-gray-500 text-sm">(0)</span>
          </div>
          <div class="column-content" id="doneList"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Card Edit Modal -->
  <div id="cardModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle" class="font-semibold" data-i18n="editCard">Edit Card</h2>
        <button id="closeModal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body space-y-4">
        <div>
          <label class="block text-sm text-gray-400 mb-2" data-i18n="title">Title</label>
          <input type="text" id="cardTitle" class="input-field" data-i18n-placeholder="titlePlaceholder" placeholder="Card title">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-2" data-i18n="content">Content</label>
          <textarea id="cardContent" class="input-field" data-i18n-placeholder="contentPlaceholder" placeholder="Card description..."></textarea>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-2" data-i18n="cardColor">Color</label>
          <div id="colorPicker" class="color-picker">
            <div class="color-option color-none selected" data-color=""></div>
            <div class="color-option color-blue" data-color="blue"></div>
            <div class="color-option color-purple" data-color="purple"></div>
            <div class="color-option color-green" data-color="green"></div>
            <div class="color-option color-orange" data-color="orange"></div>
            <div class="color-option color-red" data-color="red"></div>
            <div class="color-option color-pink" data-color="pink"></div>
          </div>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-2" data-i18n="attachments">Attachments</label>
          <div id="attachmentDropZone" class="drop-zone">
            <p data-i18n="dropFiles">Drop files here or click to upload</p>
            <input type="file" id="attachmentInput" multiple class="hidden">
          </div>
          <div id="attachmentList" class="attachment-grid"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="deleteCardBtn" class="btn-secondary text-red-500 border-red-500 hover:bg-red-500/10" data-i18n="delete">Delete</button>
        <div class="flex gap-2">
          <button id="cancelModal" class="btn-secondary" data-i18n="cancel">Cancel</button>
          <button id="saveCardBtn" class="btn-primary" data-i18n="save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Image Preview Modal -->
  <div id="imagePreview" class="preview-overlay hidden">
    <div class="preview-content">
      <button id="closePreview" class="preview-close">&times;</button>
      <img id="previewImage" src="" alt="Preview">
      <div class="preview-toolbar">
        <button id="downloadPreview" class="btn-primary" style="padding: 8px 16px;">
          <span data-i18n="download">Download</span>
        </button>
      </div>
    </div>
  </div>

  <script src="../../shared/api-config.js"></script>
  <script>
    // ============ i18n ============

        entryDesc: 'Create or join a shared board',

        enterCodePlaceholder: 'Enter board code',
        create: 'Create',
        join: 'Join',
        todo: 'Todo',
        inProgress: 'In Progress',
        done: 'Done',
        addCard: '+ Add Card',
        editCard: 'Edit Card',
        newCard: 'New Card',
        title: 'Title',
        content: 'Content',
        cardColor: 'Color',
        attachments: 'Attachments',
        dropFiles: 'Drop files here or click to upload',
        save: 'Save',
        cancel: 'Cancel',
        delete: 'Delete',
        saved: 'Saved',
        saving: 'Saving...',
        errorSaving: 'Error saving',
        titlePlaceholder: 'Card title',

        inProgress: '进行中',
        done: '已完成',
        addCard: '+ 添加卡片',

        titlePlaceholder: '卡片标题',
        contentPlaceholder: '卡片描述...',
        errorBoardExists: '此看板代码已存在',
        errorBoardNotFound: '看板不存在',
        errorEmptyCode: '请输入看板代码',
        errorInvalidCode: '代码只能包含字母、数字、- 和 _',
        completedAt: '完成于',
        confirmDelete: '确定删除此卡片？',
        preview: '预览',
        download: '下载',
        refresh: '刷新'
      }
    };

    let currentLang = localStorage.getItem('kanban-lang') || 'en';

    function t(key) {
      return translations[currentLang][key] || key;
    }

    function updateUI() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
      });
    }

    function toggleLang() {
      currentLang = currentLang === 'en' ? 'zh' : 'en';
      localStorage.setItem('kanban-lang', currentLang);
      updateUI();
      renderCards();
    }

    // ============ State ============
    let currentBoard = null;
    let editingCard = null;
    let saveTimeout = null;
    let draggedCard = null;
    let autoRefreshInterval = null;
    let isSaving = false;
    const AUTO_REFRESH_SECONDS = 10;

    // ============ API ============
    const API_HEADERS = {
      'Content-Type': 'application/json',
      'ngrok-skip-browser-warning': 'true'
    };

    async function checkBoardExists(boardId) {
      const res = await fetch(API_CONFIG.getUrl(`/kanban/${boardId}/exists`), {
        headers: API_HEADERS
      });
      const data = await res.json();
      return data.exists;
    }

    async function loadBoard(boardId) {
      const res = await fetch(API_CONFIG.getUrl(`/kanban/${boardId}`), {
        headers: API_HEADERS
      });
      if (!res.ok) throw new Error('Board not found');
      return await res.json();
    }

    async function saveBoard() {
      if (!currentBoard) return;

      isSaving = true;
      updateSaveStatus('saving');
      try {
        const res = await fetch(API_CONFIG.getUrl(`/kanban/${currentBoard.id}`), {
          method: 'POST',
          headers: API_HEADERS,
          body: JSON.stringify(currentBoard)
        });
        if (!res.ok) throw new Error('Save failed');
        updateSaveStatus('saved');
      } catch (e) {
        console.error('Save error:', e);
        updateSaveStatus('error');
      } finally {
        isSaving = false;
      }
    }

    function autoSave() {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        await saveBoard();
        saveTimeout = null;
      }, 500);
    }

    function updateSaveStatus(status) {
      const el = document.getElementById('saveStatus');
      const dot = el.querySelector('.status-dot');
      const text = el.querySelector('[data-i18n]');

      dot.classList.remove('saving', 'error');
      if (status === 'saving') {
        dot.classList.add('saving');
        text.textContent = t('saving');
      } else if (status === 'error') {
        dot.classList.add('error');
        text.textContent = t('errorSaving');
      } else {
        text.textContent = t('saved');
      }
    }

    // ============ Board Operations ============
    function validateBoardId(id) {
      if (!id.trim()) return { valid: false, error: 'errorEmptyCode' };
      if (!/^[a-zA-Z0-9_-]+$/.test(id)) return { valid: false, error: 'errorInvalidCode' };
      return { valid: true };
    }

    async function createBoard() {
      const input = document.getElementById('newBoardId');
      const error = document.getElementById('createError');
      const boardId = input.value.trim();

      const validation = validateBoardId(boardId);
      if (!validation.valid) {
        error.textContent = t(validation.error);
        error.classList.remove('hidden');
        return;
      }

      error.classList.add('hidden');

      try {
        const exists = await checkBoardExists(boardId);
        if (exists) {
          error.textContent = t('errorBoardExists');
          error.classList.remove('hidden');
          return;
        }

        currentBoard = {
          id: boardId,
          createdAt: Date.now(),
          cards: []
        };

        await saveBoard();
        showBoardView();
      } catch (e) {
        error.textContent = e.message;
        error.classList.remove('hidden');
      }
    }

    async function joinBoard() {
      const input = document.getElementById('joinBoardId');
      const error = document.getElementById('joinError');
      const boardId = input.value.trim();

      const validation = validateBoardId(boardId);
      if (!validation.valid) {
        error.textContent = t(validation.error);
        error.classList.remove('hidden');
        return;
      }

      error.classList.add('hidden');

      try {
        currentBoard = await loadBoard(boardId);
        showBoardView();
      } catch (e) {
        error.textContent = t('errorBoardNotFound');
        error.classList.remove('hidden');
      }
    }

    function showBoardView() {
      document.getElementById('entryView').classList.add('hidden');
      document.getElementById('boardView').classList.remove('hidden');
      document.getElementById('currentBoardId').textContent = currentBoard.id;
      renderCards();
      startAutoRefresh();
    }

    function showEntryView() {
      document.getElementById('boardView').classList.add('hidden');
      document.getElementById('entryView').classList.remove('hidden');
      stopAutoRefresh();
      currentBoard = null;
    }

    async function refreshBoard(showAnimation = true) {
      if (!currentBoard) return;

      // Skip refresh if currently saving or has pending save
      if (isSaving || saveTimeout) {
        return;
      }

      const btn = document.getElementById('refreshBtn');
      if (showAnimation) btn.classList.add('refresh-spinning');

      try {
        const freshData = await loadBoard(currentBoard.id);
        currentBoard = freshData;
        renderCards();
      } catch (e) {
        console.error('Refresh error:', e);
      } finally {
        if (showAnimation) {
          setTimeout(() => btn.classList.remove('refresh-spinning'), 300);
        }
      }
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshInterval = setInterval(() => refreshBoard(false), AUTO_REFRESH_SECONDS * 1000);
    }

    function stopAutoRefresh() {
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
      }
    }

    // ============ Card Operations ============
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function getTodoCards() {
      return currentBoard.cards
        .filter(c => c.status === 'todo')
        .sort((a, b) => a.order - b.order);
    }

    function getProgressCards() {
      return currentBoard.cards
        .filter(c => c.status === 'progress')
        .sort((a, b) => a.order - b.order);
    }

    function getDoneCards() {
      return currentBoard.cards
        .filter(c => c.status === 'done')
        .sort((a, b) => b.doneAt - a.doneAt);
    }

    function renderCards() {
      const todoList = document.getElementById('todoList');
      const progressList = document.getElementById('progressList');
      const doneList = document.getElementById('doneList');

      const todoCards = getTodoCards();
      const progressCards = getProgressCards();
      const doneCards = getDoneCards();

      document.getElementById('todoCount').textContent = `(${todoCards.length})`;
      document.getElementById('progressCount').textContent = `(${progressCards.length})`;
      document.getElementById('doneCount').textContent = `(${doneCards.length})`;

      todoList.innerHTML = todoCards.map(card => renderCard(card)).join('');
      progressList.innerHTML = progressCards.map(card => renderCard(card)).join('');
      doneList.innerHTML = doneCards.map(card => renderCard(card, true)).join('');

      setupDragAndDrop();
    }

    function renderCard(card, isDone = false) {
      const hasAttachments = card.attachments && card.attachments.length > 0;
      const doneInfo = isDone && card.doneAt ?
        `<span>${t('completedAt')} ${new Date(card.doneAt).toLocaleDateString()}</span>` : '';
      const colorClass = card.color ? `color-${card.color}` : '';

      return `
        <div class="task-card ${colorClass}" draggable="true" data-card-id="${card.id}">
          <div class="task-card-title">${escapeHtml(card.title || t('newCard'))}</div>
          ${card.content ? `<div class="task-card-preview">${escapeHtml(card.content)}</div>` : ''}
          <div class="task-card-meta">
            ${hasAttachments ? `<span class="attachment-badge">📎 ${card.attachments.length}</span>` : ''}
            ${doneInfo}
          </div>
        </div>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function openCardModal(cardId = null) {
      const modal = document.getElementById('cardModal');
      const titleInput = document.getElementById('cardTitle');
      const contentInput = document.getElementById('cardContent');
      const modalTitle = document.getElementById('modalTitle');
      const deleteBtn = document.getElementById('deleteCardBtn');

      if (cardId) {
        editingCard = currentBoard.cards.find(c => c.id === cardId);
        modalTitle.textContent = t('editCard');
        deleteBtn.classList.remove('hidden');
      } else {
        editingCard = {
          id: generateId(),
          title: '',
          content: '',
          color: '',
          attachments: [],
          status: 'todo',
          order: getTodoCards().length,
          doneAt: null
        };
        modalTitle.textContent = t('newCard');
        deleteBtn.classList.add('hidden');
      }

      titleInput.value = editingCard.title || '';
      contentInput.value = editingCard.content || '';
      updateColorPicker(editingCard.color || '');
      renderAttachments();

      modal.classList.remove('hidden');
      titleInput.focus();
      // Keep auto-refresh running to see others' changes
    }

    function updateColorPicker(selectedColor) {
      document.querySelectorAll('#colorPicker .color-option').forEach(opt => {
        opt.classList.toggle('selected', opt.dataset.color === selectedColor);
      });
    }

    function closeCardModal() {
      document.getElementById('cardModal').classList.add('hidden');
      editingCard = null;
    }

    async function saveCard() {
      const titleInput = document.getElementById('cardTitle');
      const contentInput = document.getElementById('cardContent');
      const selectedColor = document.querySelector('#colorPicker .color-option.selected');

      editingCard.title = titleInput.value.trim();
      editingCard.content = contentInput.value.trim();
      editingCard.color = selectedColor ? selectedColor.dataset.color : '';

      // Fetch latest data to merge with others' changes
      try {
        const freshData = await loadBoard(currentBoard.id);

        // Merge: use fresh data as base, then add/update our card
        const existingIndex = freshData.cards.findIndex(c => c.id === editingCard.id);
        if (existingIndex >= 0) {
          freshData.cards[existingIndex] = editingCard;
        } else {
          freshData.cards.push(editingCard);
        }

        currentBoard = freshData;
      } catch (e) {
        // If fetch fails, fall back to local merge
        const existingIndex = currentBoard.cards.findIndex(c => c.id === editingCard.id);
        if (existingIndex >= 0) {
          currentBoard.cards[existingIndex] = editingCard;
        } else {
          currentBoard.cards.push(editingCard);
        }
      }

      closeCardModal();
      renderCards();
      autoSave();
    }

    async function deleteCard() {
      if (!confirm(t('confirmDelete'))) return;

      const cardIdToDelete = editingCard.id;

      // Fetch latest data to merge
      try {
        const freshData = await loadBoard(currentBoard.id);
        freshData.cards = freshData.cards.filter(c => c.id !== cardIdToDelete);
        currentBoard = freshData;
      } catch (e) {
        currentBoard.cards = currentBoard.cards.filter(c => c.id !== cardIdToDelete);
      }

      closeCardModal();
      renderCards();
      autoSave();
    }

    // ============ Attachments ============
    function renderAttachments() {
      const container = document.getElementById('attachmentList');
      if (!editingCard.attachments || editingCard.attachments.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = editingCard.attachments.map((att, idx) => {
        if (att.type.startsWith('image/')) {
          return `
            <div class="attachment-item" data-idx="${idx}">
              <img src="${att.data}" alt="${escapeHtml(att.name)}">
              <button class="attachment-remove" data-idx="${idx}">&times;</button>
              <div class="attachment-actions">
                <button class="attachment-action-btn preview-btn" data-idx="${idx}" title="${t('preview')}">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
                <button class="attachment-action-btn download-btn" data-idx="${idx}" title="${t('download')}">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                </button>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="attachment-item" data-idx="${idx}">
              <div class="file-icon">
                <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <span class="file-name">${escapeHtml(att.name)}</span>
              </div>
              <button class="attachment-remove" data-idx="${idx}">&times;</button>
              <div class="attachment-actions">
                <button class="attachment-action-btn download-btn" data-idx="${idx}" title="${t('download')}">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                </button>
              </div>
            </div>
          `;
        }
      }).join('');

      container.querySelectorAll('.attachment-remove').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.idx);
          editingCard.attachments.splice(idx, 1);
          renderAttachments();
        };
      });

      container.querySelectorAll('.preview-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.idx);
          openImagePreview(editingCard.attachments[idx]);
        };
      });

      container.querySelectorAll('.download-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.idx);
          downloadAttachment(editingCard.attachments[idx]);
        };
      });
    }

    function openImagePreview(attachment) {
      const preview = document.getElementById('imagePreview');
      const img = document.getElementById('previewImage');
      img.src = attachment.data;
      img.dataset.name = attachment.name;
      preview.classList.remove('hidden');
    }

    function closeImagePreview() {
      document.getElementById('imagePreview').classList.add('hidden');
    }

    function downloadAttachment(attachment) {
      const link = document.createElement('a');
      link.href = attachment.data;
      link.download = attachment.name;
      link.click();
    }

    async function handleFiles(files) {
      if (!editingCard.attachments) editingCard.attachments = [];

      for (const file of files) {
        if (file.size > 10 * 1024 * 1024) {
          alert(`File ${file.name} is too large (max 10MB)`);
          continue;
        }

        let data;
        if (file.type.startsWith('image/')) {
          data = await compressImage(file);
        } else {
          data = await readFileAsDataURL(file);
        }

        editingCard.attachments.push({
          name: file.name,
          type: file.type,
          data: data
        });
      }

      renderAttachments();
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function compressImage(file, maxWidth = 1200, quality = 0.8) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;

          if (width > maxWidth) {
            height = (height * maxWidth) / width;
            width = maxWidth;
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          let result = canvas.toDataURL('image/jpeg', quality);

          // If still too large, reduce quality further
          if (result.length > 500 * 1024) {
            result = canvas.toDataURL('image/jpeg', 0.6);
          }
          if (result.length > 500 * 1024) {
            result = canvas.toDataURL('image/jpeg', 0.4);
          }

          resolve(result);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    // ============ Drag & Drop ============
    function setupDragAndDrop() {
      const cards = document.querySelectorAll('.task-card');
      const todoList = document.getElementById('todoList');
      const progressList = document.getElementById('progressList');
      const doneList = document.getElementById('doneList');

      cards.forEach(card => {
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragend', handleDragEnd);
        card.addEventListener('click', () => openCardModal(card.dataset.cardId));
      });

      [todoList, progressList, doneList].forEach(list => {
        list.addEventListener('dragover', handleDragOver);
        list.addEventListener('drop', handleDrop);
        list.addEventListener('dragleave', handleDragLeave);
      });
    }

    function handleDragStart(e) {
      draggedCard = e.target;
      e.target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', e.target.dataset.cardId);
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      document.querySelectorAll('.drop-indicator').forEach(el => el.remove());
      draggedCard = null;
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';

      const list = e.currentTarget;
      list.classList.add('drag-over');

      // Find insertion point
      const cards = [...list.querySelectorAll('.task-card:not(.dragging)')];
      const afterCard = cards.find(card => {
        const rect = card.getBoundingClientRect();
        return e.clientY < rect.top + rect.height / 2;
      });

      // Remove existing indicator
      document.querySelectorAll('.drop-indicator').forEach(el => el.remove());

      // Add new indicator
      const indicator = document.createElement('div');
      indicator.className = 'drop-indicator';
      indicator.style.cssText = 'height: 4px; background: var(--accent); border-radius: 2px; margin: 4px 0;';

      if (afterCard) {
        list.insertBefore(indicator, afterCard);
      } else {
        list.appendChild(indicator);
      }
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    async function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      document.querySelectorAll('.drop-indicator').forEach(el => el.remove());

      const cardId = e.dataTransfer.getData('text/plain');
      const localCard = currentBoard.cards.find(c => c.id === cardId);
      if (!localCard) return;

      const targetList = e.currentTarget;
      const listId = targetList.id;
      const newStatus = listId === 'todoList' ? 'todo' :
                        listId === 'progressList' ? 'progress' : 'done';
      const needsOrder = newStatus === 'todo' || newStatus === 'progress';

      // Calculate new order before async operation
      let newOrder = 0;
      if (needsOrder) {
        const cards = [...targetList.querySelectorAll('.task-card:not(.dragging)')];
        const dropIndex = cards.findIndex(c => {
          const rect = c.getBoundingClientRect();
          return e.clientY < rect.top + rect.height / 2;
        });
        const existingCards = currentBoard.cards.filter(c => c.status === newStatus && c.id !== cardId);
        newOrder = dropIndex === -1 ? existingCards.length : dropIndex;
      }

      // Fetch latest and merge
      try {
        const freshData = await loadBoard(currentBoard.id);
        const card = freshData.cards.find(c => c.id === cardId);

        if (card) {
          card.status = newStatus;
          card.doneAt = newStatus === 'done' ? Date.now() : null;

          if (needsOrder) {
            card.order = newOrder;
            const allInStatus = freshData.cards.filter(c => c.status === newStatus);
            allInStatus.sort((a, b) => {
              if (a.id === cardId) return card.order - b.order - 0.5;
              if (b.id === cardId) return a.order - card.order + 0.5;
              return a.order - b.order;
            });
            allInStatus.forEach((c, i) => c.order = i);
          }

          currentBoard = freshData;
        }
      } catch (err) {
        const card = currentBoard.cards.find(c => c.id === cardId);
        if (card) {
          card.status = newStatus;
          card.doneAt = newStatus === 'done' ? Date.now() : null;
          if (needsOrder) {
            card.order = newOrder;
            const allInStatus = currentBoard.cards.filter(c => c.status === newStatus);
            allInStatus.sort((a, b) => a.order - b.order);
            allInStatus.forEach((c, i) => c.order = i);
          }
        }
      }

      renderCards();
      autoSave();
    }

    // ============ Event Listeners ============
    document.getElementById('createBtn').onclick = createBoard;
    document.getElementById('joinBtn').onclick = joinBoard;
    document.getElementById('backToEntry').onclick = showEntryView;
    document.getElementById('addCardBtn').onclick = () => openCardModal();
    document.getElementById('closeModal').onclick = closeCardModal;
    document.getElementById('cancelModal').onclick = closeCardModal;
    document.getElementById('saveCardBtn').onclick = saveCard;
    document.getElementById('deleteCardBtn').onclick = deleteCard;
    document.getElementById('langSwitchEntry').onclick = toggleLang;
    document.getElementById('langSwitchBoard').onclick = toggleLang;
    document.getElementById('refreshBtn').onclick = refreshBoard;

    document.getElementById('copyCodeBtn').onclick = () => {
      navigator.clipboard.writeText(currentBoard.id);
    };

    // Enter key handlers
    document.getElementById('newBoardId').onkeydown = (e) => {
      if (e.key === 'Enter') createBoard();
    };
    document.getElementById('joinBoardId').onkeydown = (e) => {
      if (e.key === 'Enter') joinBoard();
    };

    // Attachment handlers
    const dropZone = document.getElementById('attachmentDropZone');
    const fileInput = document.getElementById('attachmentInput');

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = () => handleFiles(fileInput.files);

    dropZone.ondragover = (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    };
    dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
    dropZone.ondrop = (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      handleFiles(e.dataTransfer.files);
    };

    // Close modal on escape
    document.onkeydown = (e) => {
      if (e.key === 'Escape') {
        if (!document.getElementById('imagePreview').classList.contains('hidden')) {
          closeImagePreview();
        } else if (!document.getElementById('cardModal').classList.contains('hidden')) {
          closeCardModal();
        }
      }
    };

    // Close modal on backdrop click
    document.getElementById('cardModal').onclick = (e) => {
      if (e.target.id === 'cardModal') closeCardModal();
    };

    // Color picker
    document.querySelectorAll('#colorPicker .color-option').forEach(opt => {
      opt.onclick = () => {
        document.querySelectorAll('#colorPicker .color-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
      };
    });

    // Image preview handlers
    document.getElementById('closePreview').onclick = closeImagePreview;
    document.getElementById('imagePreview').onclick = (e) => {
      if (e.target.id === 'imagePreview') closeImagePreview();
    };
    document.getElementById('downloadPreview').onclick = () => {
      const img = document.getElementById('previewImage');
      const link = document.createElement('a');
      link.href = img.src;
      link.download = img.dataset.name || 'image.jpg';
      link.click();
    };

    // Initialize
    updateUI();
  </script>
