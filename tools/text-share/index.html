<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Share</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --bg-card: #1a1a1a;
      --bg-hover: #2a2a2a;
      --accent: #ff9f0a;
      --accent-hover: #ffb340;
      --text: #fff;
      --text-muted: #888;
      --border: #333;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .btn-primary {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: var(--bg-hover); }
    .input-field {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      width: 100%;
      font-size: 14px;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--accent);
    }
    .lang-switch {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
    }
    .lang-switch:hover { background: var(--bg-hover); }
    .room-code {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    .copy-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }
    .copy-btn:hover { color: var(--text); }
    .status-indicator {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #30d158;
    }
    .status-dot.saving { background: var(--accent); }
    .status-dot.error { background: #ff3b30; }
    .hidden { display: none !important; }
    .text-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .text-box:focus-within {
      border-color: var(--accent);
    }
    .text-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .text-box-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .text-box textarea {
      width: 100%;
      min-height: 120px;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 12px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      resize: vertical;
      line-height: 1.6;
    }
    .text-box textarea:focus {
      outline: none;
    }
    .text-box textarea::placeholder {
      color: #555;
    }
    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      color: var(--text);
      background: rgba(255,255,255,0.08);
    }
    .copy-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
    }
    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      padding: 2px 4px;
      border-radius: 4px;
      user-select: none;
      display: flex;
      align-items: center;
    }
    .drag-handle:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .drag-handle:active { cursor: grabbing; }
    .text-box.drag-over { border-color: var(--accent); }
    .file-drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      margin: 12px;
    }
    .file-drop-zone:hover,
    .file-drop-zone.drag-active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(255,159,10,0.05);
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .file-item:last-child { border-bottom: none; }
    .file-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.06);
    }
    .file-info {
      flex: 1;
      min-width: 0;
    }
    .file-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size {
      font-size: 11px;
      color: var(--text-muted);
    }
    .upload-status-area {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .upload-status-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .upload-status-filename {
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }
    .upload-status-pct {
      color: var(--accent);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .upload-progress {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .upload-progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      width: 0%;
      transition: width 0.15s;
    }
    .remote-activity {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 11px;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      background: rgba(255,159,10,0.04);
    }
    .remote-activity .activity-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .add-box-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }
    .add-box-btn {
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 10px 20px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .add-box-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: var(--bg-hover);
    }
  </style>
</head>
<body>
  <!-- Entry View -->
  <div id="entryView" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <nav class="mb-8">
        <a href="../../index.html" class="text-gray-400 hover:text-white text-sm flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span data-i18n="back">Back</span>
        </a>
      </nav>

      <h1 class="text-3xl font-bold mb-2" data-i18n="pageTitle">Text Share</h1>
      <p class="text-gray-400 mb-8" data-i18n="entryDesc">Create or join a shared text room</p>

      <div class="space-y-6">
        <div class="card p-6">
          <h2 class="font-semibold mb-4" data-i18n="createRoom">Create New Room</h2>
          <div class="space-y-3">
            <input type="text" id="newRoomId" class="input-field" data-i18n-placeholder="roomCodePlaceholder" placeholder="Enter room code (e.g. my-notes)">
            <button id="createBtn" class="btn-primary w-full" data-i18n="create">Create</button>
          </div>
          <p id="createError" class="text-red-500 text-sm mt-2 hidden"></p>
        </div>

        <div class="card p-6">
          <h2 class="font-semibold mb-4" data-i18n="joinRoom">Join Existing Room</h2>
          <div class="space-y-3">
            <input type="text" id="joinRoomId" class="input-field" data-i18n-placeholder="enterCodePlaceholder" placeholder="Enter room code">
            <button id="joinBtn" class="btn-primary w-full" data-i18n="join">Join</button>
          </div>
          <p id="joinError" class="text-red-500 text-sm mt-2 hidden"></p>
        </div>
      </div>

      <div class="mt-6 flex justify-center">
        <button id="langSwitchEntry" class="lang-switch">中文 / EN</button>
      </div>
    </div>
  </div>

  <!-- Room View -->
  <div id="roomView" class="min-h-screen hidden">
    <header class="border-b border-gray-800 px-4 py-3">
      <div class="max-w-3xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-4">
          <button id="backToEntry" class="text-gray-400 hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <h1 class="font-semibold" data-i18n="pageTitle">Text Share</h1>
          <div class="room-code">
            <span id="currentRoomId"></span>
            <button id="copyCodeBtn" class="copy-btn" title="Copy code">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <div id="wsStatus" class="status-indicator">
            <span class="status-dot"></span>
            <span data-i18n="connecting">Connecting...</span>
          </div>
          <button id="langSwitchRoom" class="lang-switch">中文 / EN</button>
        </div>
      </div>
    </header>

    <main class="p-4">
      <div class="max-w-3xl mx-auto">
        <div id="boxContainer" class="space-y-4"></div>
        <div class="add-box-bar">
          <button id="addTextBoxBtn" class="add-box-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="addTextBox">+ Text Box</span>
          </button>
          <button id="addFileBoxBtn" class="add-box-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span data-i18n="addFileBox">+ File Box</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Copy Toast -->
  <div id="copyToast" class="copy-toast" data-i18n="copied">Copied!</div>

  <script src="../../shared/api-config.js"></script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script>
    // ============ i18n ============
    const MAX_FILE_SIZE = 500 * 1024 * 1024;

    const translations = {
      en: {
        back: 'Back',
        pageTitle: 'Text Share',
        entryDesc: 'Create or join a shared text room',
        createRoom: 'Create New Room',
        joinRoom: 'Join Existing Room',
        roomCodePlaceholder: 'Enter room code (e.g. my-notes)',
        enterCodePlaceholder: 'Enter room code',
        create: 'Create',
        join: 'Join',
        textBoxLabel: 'Text Box',
        fileBoxLabel: 'File Box',
        textPlaceholder: 'Type or paste text here...',
        connecting: 'Connecting...',
        liveSync: 'Live Sync',
        disconnected: 'Disconnected',
        reconnecting: 'Reconnecting...',
        copied: 'Copied!',
        errorRoomExists: 'This room code already exists',
        errorRoomNotFound: 'Room not found',
        errorEmptyCode: 'Please enter a room code',
        errorInvalidCode: 'Code can only contain letters, numbers, - and _',
        addTextBox: '+ Text Box',
        addFileBox: '+ File Box',
        dropFileHere: 'Drop files here or click to select',
        addFile: 'Add File',
        download: 'Download',
        downloadAll: 'Download All',
        uploading: 'Uploading...',
        uploadError: 'Upload failed',
        fileTooLarge: 'File exceeds 500 MB limit',
        removeFile: 'Remove',
        remoteUploading: '{n} file(s) uploading...',
        remoteDownloading: '{n} file(s) downloading...',
        cancelUpload: 'Cancel upload'
      },
      zh: {
        back: '返回',
        pageTitle: '文本共享',
        entryDesc: '创建或加入共享文本房间',
        createRoom: '创建新房间',
        joinRoom: '加入已有房间',
        roomCodePlaceholder: '输入房间代码 (例如 my-notes)',
        enterCodePlaceholder: '输入房间代码',
        create: '创建',
        join: '加入',
        textBoxLabel: '文本框',
        fileBoxLabel: '文件框',
        textPlaceholder: '在此输入或粘贴文本...',
        connecting: '连接中...',
        liveSync: '实时同步',
        disconnected: '已断开',
        reconnecting: '重连中...',
        copied: '已复制！',
        errorRoomExists: '此房间代码已存在',
        errorRoomNotFound: '房间不存在',
        errorEmptyCode: '请输入房间代码',
        errorInvalidCode: '代码只能包含字母、数字、- 和 _',
        addTextBox: '+ 文本框',
        addFileBox: '+ 文件框',
        dropFileHere: '拖拽文件到此处或点击选择',
        addFile: '添加文件',
        download: '下载',
        downloadAll: '下载全部',
        uploading: '上传中...',
        uploadError: '上传失败',
        fileTooLarge: '文件超过 500 MB 限制',
        removeFile: '移除',
        remoteUploading: '{n} 个文件上传中...',
        remoteDownloading: '{n} 个文件下载中...',
        cancelUpload: '取消上传'
      }
    };

    let currentLang = localStorage.getItem('textshare-lang') || 'en';

    function t(key) {
      return translations[currentLang][key] || key;
    }

    function updateUI() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
      });
    }

    function toggleLang() {
      currentLang = currentLang === 'en' ? 'zh' : 'en';
      localStorage.setItem('textshare-lang', currentLang);
      updateUI();
      renderBoxes();
    }

    // ============ State ============
    let currentRoom = null;
    let saveTimeout = null;
    let dragSrcId = null;
    let socket = null;
    let hasConnectedBefore = false;
    const activeUploads = new Map();
    const remoteActivity = new Map();
    const activeXHRs = new Map();

    // ============ Helpers ============
    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function getFileIcon(mimeType) {
      if (!mimeType) return '📄';
      if (mimeType.startsWith('image/')) return '🖼️';
      if (mimeType.startsWith('video/')) return '🎬';
      if (mimeType.startsWith('audio/')) return '🎵';
      if (mimeType.includes('pdf')) return '📕';
      if (mimeType.includes('zip') || mimeType.includes('rar') || mimeType.includes('7z') || mimeType.includes('tar')) return '📦';
      if (mimeType.includes('word') || mimeType.includes('document')) return '📝';
      if (mimeType.includes('sheet') || mimeType.includes('excel')) return '📊';
      if (mimeType.includes('presentation') || mimeType.includes('powerpoint')) return '📽️';
      return '📄';
    }

    // ============ WebSocket ============
    function updateWsStatus(status) {
      const el = document.getElementById('wsStatus');
      if (!el) return;
      const dot = el.querySelector('.status-dot');
      const text = el.querySelector('[data-i18n]');

      dot.classList.remove('saving', 'error');
      if (status === 'connected') {
        text.dataset.i18n = 'liveSync';
        text.textContent = t('liveSync');
      } else if (status === 'disconnected') {
        dot.classList.add('error');
        text.dataset.i18n = 'disconnected';
        text.textContent = t('disconnected');
      } else if (status === 'reconnecting') {
        dot.classList.add('saving');
        text.dataset.i18n = 'reconnecting';
        text.textContent = t('reconnecting');
      } else {
        dot.classList.add('saving');
        text.dataset.i18n = 'connecting';
        text.textContent = t('connecting');
      }
    }

    function connectWebSocket(roomId) {
      if (socket) socket.disconnect();

      updateWsStatus('connecting');
      hasConnectedBefore = false;

      try {
        socket = io(API_CONFIG.getBaseUrl(), {
          transports: ['websocket'],
          reconnection: true,
          reconnectionAttempts: Infinity,
          reconnectionDelay: 1000,
          reconnectionDelayMax: 5000,
          timeout: 20000
        });

        socket.on('connect', () => {
          socket.emit('ts_join', { room_id: roomId });
          updateWsStatus('connected');

          if (hasConnectedBefore) {
            remoteActivity.clear();
            loadRoomFromServer(roomId);
          }
          hasConnectedBefore = true;
        });

        socket.on('ts_joined', (data) => {
          console.log('[WS] Joined room:', data.room_id);
        });

        socket.on('ts_updated', (data) => {
          applyRemoteUpdate(data);
        });

        socket.on('ts_synced', (room) => {
          currentRoom = room;
          renderBoxes();
        });

        socket.on('disconnect', () => {
          updateWsStatus('disconnected');
        });

        socket.on('reconnect_attempt', () => {
          updateWsStatus('reconnecting');
        });

        socket.on('connect_error', () => {
          updateWsStatus('disconnected');
        });

      } catch (e) {
        console.error('[WS] Init failed:', e);
        updateWsStatus('disconnected');
      }
    }

    function disconnectWebSocket() {
      if (socket) {
        if (currentRoom) {
          socket.emit('ts_leave', { room_id: currentRoom.id });
        }
        socket.disconnect();
        socket = null;
      }
    }

    async function loadRoomFromServer(roomId) {
      try {
        const res = await fetch(API_CONFIG.getUrl(`/textshare/${roomId}`), {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        if (res.ok) {
          currentRoom = await res.json();
          renderBoxes();
        }
      } catch (e) {
        console.error('[HTTP] Reload failed:', e);
      }
    }

    function emitBoxUpdate(action, box) {
      autoSave();

      if (socket && socket.connected && currentRoom) {
        socket.emit('ts_broadcast', {
          room_id: currentRoom.id,
          action: action,
          box: box
        });
      }
    }

    function emitActivity(action, boxId) {
      if (socket && socket.connected && currentRoom) {
        socket.emit('ts_broadcast', {
          room_id: currentRoom.id,
          action: action,
          box: { id: boxId }
        });
      }
    }

    function applyRemoteUpdate(data) {
      const { action, box } = data;
      if (!currentRoom || !box) return;

      if (action === 'add') {
        const exists = currentRoom.boxes.some(b => b.id === box.id);
        if (!exists) {
          currentRoom.boxes.push(box);
        }
      } else if (action === 'insert') {
        const exists = currentRoom.boxes.some(b => b.id === box.id);
        if (!exists) {
          const afterIdx = currentRoom.boxes.findIndex(b => b.id === box.afterId);
          if (afterIdx >= 0) {
            currentRoom.boxes.splice(afterIdx + 1, 0, box);
          } else {
            currentRoom.boxes.push(box);
          }
        }
      } else if (action === 'reorder') {
        if (box.order) {
          const boxMap = {};
          currentRoom.boxes.forEach(b => { boxMap[b.id] = b; });
          currentRoom.boxes = box.order.map(id => boxMap[id]).filter(Boolean);
        }
      } else if (action === 'update') {
        const idx = currentRoom.boxes.findIndex(b => b.id === box.id);
        if (idx >= 0) {
          if (box.type === 'file') {
            currentRoom.boxes[idx] = box;
            renderBoxes();
            return;
          }
          const textarea = document.querySelector(`[data-box-id="${box.id}"] textarea`);
          currentRoom.boxes[idx] = box;
          if (textarea && document.activeElement !== textarea) {
            textarea.value = box.content;
          }
          return;
        }
      } else if (action === 'delete') {
        currentRoom.boxes = currentRoom.boxes.filter(b => b.id !== box.id);
        remoteActivity.delete(box.id);
      } else if (action === 'upload_start' || action === 'upload_end' ||
                 action === 'download_start' || action === 'download_end') {
        updateRemoteActivity(action, box.id);
        return;
      }

      renderBoxes();
    }

    function updateRemoteActivity(action, boxId) {
      let state = remoteActivity.get(boxId) || { uploading: 0, downloading: 0 };
      if (action === 'upload_start') state.uploading++;
      else if (action === 'upload_end') state.uploading = Math.max(0, state.uploading - 1);
      else if (action === 'download_start') state.downloading++;
      else if (action === 'download_end') state.downloading = Math.max(0, state.downloading - 1);

      if (state.uploading === 0 && state.downloading === 0) {
        remoteActivity.delete(boxId);
      } else {
        remoteActivity.set(boxId, state);
      }
      renderRemoteActivityForBox(boxId);
    }

    function renderRemoteActivityForBox(boxId) {
      const boxEl = document.querySelector(`[data-box-id="${boxId}"]`);
      if (!boxEl) return;
      let indicator = boxEl.querySelector('.remote-activity');
      const state = remoteActivity.get(boxId);

      if (!state) {
        if (indicator) indicator.remove();
        return;
      }

      const parts = [];
      if (state.uploading > 0) parts.push(t('remoteUploading').replace('{n}', state.uploading));
      if (state.downloading > 0) parts.push(t('remoteDownloading').replace('{n}', state.downloading));
      const text = parts.join('  ');

      if (!indicator) {
        indicator = document.createElement('div');
        indicator.className = 'remote-activity';
        const header = boxEl.querySelector('.text-box-header');
        header.insertAdjacentElement('afterend', indicator);
      }
      indicator.innerHTML = `<span class="activity-dot"></span>${text}`;
    }

    // ============ API ============
    async function checkRoomExists(roomId) {
      const res = await fetch(API_CONFIG.getUrl(`/textshare/${roomId}/exists`), {
        headers: { 'ngrok-skip-browser-warning': 'true' }
      });
      const data = await res.json();
      return data.exists;
    }

    async function loadRoom(roomId) {
      const res = await fetch(API_CONFIG.getUrl(`/textshare/${roomId}`), {
        headers: { 'ngrok-skip-browser-warning': 'true' }
      });
      if (!res.ok) throw new Error('Room not found');
      return await res.json();
    }

    async function saveRoom() {
      if (!currentRoom) return;
      try {
        await fetch(API_CONFIG.getUrl(`/textshare/${currentRoom.id}`), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify(currentRoom)
        });
      } catch (e) {
        console.error('[HTTP] Save error:', e);
      }
    }

    function autoSave() {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        saveRoom();
        saveTimeout = null;
      }, 500);
    }

    // ============ File Operations ============
    function applyUploadStatusToDOM(boxId, fileName, pct) {
      const boxEl = document.querySelector(`[data-box-id="${boxId}"]`);
      if (!boxEl) return;
      const area = boxEl.querySelector('.upload-status-area');
      const nameEl = boxEl.querySelector('.upload-status-filename');
      const pctEl = boxEl.querySelector('.upload-status-pct');
      const bar = boxEl.querySelector('.upload-progress-bar');
      const dropZone = boxEl.querySelector('.file-drop-zone');
      if (area) area.classList.remove('hidden');
      if (nameEl) nameEl.textContent = fileName;
      if (pctEl) pctEl.textContent = pct + '%';
      if (bar) bar.style.width = pct + '%';
      if (dropZone) dropZone.style.display = 'none';
    }

    function showUploadStatus(boxId, fileName) {
      activeUploads.set(boxId, { fileName, pct: 0 });
      applyUploadStatusToDOM(boxId, fileName, 0);
    }

    function updateUploadProgress(boxId, pct) {
      const state = activeUploads.get(boxId);
      if (state) state.pct = pct;
      applyUploadStatusToDOM(boxId, state ? state.fileName : '', pct);
    }

    function hideUploadStatus(boxId) {
      activeUploads.delete(boxId);
      const boxEl = document.querySelector(`[data-box-id="${boxId}"]`);
      if (!boxEl) return;
      const area = boxEl.querySelector('.upload-status-area');
      const dropZone = boxEl.querySelector('.file-drop-zone');
      if (area) area.classList.add('hidden');
      if (dropZone) dropZone.style.display = '';
    }

    function restoreActiveUploads() {
      activeUploads.forEach(({ fileName, pct }, boxId) => {
        applyUploadStatusToDOM(boxId, fileName, pct);
      });
    }

    async function uploadFile(file, boxId) {
      if (file.size > MAX_FILE_SIZE) {
        showToastMsg(t('fileTooLarge'));
        return null;
      }

      showUploadStatus(boxId, file.name);
      emitActivity('upload_start', boxId);

      const formData = new FormData();
      formData.append('file', file);

      try {
        const xhr = new XMLHttpRequest();
        activeXHRs.set(boxId, xhr);
        const result = await new Promise((resolve, reject) => {
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
              updateUploadProgress(boxId, Math.round((e.loaded / e.total) * 100));
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              resolve(JSON.parse(xhr.responseText));
            } else {
              reject(new Error(t('uploadError')));
            }
          };
          xhr.onerror = () => reject(new Error(t('uploadError')));
          xhr.onabort = () => reject(new Error('aborted'));
          xhr.open('POST', API_CONFIG.getUrl(`/textshare/${currentRoom.id}/upload`));
          xhr.setRequestHeader('ngrok-skip-browser-warning', 'true');
          xhr.send(formData);
        });

        updateUploadProgress(boxId, 100);
        return result;
      } catch (e) {
        if (e.message === 'aborted') return null;
        console.error('[Upload]', e);
        showToastMsg(t('uploadError'));
        return null;
      } finally {
        activeXHRs.delete(boxId);
        hideUploadStatus(boxId);
        emitActivity('upload_end', boxId);
      }
    }

    const cancelledUploads = new Set();

    function cancelUpload(boxId) {
      cancelledUploads.add(boxId);
      const xhr = activeXHRs.get(boxId);
      if (xhr) xhr.abort();
    }

    async function handleFilesForBox(boxId, fileList) {
      if (!currentRoom) return;
      cancelledUploads.delete(boxId);

      const newFiles = [];
      for (const file of fileList) {
        if (cancelledUploads.has(boxId)) break;
        const meta = await uploadFile(file, boxId);
        if (meta) newFiles.push(meta);
      }

      if (newFiles.length === 0) return;

      const box = currentRoom.boxes.find(b => b.id === boxId);
      if (!box) return;
      if (!box.files) box.files = [];
      box.files.push(...newFiles);
      box.lastModified = Date.now();

      renderBoxes();
      emitBoxUpdate('update', box);
    }

    function removeFileFromBox(boxId, fileId) {
      const box = currentRoom.boxes.find(b => b.id === boxId);
      if (!box || !box.files) return;
      box.files = box.files.filter(f => f.fileId !== fileId);
      box.lastModified = Date.now();
      renderBoxes();
      emitBoxUpdate('update', box);

      fetch(API_CONFIG.getUrl(`/textshare/${currentRoom.id}/files/${fileId}`), {
        method: 'DELETE',
        headers: { 'ngrok-skip-browser-warning': 'true' }
      }).catch(() => {});
    }

    function downloadBoxFiles(boxId) {
      const box = currentRoom.boxes.find(b => b.id === boxId);
      if (!box || !box.files || box.files.length === 0) return;

      emitActivity('download_start', boxId);

      if (box.files.length === 1) {
        const f = box.files[0];
        const url = API_CONFIG.getUrl(`/textshare/${currentRoom.id}/files/${f.fileId}`);
        const a = document.createElement('a');
        a.href = url;
        a.download = f.fileName;
        a.click();
      } else {
        const url = API_CONFIG.getUrl(`/textshare/${currentRoom.id}/download/${boxId}`);
        const a = document.createElement('a');
        a.href = url;
        a.download = boxId + '.zip';
        a.click();
      }

      setTimeout(() => emitActivity('download_end', boxId), 2000);
    }

    // ============ Room Operations ============
    function validateRoomId(id) {
      if (!id.trim()) return { valid: false, error: 'errorEmptyCode' };
      if (!/^[a-zA-Z0-9_-]+$/.test(id)) return { valid: false, error: 'errorInvalidCode' };
      return { valid: true };
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    async function createRoom() {
      const input = document.getElementById('newRoomId');
      const error = document.getElementById('createError');
      const roomId = input.value.trim();

      const validation = validateRoomId(roomId);
      if (!validation.valid) {
        error.textContent = t(validation.error);
        error.classList.remove('hidden');
        return;
      }
      error.classList.add('hidden');

      try {
        const exists = await checkRoomExists(roomId);
        if (exists) {
          error.textContent = t('errorRoomExists');
          error.classList.remove('hidden');
          return;
        }

        currentRoom = {
          id: roomId,
          createdAt: new Date().toISOString(),
          boxes: [{ id: generateId(), type: 'text', content: '', lastModified: Date.now() }]
        };

        await saveRoom();
        showRoomView();
      } catch (e) {
        error.textContent = e.message;
        error.classList.remove('hidden');
      }
    }

    async function joinRoom() {
      const input = document.getElementById('joinRoomId');
      const error = document.getElementById('joinError');
      const roomId = input.value.trim();

      const validation = validateRoomId(roomId);
      if (!validation.valid) {
        error.textContent = t(validation.error);
        error.classList.remove('hidden');
        return;
      }
      error.classList.add('hidden');

      try {
        currentRoom = await loadRoom(roomId);
        showRoomView();
      } catch (e) {
        error.textContent = t('errorRoomNotFound');
        error.classList.remove('hidden');
      }
    }

    function showRoomView() {
      document.getElementById('entryView').classList.add('hidden');
      document.getElementById('roomView').classList.remove('hidden');
      document.getElementById('currentRoomId').textContent = currentRoom.id;
      renderBoxes();
      connectWebSocket(currentRoom.id);
    }

    function showEntryView() {
      document.getElementById('roomView').classList.add('hidden');
      document.getElementById('entryView').classList.remove('hidden');
      disconnectWebSocket();
      currentRoom = null;
    }

    // ============ Box Rendering ============

              <span class="text-box-label">${t('textBoxLabel')} ${idx + 1}</span>

      const files = box.files || [];
      const fileListHtml = files.map(f => `
        <div class="file-item">

          <div class="file-info">
            <div class="file-name" title="${escapeHtml(f.fileName)}">${escapeHtml(f.fileName)}</div>
            <div class="file-size">${formatFileSize(f.fileSize)}</div>

      return `
        <div class="text-box" data-box-id="${box.id}" data-box-type="file">
          <div class="text-box-header">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="drag-handle" title="Drag to reorder">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="5" cy="3" r="1.5"/><circle cx="11" cy="3" r="1.5"/><circle cx="5" cy="8" r="1.5"/><circle cx="11" cy="8" r="1.5"/><circle cx="5" cy="13" r="1.5"/><circle cx="11" cy="13" r="1.5"/></svg>
              </span>
              <span class="text-box-label">${t('fileBoxLabel')} ${idx + 1}</span>
            </div>
            <div style="display:flex;align-items:center;gap:2px;">
              ${files.length > 1 ? `<button class="icon-btn download-all-btn" data-box-id="${box.id}" title="${t('downloadAll')}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
              </button>` : ''}
              <label class="icon-btn add-file-label" data-box-id="${box.id}" title="${t('addFile')}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                <input type="file" multiple style="display:none" data-box-id="${box.id}" class="file-input-hidden">
              </label>
              ${canDelete ? `<button class="icon-btn delete-box-btn" data-box-id="${box.id}" title="Delete">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
              </button>` : ''}
            </div>
          </div>
          ${fileListHtml}
          <div class="upload-status-area hidden">
            <div class="upload-status-info">
              <span class="upload-status-filename"></span>
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="upload-status-pct">0%</span>
                <button class="cancel-upload-btn icon-btn" data-box-id="${box.id}" title="${t('cancelUpload')}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>

        </div>`;
    }

    function renderBoxes() {
      const container = document.getElementById('boxContainer');
      if (!currentRoom) return;

      const canDelete = currentRoom.boxes.length > 1;
      let textIdx = 0, fileIdx = 0;

      container.innerHTML = currentRoom.boxes.map((box) => {
        const boxType = box.type || 'text';
        if (boxType === 'file') {
          return renderFileBox(box, fileIdx++, canDelete);
        }
        return renderTextBox(box, textIdx++, canDelete);
      }).join('');

      // --- Text box events ---
      container.querySelectorAll('[data-box-type="text"] textarea').forEach(textarea => {
        const boxId = textarea.closest('[data-box-id]').dataset.boxId;
        textarea.addEventListener('input', () => {
          const box = currentRoom.boxes.find(b => b.id === boxId);
          if (box) {
            box.content = textarea.value;
            box.lastModified = Date.now();
            emitBoxUpdate('update', box);
          }
        });
      });

      container.querySelectorAll('.copy-box-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const box = currentRoom.boxes.find(b => b.id === btn.dataset.boxId);
          if (box) { navigator.clipboard.writeText(box.content || ''); showToast(); }
        });
      });

      // --- File box events ---
      container.querySelectorAll('.file-drop-zone').forEach(zone => {
        const boxId = zone.dataset.boxId;

        zone.addEventListener('click', () => {
          const input = zone.closest('[data-box-id]').querySelector('.file-input-hidden');
          if (input) input.click();
        });

        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          zone.classList.add('drag-active');
        });
        zone.addEventListener('dragleave', () => {
          zone.classList.remove('drag-active');
        });
        zone.addEventListener('drop', (e) => {
          e.preventDefault();
          e.stopPropagation();
          zone.classList.remove('drag-active');
          if (e.dataTransfer.files.length > 0) {
            handleFilesForBox(boxId, e.dataTransfer.files);
          }
        });
      });

      container.querySelectorAll('.file-input-hidden').forEach(input => {
        input.addEventListener('change', () => {
          if (input.files.length > 0) {
            const boxId = input.dataset.boxId;
            handleFilesForBox(boxId, input.files);
          }
        });
      });

      container.querySelectorAll('.download-single-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const boxId = btn.closest('[data-box-id]').dataset.boxId;
          const fileId = btn.dataset.fileId;
          const fileName = btn.dataset.fileName;
          const url = API_CONFIG.getUrl(`/textshare/${currentRoom.id}/files/${fileId}`);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          a.click();
          emitActivity('download_start', boxId);
          setTimeout(() => emitActivity('download_end', boxId), 2000);
        });
      });

      container.querySelectorAll('.download-all-btn').forEach(btn => {
        btn.addEventListener('click', () => downloadBoxFiles(btn.dataset.boxId));
      });

      container.querySelectorAll('.remove-file-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const boxId = btn.closest('[data-box-id]').dataset.boxId;
          removeFileFromBox(boxId, btn.dataset.fileId);
        });
      });

      container.querySelectorAll('.cancel-upload-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          cancelUpload(btn.dataset.boxId);
        });
      });

      // --- Delete buttons (shared) ---
      container.querySelectorAll('.delete-box-btn').forEach(btn => {
        btn.addEventListener('click', () => removeBox(btn.dataset.boxId));
      });

      // --- Drag-and-drop reorder (shared) ---
      container.querySelectorAll('.text-box').forEach(boxEl => {
        const boxId = boxEl.dataset.boxId;
        const handle = boxEl.querySelector('.drag-handle');

        handle.addEventListener('mousedown', () => {
          boxEl.setAttribute('draggable', 'true');
        });

        boxEl.addEventListener('dragstart', (e) => {
          if (!boxEl.getAttribute('draggable') || boxEl.getAttribute('draggable') === 'false') return;
          dragSrcId = boxId;
          e.dataTransfer.effectAllowed = 'move';
          setTimeout(() => boxEl.style.opacity = '0.4', 0);
        });

        boxEl.addEventListener('dragend', () => {
          boxEl.style.opacity = '';
          boxEl.setAttribute('draggable', 'false');
          dragSrcId = null;
          container.querySelectorAll('.text-box').forEach(el => el.classList.remove('drag-over'));
        });

        boxEl.addEventListener('dragover', (e) => {
          if (!dragSrcId) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          container.querySelectorAll('.text-box').forEach(el => el.classList.remove('drag-over'));
          if (dragSrcId !== boxId) boxEl.classList.add('drag-over');
        });

        boxEl.addEventListener('drop', (e) => {
          if (!dragSrcId || dragSrcId === boxId) return;
          e.preventDefault();
          const srcIdx = currentRoom.boxes.findIndex(b => b.id === dragSrcId);
          const dstIdx = currentRoom.boxes.findIndex(b => b.id === boxId);
          if (srcIdx < 0 || dstIdx < 0) return;
          const [moved] = currentRoom.boxes.splice(srcIdx, 1);
          currentRoom.boxes.splice(dstIdx, 0, moved);
          dragSrcId = null;
          renderBoxes();
          emitBoxUpdate('reorder', { order: currentRoom.boxes.map(b => b.id) });
        });
      });

      restoreActiveUploads();
      remoteActivity.forEach((_, boxId) => renderRemoteActivityForBox(boxId));
    }

    function addTextBoxAtEnd() {
      if (!currentRoom) return;
      const newBox = { id: generateId(), type: 'text', content: '', lastModified: Date.now() };
      currentRoom.boxes.push(newBox);
      renderBoxes();
      emitBoxUpdate('add', newBox);
      const newTextarea = document.querySelector(`[data-box-id="${newBox.id}"] textarea`);
      if (newTextarea) newTextarea.focus();
    }

    function addFileBoxAtEnd() {
      if (!currentRoom) return;
      const newBox = { id: generateId(), type: 'file', files: [], lastModified: Date.now() };
      currentRoom.boxes.push(newBox);
      renderBoxes();
      emitBoxUpdate('add', newBox);
    }

    function removeBox(boxId) {
      if (!currentRoom || currentRoom.boxes.length <= 1) return;
      const box = currentRoom.boxes.find(b => b.id === boxId);
      if (!box) return;

      if (box.type === 'file' && box.files) {
        box.files.forEach(f => {
          fetch(API_CONFIG.getUrl(`/textshare/${currentRoom.id}/files/${f.fileId}`), {
            method: 'DELETE',
            headers: { 'ngrok-skip-browser-warning': 'true' }
          }).catch(() => {});
        });
      }

      cancelUpload(boxId);
      activeUploads.delete(boxId);
      remoteActivity.delete(boxId);
      currentRoom.boxes = currentRoom.boxes.filter(b => b.id !== boxId);
      renderBoxes();
      emitBoxUpdate('delete', box);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showToast() {
      showToastMsg(t('copied'));
    }

    function showToastMsg(msg) {
      const toast = document.getElementById('copyToast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    // ============ Event Listeners ============
    document.getElementById('createBtn').onclick = createRoom;
    document.getElementById('joinBtn').onclick = joinRoom;
    document.getElementById('backToEntry').onclick = showEntryView;
    document.getElementById('langSwitchEntry').onclick = toggleLang;
    document.getElementById('langSwitchRoom').onclick = toggleLang;
    document.getElementById('addTextBoxBtn').onclick = addTextBoxAtEnd;
    document.getElementById('addFileBoxBtn').onclick = addFileBoxAtEnd;

    document.getElementById('copyCodeBtn').onclick = () => {
      navigator.clipboard.writeText(currentRoom.id);
      showToast();
    };

    document.getElementById('newRoomId').onkeydown = (e) => {
      if (e.key === 'Enter') createRoom();
    };
    document.getElementById('joinRoomId').onkeydown = (e) => {
      if (e.key === 'Enter') joinRoom();
    };

    updateUI();
  </script>
</body>
</html>
